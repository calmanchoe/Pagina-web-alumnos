/* =====================================================================
   META DIARIA Y RACHA DE DÍAS
   Cada pregunta contestada suma al día de hoy (fecha local). La racha son
   los días seguidos con la meta cumplida; hoy cuenta en cuanto se cumple.
   ===================================================================== */
const DAY_GOAL=20;
/* la práctica rápida es corta (5 a 10 preguntas) aunque falten más para la meta */
function quickSize(){ return Math.min(10,Math.max(5,DAY_GOAL-todayCount())); }
function dayKey(d){ d=d||new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function dayShift(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }
function todayCount(st){ return ((st||S).days||{})[dayKey()]||0; }
/* La racha se cuenta hacia atrás desde hoy (o desde ayer si hoy aún no se ha
   cumplido la meta). Un día protegido con escudo no corta la racha, pero
   tampoco suma. Devuelve los días cumplidos y cuántos días ocupa. */
function chainInfo(st){
  st=st||S; const days=st.days||{}, sh=st.shields||{};
  let k=(days[dayKey()]||0)>=DAY_GOAL?0:-1, n=0;
  const keys=[];
  for(;;){
    const key=dayKey(dayShift(k));
    if((days[key]||0)>=DAY_GOAL){ n++; keys.push(key); }
    else if(!sh[key]) break;
    k--; if(k<-4000) break;
  }
  return {n, span:-k, keys};
}
function dayStreak(st){ return chainInfo(st).n; }
function countDay(){
  S.days=S.days||{};
  const k=dayKey(), before=S.days[k]||0;
  S.days[k]=before+1;
  /* se guardan los últimos 60 días y, si la racha es más larga, toda la racha
     (si no, nunca se podría llegar a los 84 días del regalo legendario) */
  const cut=dayKey(dayShift(-Math.max(60,chainInfo().span+1)));
  Object.keys(S.days).forEach(d=>{ if(d<cut) delete S.days[d]; });
  Object.keys(S.shields||{}).forEach(d=>{ if(d<cut) delete S.shields[d]; });
  if(before<DAY_GOAL && before+1>=DAY_GOAL) goalReached();
}

/* ---------- escudo de racha ----------
   Si ayer (o como mucho los dos últimos días) no se llegó a la meta y había
   racha, al entrar se le pregunta al alumno si quiere gastar 3 🎟️ por día
   para salvarla. Nunca se gasta solo. */
const SHIELD_COST=3, SHIELD_MAX=2;
/* el hueco que se podría proteger ahora mismo, o null */
function shieldOffer(){
  if(!PROFILE) return null;
  S.shields=S.shields||{}; S.days=S.days||{}; S.noShield=S.noShield||{};
  const real=k=>(S.days[k]||0)>=DAY_GOAL, ok=k=>real(k)||S.shields[k];
  const gap=[];
  for(let k=-1;k>=-(SHIELD_MAX+1);k--){ const key=dayKey(dayShift(k)); if(ok(key)) break; gap.push(key); }
  if(!gap.length||gap.length>SHIELD_MAX) return null;
  if(gap.some(d=>S.noShield[d])) return null;          /* ya dijo que no */
  /* antes del hueco tiene que haber racha; y nunca más de 2 días protegidos seguidos */
  let k=-gap.length-1, prev=0;
  while(S.shields[dayKey(dayShift(k))]){ prev++; k--; }
  if(!real(dayKey(dayShift(k))) || prev+gap.length>SHIELD_MAX) return null;
  const sh=Object.assign({},S.shields); gap.forEach(d=>sh[d]=1);
  const saved=dayStreak({days:S.days, shields:sh});
  return {gap, cost:SHIELD_COST*gap.length, saved};
}
function useShield(o){
  if(S.tokens<o.cost) return;
  o.gap.forEach(d=>S.shields[d]=1);
  S.tokens-=o.cost;
  S.stats.shieldsUsed=(S.stats.shieldsUsed||0)+o.gap.length;
  save(); SFX.play("token");
  toast(`🛡️ ¡Racha salvada! Sigues con ${o.saved} día${o.saved===1?"":"s"} seguidos (−${o.cost} 🎟️)`);
}
function declineShield(o){ S.noShield=S.noShield||{}; o.gap.forEach(d=>S.noShield[d]=1); save(); }
/* la pregunta, al entrar en Inicio */
function askShield(){
  const o=shieldOffer();
  if(!o||document.getElementById("shieldpop")) return;
  const can=S.tokens>=o.cost;
  const el=document.createElement("div");
  el.id="shieldpop"; el.className="giftpop";
  el.innerHTML=`<div class="gp-card g-shield" role="dialog" aria-modal="true" aria-labelledby="sp-t">
    <div class="gp-box" aria-hidden="true" style="animation:none">🛡️</div>
    <div class="gp-tier">Escudo de racha</div>
    <h2 id="sp-t">¡Tu racha está en peligro!</h2>
    <p>${o.gap.length===1?"Ayer no llegaste":"Estos "+o.gap.length+" días no llegaste"} a la meta. ¿Quieres usar el escudo para salvar tu racha de <b>${o.saved} día${o.saved===1?"":"s"}</b>?</p>
    <div class="gp-prize">Cuesta ${o.cost} 🎟️ · tienes ${S.tokens}</div>
    ${can?`<button class="bigbtn white" id="sp-yes">🛡️ Usar escudo (−${o.cost} 🎟️)</button>`
         :`<p style="font-weight:700">No te llegan los tokens: te faltan ${o.cost-S.tokens} 🎟️.</p>`}
    <button class="softbtn" id="sp-no" style="width:100%">${can?"Dejar que se pierda":"Vale"}</button>
  </div>`;
  document.body.appendChild(el);
  const close=()=>{ el.remove(); render(); };
  const yes=el.querySelector("#sp-yes");
  if(yes){ yes.onclick=()=>{ useShield(o); close(); }; yes.focus({preventScroll:true}); }
  el.querySelector("#sp-no").onclick=()=>{ declineShield(o); close(); toast("Racha nueva: ¡a por ella! 🔥"); };
  if(!yes) el.querySelector("#sp-no").focus({preventScroll:true});
}
function shieldReady(){ return S.tokens>=SHIELD_COST; }

/* ---------- regalos de racha ----------
   Temporada de 12 semanas: un regalo por semana de racha, sin que coincidan
   nunca dos el mismo día. Al acabar la semana 12 empieza otra temporada. */
const GIFTS={
  common:{name:"Regalo",           label:"Regalo semanal", tok:2,  short:"+2 🎟️ y pegatina"},
  rare:  {name:"Regalo raro",      label:"Raro",           tok:3,  short:"+3 🎟️ y XP doble"},
  epic:  {name:"Regalo épico",     label:"Épico",          tok:5,  short:"+5 🎟️ y color nuevo"},
  legend:{name:"Regalo legendario",label:"Legendario",     tok:10, short:"+10 🎟️ y premio real"}
};
const SEASON=["common","rare","common","epic","common","rare","common","epic","common","rare","common","legend"];
function giftTier(n){ if(n<=0||n%7) return null; return SEASON[(n/7-1)%12]; }
/* primer día de racha, después de «after», en que toca un regalo de ese tipo */
function nextTierDay(after,tier){ let w=Math.floor(after/7)+1; while(giftTier(w*7)!==tier) w++; return w*7; }
function seasonPos(ds){
  const season=ds>0?Math.floor((ds-1)/84):0, into=ds-season*84;
  return {season:season+1, weeks:Math.floor(into/7), day:into%7};
}
function seasonMap(){
  const ds=dayStreak(), p=seasonPos(ds);
  const cur=p.weeks<12?p.weeks+1:0;
  return `<div class="season" role="img" aria-label="Temporada ${p.season}: ${p.weeks} de 12 semanas completadas">${SEASON.map((t,k)=>{
    const w=k+1, done=w<=p.weeks, now=w===cur;
    return `<span class="sw g-${t} ${done?"done":""} ${now?"now":""}" title="Semana ${w}: ${GIFTS[t].name.toLowerCase()} (${GIFTS[t].short})${done?" · conseguido":now?" · en curso":""}"><i aria-hidden="true">🎁</i><b>S${w}</b></span>`;
  }).join("")}</div>
  <div class="f15" style="color:var(--soft)">${cur?`Temporada ${p.season} · semana ${cur} de 12 · día ${p.day} de 7 esta semana.`:`¡Temporada ${p.season} completada! Mañana empieza la siguiente.`}</div>`;
}

/* pegatinas: cada regalo da una de su categoría (primero las que faltan) */
/* Pegatinas del álbum: imágenes en stickers/<id>.webp, hechas con Gemini. */
const STICKER_DEFS={
  common:[["balon","Balón"],["botas","Botas de fútbol"],["guantes","Guantes de portero"],["silbato","Silbato"],["mando","Mando"],
          ["cascos","Cascos gaming"],["skate","Monopatín"],["baloncesto","Balón de baloncesto"],["zapatillas","Zapatillas"],["movil","Móvil"]],
  rare:  [["estadio","Estadio de noche"],["gol","¡Gol!"],["tarjetas","Amarilla y roja"],["arcade","Máquina recreativa"],
          ["portatil","Consola portátil"],["teclado","Teclado y ratón"],["vr","Gafas de realidad virtual"],["dron","Dron"]],
  epic:  [["chilena","Chilena"],["pc","PC gaming"],["medalla","Medalla de campeón"],["fuego","Balón en llamas"],["espada","Espada y escudo"],["coche","Deportivo"]],
  legend:[["copa","Copa de oro"],["balon-dorado","Balón dorado"],["mando-dorado","Mando dorado"],["bota-dorada","Bota dorada"]]
};
const STICKERS={}, STICKER_INFO={};
Object.entries(STICKER_DEFS).forEach(([t,l])=>{ STICKERS[t]=l.map(x=>x[0]); l.forEach(([id,name])=>STICKER_INFO[id]={id,name,tier:t}); });
const STICKER_ORDER=Object.values(STICKERS).flat();
const STICKER_TOTAL=STICKER_ORDER.length;
/* Antes las pegatinas eran emojis: cada uno pasa a la pegatina nueva que
   ocupa su misma posición dentro de su categoría. No se pierde ninguna. */
const OLD_STICKERS={
  common:["🐶","🐱","🐰","🦊","🐼","🐨","🐸","🐵","🐧","🐢"],
  rare:  ["🏰","🚌","☕","🎡","☂️","🫖","⛵","💂"],
  epic:  ["🦁","🐉","🦄","🦅","🐳","🚀"],
  legend:["👑","🏆","💎","🌟"]
};
function migrateStickers(st){
  if(!st||!st.stickers) return st;
  let changed=false; const out={};
  Object.entries(st.stickers).forEach(([k,v])=>{
    let id=k;
    for(const t in OLD_STICKERS){ const i=OLD_STICKERS[t].indexOf(k); if(i>=0){ id=STICKERS[t][i]; changed=true; break; } }
    out[id]=(out[id]||0)+v;
  });
  if(changed) st.stickers=out;
  return st;
}
function drawSticker(t){
  const own=S.stickers=S.stickers||{}, pool=STICKERS[t];
  const fresh=pool.filter(e=>!own[e]), from=fresh.length?fresh:pool;
  const id=from[Math.floor(Math.random()*from.length)];
  own[id]=(own[id]||0)+1;
  S.stickerAt=S.stickerAt||{}; if(!S.stickerAt[id]) S.stickerAt[id]=Date.now();
  return {id, isNew:fresh.length>0};
}
function stickerImg(id,cls){
  const i=STICKER_INFO[id];
  return `<img class="${cls||""}" src="stickers/${id}.webp" alt="${esc(i?i.name:id)}" loading="lazy" decoding="async" draggable="false">`;
}
/* colores de la app: los épicos desbloquean uno nuevo y el legendario, el dorado */
const ACCENTS=[
  {id:"azul",  name:"Azul",   band:"#2547B8"},
  {id:"verde", name:"Verde",  band:"#17834A"},
  {id:"morado",name:"Morado", band:"#6A35C2"},
  {id:"coral", name:"Coral",  band:"#B9402B"},
  {id:"dorado",name:"Dorado", band:"#8F6600"}
];
function unlockedAccents(st){ st=st||S; return ACCENTS.filter(a=>a.id==="azul"||(st.themes||[]).includes(a.id)); }
function applyAccent(){
  const a=PROFILE&&S.accent?ACCENTS.find(x=>x.id===S.accent):null;
  if(a&&a.id!=="azul") document.documentElement.style.setProperty("--band",a.band);
  else document.documentElement.style.removeProperty("--band");
}
const TITLES=["Leyenda de la gramática","Maestro del inglés","Sabio de los verbos","Gran campeón"];
function boostToday(){ return S.boostDay===dayKey(); }

/* lo que trae cada regalo; devuelve las líneas para la celebración */
function openGift(t,n){
  const g=GIFTS[t], lines=[];
  S.gifts=S.gifts||{}; S.gifts[t]=(S.gifts[t]||0)+1;
  S.tokens+=g.tok; lines.push(`+${g.tok} 🎟️`);
  const st=drawSticker(t); lines.sticker=st.id; lines.push(`Pegatina «${STICKER_INFO[st.id].name}»${st.isNew?" (¡nueva!)":" (repetida)"}`);
  if(t==="rare"){ S.boostDay=dayKey(dayShift(1)); lines.push("⚡ XP doble todo el día de mañana"); }
  if(t==="epic"){
    S.themes=S.themes||[];
    const c=ACCENTS.find(a=>!["azul","dorado"].includes(a.id)&&!S.themes.includes(a.id));
    if(c){ S.themes.push(c.id); S.accent=c.id; lines.push(`🎨 Color nuevo: ${c.name} (cámbialo en Progreso)`); }
  }
  if(t==="legend"){
    S.themes=S.themes||[];
    if(!S.themes.includes("dorado")){ S.themes.push("dorado"); S.accent="dorado"; lines.push("✨ Tema dorado"); }
    S.titles=S.titles||[];
    const ti=TITLES[S.titles.length]; if(ti){ S.titles.push(ti); lines.push(`🏷️ Título: «${ti}»`); }
    S.prizes=S.prizes||[]; S.prizes.push({ts:Date.now(),n});
    lines.push("🏆 Un premio real: pídeselo a tu profe");
  }
  return lines;
}
function goalReached(){
  const n=dayStreak();
  S.bestDays=Math.max(S.bestDays||0,n);
  const t=giftTier(n);
  if(n===3) S.tokens+=1;                     /* un token a los 3 días */
  addXP(20,1);
  const lines=t?openGift(t,n):null;
  if(run) run.goalHit=true;
  applyAccent();
  setTimeout(()=>{
    SFX.play("levelup");
    toast("🎯 ¡Meta de hoy cumplida! +20 XP"+(n===3?" · +1 🎟️":"")+" · 🔥 "+n+" día"+(n===1?"":"s")+" seguido"+(n===1?"":"s"));
  },700);
  if(t) setTimeout(()=>showGift(t,n,lines),1300);
}
function showGift(t,n,lines){
  const g=GIFTS[t], old=document.getElementById("giftpop"); if(old) old.remove();

    ${lines&&lines.sticker?`<div class="gp-stk tier-${t}">${stickerImg(lines.sticker)}<i class="foil" style="${maskFor(lines.sticker)}"></i></div>`:""}
    <ul class="gp-list">${(lines||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <button class="bigbtn white" id="gp-ok">¡Genial!</button>
  </div>`;
  document.body.appendChild(el);

  const ok=el.querySelector("#gp-ok"); ok.onclick=close; ok.focus({preventScroll:true});
  el.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
}

/* La pegatina en grande: una carta en 3D que se inclina al mover el dedo o el
   ratón (o el móvil) y que se da la vuelta para ver cuándo se consiguió. */
function openSticker(id){
  const info=STICKER_INFO[id]; if(!info) return;
  const t=info.tier, n=(S.stickers||{})[id]||0, at=(S.stickerAt||{})[id];
  const fecha=at?new Date(at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}):null;
  const num=STICKER_ORDER.indexOf(id)+1;
  const old=document.getElementById("stkview"); if(old) old.remove();
  const el=document.createElement("div");
  el.id="stkview"; el.className="stkview";
  el.innerHTML=`<div class="sv-scene" id="sv-scene">
      <div class="sv-card tier-${t}" id="sv-card" role="img" aria-label="${esc(info.name)}">
        <div class="sv-face sv-front">
          <div class="sv-art">${stickerImg(id)}<i class="foil" style="${maskFor(id)}"></i></div>
          <div class="sv-name">${esc(info.name)}</div>
          <i class="sv-glare"></i>
        </div>
        <div class="sv-face sv-back">
          <div class="sv-tier">${GIFTS[t].label}</div>
          <div class="sv-bname">${esc(info.name)}</div>
          <div class="sv-date">${fecha?`Conseguida el<br><b>${fecha}</b>`:`Conseguida antes de que<br>el álbum guardara la fecha`}</div>
          ${n>1?`<div class="sv-rep">La tienes repetida ×${n}</div>`:""}
          <div class="sv-num">Nº ${num} de ${STICKER_TOTAL}</div>
        </div>
      </div>
    </div>
    <div class="sv-acts">
      <button class="bigbtn white" id="sv-flip">↻ Dar la vuelta</button>
      <button class="softbtn" id="sv-close">Cerrar</button>
    </div>`;
  document.body.appendChild(el);
  const card=el.querySelector("#sv-card"), scene=el.querySelector("#sv-scene");
  let flipped=false;
  const flip=()=>{ flipped=!flipped; card.classList.toggle("flipped",flipped); SFX.play("swoosh"); };
  const tilt=(x,y)=>{   /* x, y entre 0 y 1 */
    card.style.setProperty("--rx",((0.5-y)*26).toFixed(1)+"deg");
    card.style.setProperty("--ry",((x-0.5)*30).toFixed(1)+"deg");
    card.style.setProperty("--mx",(x*100).toFixed(1)+"%");
    card.style.setProperty("--my",(y*100).toFixed(1)+"%");
  };
  const rest=()=>{ card.classList.remove("live"); tilt(0.5,0.5); };
  scene.addEventListener("pointermove",e=>{ const r=scene.getBoundingClientRect(); card.classList.add("live");
    tilt(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))); });
  scene.addEventListener("pointerleave",rest);
  let moved=0;
  scene.addEventListener("pointerdown",()=>{ moved=0; });
  scene.addEventListener("pointermove",()=>{ moved++; });
  scene.addEventListener("click",()=>{ if(moved<6) flip(); });
  /* en el móvil, al inclinarlo (donde el navegador lo permite sin pedir permiso) */
  const orient=e=>{ if(e.gamma==null) return; card.classList.add("live");
    tilt(Math.min(1,Math.max(0,0.5+e.gamma/50)),Math.min(1,Math.max(0,0.5+(e.beta-40)/50))); };
  window.addEventListener("deviceorientation",orient);
  const close=()=>{ window.removeEventListener("deviceorientation",orient); el.remove(); };
  el.querySelector("#sv-flip").onclick=flip;
  el.querySelector("#sv-close").onclick=close;
  el.addEventListener("click",e=>{ if(e.target===el) close(); });
  el.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  rest(); el.querySelector("#sv-flip").focus({preventScroll:true});
  SFX.play("pick");
}

const WD=["D","L","M","X","J","V","S"];
function weekDots(st){
  const days=(st||S).days||{}, sh=(st||S).shields||{};
  return `<div class="week" role="img" aria-label="Últimos 7 días">${[-6,-5,-4,-3,-2,-1,0].map(k=>{
    const d=dayShift(k), key=dayKey(d), n=days[key]||0;
    return `<span class="wd ${n>=DAY_GOAL?"on":sh[key]?"shield":n>0?"some":""} ${k===0?"today":""}" title="${d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric"})}: ${n} pregunta${n===1?"":"s"}${sh[key]?" · escudo":""}"><i>${n>=DAY_GOAL?"🔥":sh[key]?"🛡️":n>0?n:""}</i><b>${WD[d.getDay()]}</b></span>`;
  }).join("")}</div>`;
}
/* camino hacia el regalo: los 7 días de la tanda de racha en curso, con su
   letra de día; el 7.º es el regalo. Los días que faltan salen vacíos. */
function streakPath(st){
  st=st||S;
  const days=st.days||{}, doneToday=(days[dayKey()]||0)>=DAY_GOAL;
  const ci=chainInfo(st), ds=ci.n, pos=ds%7;
  const idx=doneToday?(pos===0?7:pos):pos+1;      /* posición de hoy en la tanda, de 1 a 7 */
  const got=doneToday?idx:idx-1;                   /* días ya cumplidos de la tanda */
  const tier=giftTier(ds-got+7), G=GIFTS[tier], gname=G.name.toLowerCase();
  const slots=[1,2,3,4,5,6,7].map(k=>{
    const off=k-idx;
    /* los días pasados son los de la racha (saltando los del escudo) */
    const d=off<0?new Date(ci.keys[(doneToday?0:-1)+idx-k]+"T12:00:00"):dayShift(off);
    const n=days[dayKey(d)]||0;
    const done=off<0||(off===0&&doneToday);
    const gift=k===7;
    const inner=gift?"🎁":done?"🔥":off===0&&n>0?n:"";
    const tip=gift?`Día ${ds-got+7} de racha: ${gname} (${G.short})`:`${d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric"})}${off===0?" (hoy)":""}: ${off>0?"por llegar":n+" pregunta"+(n===1?"":"s")}`;
    return `<span class="wd ${done?"on":""} ${off===0&&!done&&n>0?"some":""} ${off===0?"today":""} ${gift?"gift g-"+tier:""}" title="${tip}"><i>${inner}</i><b>${WD[d.getDay()]}</b></span>`;
  }).join("");
  const left=7-got, plus=`<span style="white-space:nowrap">(${G.short})</span>`;
  const tname=tier==="common"?"el regalo":`el <b class="tn g-${tier}">${gname}</b>`;
  const note=got===7?`🎁 ¡${G.name} conseguido!`:`🎁 Faltan ${left} días para ${tname} ${plus}`;
  return `<div class="week" role="img" aria-label="Racha: ${got} de 7 días hacia el regalo">${slots}</div><div class="giftnote">${got===7||left>1?note:(doneToday?`🎁 Mañana toca ${tname} si cumples la meta ${plus}`:`🎁 ¡Hoy toca ${tname} si cumples la meta! ${plus}`)}</div>`;
}
function goalCard(){
  const n=todayCount(), ds=dayStreak(), done=n>=DAY_GOAL, left=DAY_GOAL-n;
  const q=quickSize();
  const msg=done?`¡Meta cumplida! Vuelve mañana para llegar a ${ds+1} días seguidos.`
    :ds>0?`Te ${left===1?"falta 1 pregunta":"faltan "+left+" preguntas"} para no perder tu racha de ${ds} día${ds===1?"":"s"}.`
    :`Haz ${left} pregunta${left===1?"":"s"} hoy y empieza una racha 🔥`;
  const extras=[
    boostToday()?`<span class="pill boost">⚡ Hoy, XP doble</span>`:"",
    ds>0&&!done?(shieldReady()?`<span class="pill shield" title="Si hoy no llegas a la meta, mañana podrás usar el escudo (${SHIELD_COST} 🎟️) para salvar la racha">🛡️ Escudo disponible</span>`:`<span class="pill noshield" title="Necesitas ${SHIELD_COST} 🎟️ para el escudo">🛡️ Sin escudo (${SHIELD_COST} 🎟️)</span>`):""
  ].join("");
  return `<div class="card goal ${done?"done":ds>0?"risk":""}">
    <div class="row" style="align-items:baseline"><span class="eyeb">META DE HOY</span><span class="gt">${done?"✓ ":""}${Math.min(n,DAY_GOAL)} / ${DAY_GOAL}</span></div>
    <div class="bar paper"><i style="width:${Math.min(100,n/DAY_GOAL*100)}%"></i></div>
    <div class="gmsg">${msg}</div>
    ${extras?`<div class="pills">${extras}</div>`:""}
    ${streakPath()}
    <button class="bigbtn ${done?"soft2":""}" data-act="quick">▶ Práctica rápida · ${q} preguntas</button>
  </div>`;
}
/* práctica rápida: primero fallos pendientes, luego lo que aún no domina */
function startQuick(q){
  const mine=myItems();
  if(!mine.length){ toast("Aún no hay preguntas para "+me().name+"."); return; }
  const wrong=shuffle(S.wrong.map(id=>INDEX[id]).filter(it=>it&&(isTest()||it.ex.unit.owner===PROFILE))).slice(0,Math.ceil(q/2));
  const fresh=shuffle(mine.filter(it=>S.ex[it.id]!=="ok"&&!wrong.includes(it)));
  const rest=shuffle(mine.filter(it=>!wrong.includes(it)&&!fresh.includes(it)));
  startRun(shuffle([...wrong,...fresh,...rest].slice(0,q)),{title:"Práctica rápida",key:null});
}

   nube falla o no tiene nada, de la copia de este navegador (que puede ser
   vieja). Se apunta para avisarlo en la tarjeta. */
let LOADINFO={};
async function loadStudent(id){
  let d=null, src="none", err="";
  if(window.CLOUD && id!==TEST.id){
    try{ d=await CLOUD.load(id); src=d?"cloud":"cloud-empty"; }
    catch(e){ err=(e&&e.code)||"error"; console.warn("Panel del profe: no se pudo leer "+id+" de la nube:",e); }
  }
  if(!d){ try{ const raw=localStorage.getItem("cuaderno-arcade-v3-"+id); if(raw){ d=JSON.parse(raw); src=src==="cloud-empty"?"cloud-empty-local":"local"; } }catch(e){} }
  LOADINFO[id]={src, err, at:Date.now()};
  return d?hydrate(d):null;
}
function sourceNote(p,d){
  const i=LOADINFO[p.id]||{}, hora=new Date(i.at||Date.now()).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  const copia=d&&d.updatedAt?" (la copia es del "+fecha(d.updatedAt)+")":"";
  if(p.id===TEST.id) return `<div class="srcnote">🧪 Solo en este navegador</div>`;
  if(i.src==="cloud") return `<div class="srcnote">☁︎ Datos de la nube, leídos a las ${hora}</div>`;
  if(!window.CLOUD) return `<div class="srcwarn">⚠️ No hay conexión con la nube: ${d?"lo que ves es una copia guardada en este navegador"+copia+", puede estar desactualizada":"no se puede ver su progreso"}.</div>`;
  if(i.err==="permission-denied"){
    const em=(CLOUD.email&&CLOUD.email())||"(sin sesión)";
    return `<div class="srcwarn">⚠️ La nube no te deja leer el progreso de ${p.name} (permiso denegado). ${d?"Lo que ves es una copia vieja de este navegador"+copia+".":""}
      Revisa en Firebase → Firestore → Reglas que el correo del profe sea exactamente <b>${esc(em)}</b>, en minúsculas.</div>`;
  }
  if(i.err) return `<div class="srcwarn">⚠️ No se ha podido leer de la nube (${esc(i.err)}). ${d?"Lo que ves es una copia de este navegador"+copia+", puede estar desactualizada.":""} Prueba con 🔄.</div>`;

  return "";
}
function statsFor(p, d){
  const units=UNITS.filter(u=>p.id===TEST.id||u.owner===p.id);
  const items=units.flatMap(u=>u.exercises.flatMap(e=>e.items));
  const ok=d?items.filter(i=>d.ex[i.id]==="ok").length:0;
  const levels={};
  units.forEach(u=>u.exercises.forEach(e=>{
    const L=e.lvl||1;
    levels[L]=levels[L]||{ok:0,tot:0};
    e.items.forEach(i=>{ levels[L].tot++; if(d&&d.ex[i.id]==="ok") levels[L].ok++; });
  }));
  const acc=d&&d.stats.answers?Math.round(d.stats.correct/d.stats.answers*100):0;
  const wrong=(d?d.wrong:[]).map(id=>INDEX[id]).filter(Boolean);
  return {units, items, ok, levels, acc, wrong, d};
}

/* =====================================================================
   REVISIÓN DE UN ALUMNO · ejercicios y respuestas, solo lectura
   ===================================================================== */
let TDATA={};   /* progreso de cada alumno, cargado al abrir el panel */
function tdata(id){ return TDATA[id]||hydrate({}); }
function lastAtt(d,it){ const a=(d.answers||{})[it.id]; return a&&a.length?a[a.length-1]:null; }
const clean=a=>!!a&&a.r==="ok"&&!a.s;
function firstAtt(d,it){ const a=(d.answers||{})[it.id]; return a&&a.length?a[0]:null; }
/* ok (a la primera) · rec (acertada, pero no a la primera) · ko · mid (casi / dada por buena) */
function itemState(d,it){
  const a=lastAtt(d,it);
  if(a){
    if(a.s) return "mid";
    if(a.r==="ok") return clean(firstAtt(d,it))?"ok":"rec";
    return a.r==="near"?"mid":"ko";
  }
  const e=d.ex[it.id]; return e==="ok"?"ok":e==="ko"?"ko":e==="self"?"mid":"";
}
function stableShuffle(arr,seed){
  let s=0; for(const c of String(seed)) s=(s*31+c.charCodeAt(0))>>>0;
  const r=arr.slice();
  for(let i=r.length-1;i>0;i--){ s=(s*1664525+1013904223)>>>0; const j=s%(i+1); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function attSummary(it,a){
  if(a.r==="rev") return "vio la respuesta sin contestar";
  if(it.t==="choice") return a.p!=null&&a.p>=0?"«"+it.opts[a.p]+"»":"—";
  if(it.t==="match") return (a.e||0)+" fallo(s) al emparejar";
  const v=Array.isArray(a.v)?a.v.join(" / "):(a.v||"");
  return v?"«"+v+"»":"(en blanco)";
}
function escAttr(s){ return esc(String(s==null?"":s)).replace(/"/g,"&quot;"); }
function modelOf(it){
  if(it.t==="choice") return it.opts[it.a[0]];
  if(it.t==="fill") return it.a.map(t=>expand(t[0])[0]).join(" / ");
  if(it.t==="write") return (it.lead?it.lead+" ":"")+expand(it.a[0])[0];
  return "Todas emparejadas";
}

/* lo que ve el profe de una pregunta: igual que dentro del ejercicio, con las
   respuestas del alumno puestas y todo desactivado */
function reviewBody(it,att){
  const ex=it.ex, has=!!att, L="ABCDEFGHI";
  const rev=has&&att.r==="rev";
  const vals=has&&Array.isArray(att.v)?att.v:[];
  const bank=ex.bank?`<div class="instr" style="margin-top:8px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:"";
  if(it.t==="choice"){
    const pick=has&&att.p!=null?att.p:-1;
    const seen=has&&Array.isArray(att.o)&&att.o.length===it.opts.length;
    /* si no se guardó el orden (respuestas antiguas) se baraja sin letras, para no enseñar siempre la correcta arriba */
    const order=seen?att.o:stableShuffle(it.opts.map((_,i)=>i),it.id);
    return `<div class="stem">${esc(it.q).replace(/___/g,'<span style="color:var(--ink-faint)">______</span>')}</div>
    <div class="opts ${it.opts.length>4?"bank":""}">
      ${order.map((k,pos)=>{
        const o=it.opts[k], right=it.a.includes(k); let cls="";
        if(has&&right) cls="ok"; if(k===pick&&!right) cls="no";
        return `<button class="opt ${cls}" disabled><span class="key">${seen?L[pos]:"•"}</span><span>${esc(o)}</span>${k===pick?'<span class="rv-tag">respuesta del alumno</span>':""}</button>`;
      }).join("")}
    </div>`;
  }
  if(it.t==="fill"){
    let n=0;
    const stem=esc(it.q).replace(/___/g,()=>{
      const k=n++, v=vals[k]; let cls="";
      if(has&&!rev&&v!=null) cls=judge(v,it.a[k])==="ok"?"ok":"no";
      return `<input class="blank ${cls}" value="${escAttr(v)}" disabled>`;
    });
    return `<div class="stem">${stem}</div>
      ${it.hint?`<div style="margin-top:12px" class="instr">Pista: <span class="hint" style="font-family:var(--f-mono)">${esc(it.hint)}</span></div>`:""}${bank}`;
  }
  if(it.t==="write"){
    const v=has&&typeof att.v==="string"?att.v:"";
    const cls=has&&!rev?(judge(v,it.a,it.lead)==="ok"?"ok":"no"):"";
    return `<div class="stem">${esc(it.q)}</div>${bank}
      <div class="answerline">
        ${it.lead?`<div class="stem lead" style="font-size:15px">${esc(it.lead)} …</div>`:""}
        <input class="${cls}" value="${escAttr(v)}" placeholder="${has?"(sin escribir nada)":""}" disabled>
      </div>`;
  }
  /* match */
  return `<div class="stem" style="font-size:16px">${esc(it.q)}</div>
    <div class="mcol" style="margin-top:14px">${it.pairs.map((q,k)=>`<div class="mitem done"><span class="tag">${k+1}</span>${esc(q[0])} <b>→</b> ${esc(q[1])}</div>`).join("")}</div>
    ${has&&!rev?(att.e?`<p class="fb-note" style="margin-top:12px;display:block;line-height:1.55">Fallos al emparejar (${att.e}): ${(att.w||[]).map(pairOf).filter(w=>it.pairs[w[0]]&&it.pairs[w[1]]).map(w=>esc(it.pairs[w[0]][0])+" ↔ "+esc(it.pairs[w[1]][1])).join(" · ")}</p>`
        :`<p class="fb-note" style="margin-top:12px;display:block">Lo emparejó todo a la primera.</p>`):""}`;
}
function reviewFeedback(it,att,d){
  let cls="", title="";
  if(att){
    if(att.s){ cls="near"; title="≈ La dio por buena el alumno (autocorrección)"; }
    else if(att.r==="ok") { cls="good"; title="✓ Correcta"; }
    else if(att.r==="near"){ cls="near"; title="≈ Casi: error de ortografía"; }
    else if(att.r==="rev") { cls="bad"; title="Vio la respuesta sin contestar"; }
    else if(it.t==="match"){ cls="bad"; title="✕ Las emparejó todas, pero con "+(att.e||0)+" fallo(s) por el camino"; }
    else { cls="bad"; title="✕ Incorrecta"; }
  } else {
    const e=d.ex[it.id];
    if(e){ cls=e==="ok"?"good":e==="self"?"near":"bad";
      title=(e==="ok"?"✓ Constaba como acertada":e==="self"?"≈ Constaba como dada por buena":"✕ Constaba como fallada")+" · su respuesta no se guardó (la hizo antes de que la web guardara las respuestas)"; }
    else title="Todavía no ha contestado esta pregunta";
  }
  const correct=att&&att.r==="ok"&&!att.s;
  return `<div class="fb ${cls}">
    <div class="fb-t">${title}</div>
    ${correct?"":`<div class="fb-sol"><b>Solución:</b> ${esc(modelOf(it))}</div>`}
    ${it.why?`<div class="fb-why">${it.why}</div>`:""}
  </div>`;
}

function levelsOf(u){ return [...new Set(u.exercises.map(e=>e.lvl||1))].sort((a,b)=>a-b); }
/* al abrir la unidad se enseña el nivel con algo a medias o, si no, el primero sin terminar */
function defaultLevel(u){
  const L=levelsOf(u);
  const pend=u.exercises.find(e=>resumeValid(S.resume&&S.resume["ex:"+e.id]));
  if(pend) return pend.lvl||1;
  const open=L.find(l=>u.exercises.filter(e=>(e.lvl||1)===l).some(e=>e.items.some(i=>S.ex[i.id]!=="ok")));
  return open||L[0];
}

  </header>
  <div class="sec">
    <div class="exgrid">
      ${group.map((ex,ix)=>{
        const n=ex.items.length;
        const done=ex.items.filter(i=>S.ex[i.id]).length;

        const r=S.resume&&S.resume["ex:"+ex.id], pending=resumeValid(r);
        const cls=pending?"now":done===n?"done":done?"part":"";

          <span class="top"><span class="n">${ex.no||ex.n}</span><span class="sc">${sc}</span></span>

/* ---------- rondas a medias ----------
   Cada ronda tiene una clave (un ejercicio, una unidad entera, el examen o el
   repaso de fallos) y, tras cada pregunta contestada, se guarda por dónde va.
   Se guarda junto al resto del progreso, así que también viaja a la nube. */
function roundKey(m){
  if(m.key!==undefined) return m.key;
  return m.exam?"exam":m.review?"wrong":m.ex?"ex:"+m.ex.id:m.unit?"unit:"+m.unit.id:null;
}
function metaToStore(m){
  return {title:m.title||"", unit:m.unit?m.unit.id:null, ex:m.ex?m.ex.id:null, exam:!!m.exam, review:!!m.review};
}
function metaFromStore(s){
  const unit=s.unit?UNITS.find(u=>u.id===s.unit):null;
  let ex=null;
  if(s.ex) UNITS.forEach(u=>u.exercises.forEach(e=>{ if(e.id===s.ex) ex=e; }));
  return {title:s.title, unit, ex, exam:s.exam||undefined, review:s.review||undefined};
}
function saveResume(){
  if(!run) return;
  const key=roundKey(run.meta); if(!key) return;
  S.resume=S.resume||{};
  S.resume[key]={at:Date.now(), ids:run.items.map(x=>x.id), i:run.i+1,
    correct:run.correct, xp:run.xp||0, streak:run.streak, best:run.best, bestMult:run.bestMult,
    selfUsed:run.selfUsed, saves:run.saves,
    misses:run.misses.map(m=>({id:m.it.id,given:m.given,model:m.model})),
    meta:metaToStore(run.meta)};
  /* como mucho 8 rondas guardadas: se descartan las más antiguas */
  const keys=Object.keys(S.resume).sort((a,b)=>S.resume[b].at-S.resume[a].at);
  keys.slice(8).forEach(k=>delete S.resume[k]);
}
function clearResume(key){ if(key && S.resume && S.resume[key]){ delete S.resume[key]; } }
/* una ronda guardada solo vale si todas sus preguntas siguen existiendo */
function resumeValid(r){ return !!r && Array.isArray(r.ids) && r.ids.length && r.ids.every(id=>INDEX[id]); }
function pendingList(){
  return Object.keys(S.resume||{}).filter(k=>resumeValid(S.resume[k]))
    .map(k=>Object.assign({key:k},S.resume[k]))
    .sort((a,b)=>b.at-a.at);
}
function resumeRun(key){
  const r=S.resume&&S.resume[key];
  if(!resumeValid(r)){ clearResume(key); save(); return false; }
  const items=r.ids.map(id=>INDEX[id]);
  run={items, i:Math.min(r.i,items.length), correct:r.correct||0, xp:r.xp||0, streak:r.streak||0,
       best:r.best||0, bestMult:r.bestMult||1, selfUsed:r.selfUsed||0, saves:r.saves||0,
       misses:(r.misses||[]).map(m=>({it:INDEX[m.id],given:m.given,model:m.model})).filter(m=>m.it),
       answered:false, meta:metaFromStore(r.meta||{}), t0:Date.now()};
  go({name:run.i>=items.length?"done":"play"});
  return true;
}

function startRun(items,meta){
  meta=meta||{};
  const key=roundKey(meta);
  /* si esa ronda estaba a medias, se pregunta antes de empezar de cero */
  if(key && !meta.fresh && resumeValid(S.resume&&S.resume[key])){
    go({name:"resume", key, items, meta});
    return;
  }
  if(key) clearResume(key);
  run={items:items.slice(),i:0,correct:0,xp:0,streak:0,best:0,bestMult:1,misses:[],
       answered:false,selfUsed:0,saves:0,meta:meta,t0:Date.now()};
  go({name:"play"});
}
function renderResume(){
  const {key,items,meta}=view, r=S.resume[key];
  const total=r.ids.length, doneN=Math.min(r.i,total), finished=r.i>=total;
  app.innerHTML=`
  <div class="screen narrow">

      <div class="row" style="gap:10px">

      </div>
      <div class="bar" aria-hidden="true"><i style="width:${Math.round(doneN/total*100)}%"></i></div>
      <div class="trio">
        <div class="stat"><b>${doneN}/${total}</b><span>Hechas</span></div>
        <div class="stat"><b>${r.correct}</b><span>Aciertos</span></div>
        <div class="stat"><b>🔥 ${r.streak||0}</b><span>Racha</span></div>
      </div>
    </header>
    <div class="sec">
      <p class="empty2" style="font-size:17px">${finished
        ?"Ya contestaste todas las preguntas. Puedes ver cómo te salió."
        :"La dejaste en la pregunta "+(doneN+1)+" de "+total+". Si sigues, conservas la racha y el multiplicador."}</p>
    </div>
    <div class="dfoot">
      <button class="bigbtn" id="res-go">${finished?"Ver resultados":"▶ Seguir"}</button>
      <button class="ghostbtn wide" id="res-new">Empezar de nuevo</button>
    </div>
  </div>`;
  document.getElementById("res-go").onclick=()=>resumeRun(key);
  document.getElementById("res-new").onclick=()=>{
    clearResume(key); save();
    startRun(items, Object.assign({}, meta, {fresh:true}));
  };
  document.getElementById("res-back").onclick=()=>{ meta.unit?go({name:"unit",unit:meta.unit,lvl:meta.ex?meta.ex.lvl:undefined}):go({name:"home"}); };
}

function typeBadge(it){

/* banda de la partida: salir, contador, racha × multiplicador y una casilla por pregunta */
function playHeadInner(){
  const n=run.items.length, i=run.i;
  const m=multOf(run.streak), nx=multOf(run.streak+1);
  const badge=run.drop
    ? `<span class="badge2 drop" data-fly aria-label="Multiplicador perdido: de ${fmtMult(run.drop)} a ×1.0"><s>${fmtMult(run.drop)}</s><span>×1.0</span></span>`
    : `<span class="badge2 ${run.streak?"":"solo"}" data-fly title="Racha y multiplicador de XP">${run.streak?`<span class="s">🔥 ${run.streak}</span>`:""}<span class="m">${fmtMult(m)}</span></span>`;
  const multLine=run.drop?""
    :`<div class="multrow"><b class="gold">${fmtMult(m)}</b><span class="bar thin" title="Hacia el tope de ×2.0"><i style="width:${Math.round((m-1)*100)}%"></i></span><span>${
      m>=2?"¡Multiplicador al máximo!"
      :nx>m?`Acierta y sube a <b>${fmtMult(nx)}</b>`
      :`Encadena aciertos para <b>×1.1</b>`}${boostToday()?' · <b class="gold">⚡ XP ×2</b>':""}</span></div>`;
  let prog;
  if(n<=30){
    const miss=new Set(run.misses.map(x=>x.it.id));
    prog=`<div class="segs" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">${run.items.map((it,k)=>{
      const c=k<i?(miss.has(it.id)?"ko":"ok"):k===i?(run.answered?(run.lastOk?"ok":"ko"):"cur"):"";
      return `<i class="${c}"></i>`;
    }).join("")}</div>`;
  } else prog=`<div class="bar" style="height:10px" aria-hidden="true"><i style="width:${(i+(run.answered?1:0))/n*100}%"></i></div>`;
  return `<div class="row" style="gap:10px">
      <button class="hbtn" id="exit" aria-label="Salir de la ronda">✕</button>
      <span class="qcnt" aria-label="Pregunta ${i+1} de ${n}">${i+1} / ${n}</span>
      ${badge}
    </div>
    ${multLine}
    ${prog}`;
}
function exitRun(){
  const m=run.meta;
  if(m.unit) go({name:"unit",unit:m.unit,lvl:m.ex?m.ex.lvl:undefined}); else go({name:"home"});
}
function renderPlay(){
  run.drop=0;
  app.innerHTML=`<div class="screen">

    <div class="qwrap" id="qcard"></div>
  </div>`;

}

const VERBS={}, VERB_FORMS={};
(function(){
  const thirdOf=b=>/(s|sh|ch|x|z|o)$/.test(b)?b+"es":(/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ies":b+"s");
  const ingOf=b=>/[^e]e$/.test(b)?b.slice(0,-1)+"ing":b+"ing";
  const edOf=b=>/e$/.test(b)?b+"d":(/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ied":b+"ed");
  VERB_SRC.forEach(src=>{
    const [base,es,v2,v3,extra]=src.split("|");
    const past=v2||edOf(base), pp=v3||edOf(base);
    const v={base,es,past,pp};
    VERBS[base]=v;
    const set=new Set([base,thirdOf(base),ingOf(base),edOf(base)]);
    past.split(" / ").forEach(x=>set.add(x.trim()));
    pp.split(" / ").forEach(x=>set.add(x.trim()));
    (extra||"").split(",").forEach(x=>{ x=x.trim(); if(x) set.add(x); });
    set.forEach(f=>{ if(f&&!VERB_FORMS[f]) VERB_FORMS[f]=v; });
  });
})();
function verbLookup(w){
  const k=w.toLowerCase().replace(/[’']/g,"'");
  if(NO_GLOSS.has(k)||GLOSSARY[k]) return null;
  return VERB_FORMS[k]||null;
}
function verbRole(v,form){
  const f=form.toLowerCase();
  if(f===v.base) return "infinitivo / presente";
  if(v.past.split(" / ").some(x=>x.trim()===f)) return "pasado simple";
  if(v.pp.split(" / ").some(x=>x.trim()===f)) return "participio";
  if(/ing$/.test(f)) return "gerundio (-ing)";
  if(/n't$/.test(f)) return "negativa";
  if(/s$/.test(f)) return "3.ª persona del singular";
  return "forma del verbo";
}
function glossLookup(w){
  const k=w.toLowerCase().replace(/[’']s$/,"");
  if(NO_GLOSS.has(k)) return null;
  if(GLOSSARY[k]) return GLOSSARY[k];
  if(/ies$/.test(k)&&GLOSSARY[k.slice(0,-3)+"y"]) return GLOSSARY[k.slice(0,-3)+"y"];
  if(/(ches|shes|sses|xes)$/.test(k)&&GLOSSARY[k.slice(0,-2)]) return GLOSSARY[k.slice(0,-2)];
  if(/s$/.test(k)&&GLOSSARY[k.slice(0,-1)]) return GLOSSARY[k.slice(0,-1)];
  return null;
}
/* Los verbos auxiliares (do, have, be) no se traducen cuando solo ayudan a otro verbo. */
function nextWords(text, from){
  const r=/[A-Za-z][A-Za-z'’-]*/g; r.lastIndex=from; const o=[]; let m;
  while(o.length<3 && (m=r.exec(text))) o.push(m[0].toLowerCase());
  return o;
}
function isAuxUse(vb, k, nx){
  const PRON=/^(i|you|he|she|it|we|they)$/;
  const ADV=/^(even|still|only|really|nearly|almost|often|already|just|always|never|ever|also|finally|recently|not|yet)$/;
  let [n0="", n1="", n2=""]=nx;
  if(ADV.test(n0)){ n0=n1; n1=n2; }
  const pp=w=>{ const v=VERB_FORMS[w]; return !!v && (/ed$/.test(w) || v.pp.split(" / ").some(x=>x.trim()===w)); };
  const ing=w=>/ing$/.test(w) && w.length>4;
  if(vb.base==="do") return !/^(doing|done)$/.test(k) && !!n0;
  if(vb.base==="have"){
    if(k==="having") return false;
    if(/n't$/.test(k)) return true;
    return pp(n0) || (PRON.test(n0) && pp(n1));
  }
  if(vb.base==="be"){
    if(k==="being") return false;
    return ing(n0) || pp(n0) || (PRON.test(n0) && (ing(n1) || pp(n1)));
  }
  return false;
}
/* Recorre el texto en crudo, escapa lo que no es palabra y envuelve las que
   tienen traducción. Devuelve HTML listo para insertar.
   itemGloss manda sobre el glosario general: es la traducción que vale en esa
   frase; con "" la palabra se deja sin traducir. */
function wrapGloss(text, itemGloss, useGlobal){
  const own={}; if(itemGloss) Object.keys(itemGloss).forEach(k=>own[k.toLowerCase()]=itemGloss[k]);
  const re=/[A-Za-z][A-Za-z'’-]*/g;
  let out="", last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const w=m[0], k=w.toLowerCase();
    const hasOwn=Object.prototype.hasOwnProperty.call(own,k);
    const tr=hasOwn?own[k]:(useGlobal?glossLookup(k):null);
    let vb=(!hasOwn&&!tr&&useGlobal)?verbLookup(k):null;
    if(vb && isAuxUse(vb,k,nextWords(text,m.index+w.length))) vb=null;
    if(tr){
      out+=`<button type="button" class="voc" data-t="${esc(tr).replace(/"/g,"&quot;")}">${esc(w)}</button>`;
    } else if(vb){
      out+=`<button type="button" class="vrb" data-v="${esc(vb.base)}" data-f="${esc(k)}">${esc(w)}</button>`;
    } else {
      out+=esc(w);
    }
    last=m.index+w.length;
  }
  return out+esc(text.slice(last));
}
function bindGloss(card){
  card.querySelectorAll(".voc, .vrb").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    card.querySelectorAll(".open").forEach(x=>x.classList.remove("open"));
    b.classList.add("open"); SFX.play("pop");
    const isVerb=b.classList.contains("vrb");
    if(isVerb){
      const v=VERBS[b.dataset.v], f=b.dataset.f;
      glossEl.className="gloss verb";
      glossEl.innerHTML=`<b>to ${esc(v.base)}</b>${esc(v.es)}
        <div class="vrole">${esc(b.textContent)} · ${esc(verbRole(v,f))}</div>
        <div class="vgrid">
          <span class="vh">Infinitivo</span><span class="vh">Pasado</span><span class="vh">Participio</span>
          <span class="vf ${f===v.base?"cur":""}">${esc(v.base)}</span>
          <span class="vf ${v.past.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.past)}</span>
          <span class="vf ${v.pp.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.pp)}</span>
        </div>`;
    } else {
      glossEl.className="gloss";
      glossEl.innerHTML=`<b>${esc(b.textContent)}</b>${esc(b.dataset.t||"")}`;
    }
    glossEl.hidden=false;
    const r=b.getBoundingClientRect();
    const w=Math.min(isVerb?300:250, glossEl.offsetWidth||(isVerb?300:250));
    let left=r.left+window.scrollX+r.width/2-w/2;
    left=Math.max(10, Math.min(left, window.innerWidth-w-14));
    glossEl.style.left=left+"px";
    glossEl.style.top=(r.bottom+window.scrollY+8)+"px";
  });
}
document.addEventListener("click",()=>{ glossEl.hidden=true; document.querySelectorAll(".voc.open, .vrb.open").forEach(x=>x.classList.remove("open")); });

   aleatorio (si no, su orden delataría el de los huecos); dentro de una ronda
   se quedan fijos. */
function shuffledOnce(key,list){ run.shuf=run.shuf||{}; return run.shuf[key]||(run.shuf[key]=shuffle(list)); }
function bankFor(ex){ return shuffledOnce("b"+ex.id,ex.bank); }
function hintFor(it){ return it.hint&&it.hint.includes(" · ")?shuffledOnce("h"+it.id,it.hint.split(" · ")).join(" · "):it.hint; }
function paintQuestion(it){
  const card=document.getElementById("qcard"), ex=it.ex;
  let box="", below="";
  const stemHTML=t=>wrapGloss(t, it.gloss, !(it.tr||ex.nogloss));

  if(it.t==="choice"){
    /* Las opciones se muestran en orden aleatorio, para que la buena no sea
       siempre la primera. Cada botón guarda su índice original (data-i): la
       corrección compara con ese índice, no con la posición en pantalla. */
    const order=shuffle(it.opts.map((_,i)=>i));
    run.lastOrder=order;   /* el profe verá las opciones en el orden en que las vio el alumno */
    box=`<div class="stem">${stemHTML(it.q).replace(/___/g,'<span style="color:var(--soft)">______</span>')}</div>`;
    below=`<div class="opts ${it.opts.length>4?"bank":""}" id="opts">
      ${order.map((i,pos)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(it.opts[i])}</span></button>`).join("")}
    </div>`;
  } else if(it.t==="fill"){
    let n=0;
    const stem=stemHTML(it.q).replace(/___/g,()=>`<input class="blank" data-b="${n++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Hueco ${n}">`);
    box=`<div class="stem">${stem}</div>
      ${it.hint?`<div class="hintline">Pista: <span>${esc(hintFor(it))}</span></div>`:""}
      ${ex.bank?`<div class="hintline bank">Banco: <span>${bankFor(ex).join(" · ")}</span></div>`:""}`;
  } else if(it.t==="write"){
    box=`<div class="stem">${stemHTML(it.q)}</div>
      ${ex.bank?`<div class="hintline bank">Banco: <span>${bankFor(ex).join(" · ")}</span></div>`:""}
      <div class="answerline">
        ${it.lead?`<div class="stem lead">${esc(it.lead)} …</div>`:""}
        <input id="wr" placeholder="${it.tr?"Escribe la frase en inglés":"Escribe la frase completa"}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tu respuesta">
      </div>`;
  } else if(it.t==="match"){
    const left=it.pairs.map((p,i)=>({txt:p[0],i}));
    const right=shuffle(it.pairs.map((p,i)=>({txt:p[1],i})));
    box=`<div class="stem" style="font-size:18px">${esc(it.q)}</div>`;
    below=`<div class="matchgrid">
      <div class="mcol">${left.map(o=>`<button class="mitem" data-side="L" data-i="${o.i}"><span class="tag">${o.i+1}</span>${esc(o.txt)}</button>`).join("")}</div>
      <div class="mcol">${right.map(o=>`<button class="mitem" data-side="R" data-i="${o.i}">${esc(o.txt)}</button>`).join("")}</div>
    </div>`;
  }
  const hasTheory=theoryFor(ex.unit,ex).length>0;
  const glossy=box.indexOf('class="voc"')>=0||box.indexOf('class="vrb"')>=0;

  card.classList.remove("good","bad");
  card.innerHTML=`
    <div class="qbody">
      <div class="qbox">
        ${ex.instr&&ex.instr!==it.q?`<div class="instr">${esc(ex.instr)}</div>`:""}
        ${box}
        ${glossy?`<div class="vochelp">Toca las palabras subrayadas: <span class="lg-n">azul</span> = sustantivos y adjetivos, <span class="lg-v">rojo</span> = verbos con sus tres columnas.</div>`:""}
      </div>
      ${below}
    </div>
    <div class="qfoot2 ${hasTheory?"":"solo"}" id="qfoot">
      ${hasTheory?'<button class="sqbtn" id="cheat" aria-label="Ver la chuleta">📖</button>':""}
      <button class="bigbtn" id="check">Comprobar</button>
      <div class="qlinks">
        ${it.t==="choice"&&it.opts.length>=3?'<button class="textbtn" id="fifty" title="Quita la mitad de las opciones incorrectas">🎟️ 50/50</button><span aria-hidden="true">·</span>':""}
        <button class="textbtn" id="skip">Ver la respuesta</button>
      </div>
    </div>`;

  bindGloss(card);
  run.tried=false;
  const cheat=document.getElementById("cheat"); if(cheat) cheat.onclick=e=>{e.stopPropagation();openTheory(ex.unit,ex);};
  const checkBtn=document.getElementById("check");
  run.answered=false;

  if(it.t==="choice"){
    /* tocar una opción solo la selecciona; se corrige al pulsar «Comprobar» */
    run.picked=null;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(run.answered||b.disabled) return;
      run.picked=+b.dataset.i;
      card.querySelectorAll(".opt").forEach(x=>{ const on=x===b; x.classList.toggle("sel",on); x.setAttribute("aria-pressed",String(on)); });
      const c=document.getElementById("check"); if(c) c.disabled=false;
      SFX.play("pick");
    });
    checkBtn.disabled=true;
    checkBtn.onclick=()=>{ if(run.picked!=null) resolveChoice(it,run.picked); };
  }
  if(it.t==="fill"){
    const first=card.querySelector(".blank"); if(first) first.focus();
    card.querySelectorAll(".blank").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}}));
    checkBtn.onclick=()=>resolveFill(it);
  }
  if(it.t==="write"){
    const inp=document.getElementById("wr"); inp.focus();
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}});
    checkBtn.onclick=()=>resolveWrite(it);
  }
  if(it.t==="match"){ setupMatch(it,card); checkBtn.disabled=true; }
  document.getElementById("skip").onclick=()=>reveal(it);
  const ff=document.getElementById("fifty"); if(ff) ff.onclick=()=>useFifty(it,ff);
}
/* comodín 50/50: por 1 🎟️ quita la mitad de las opciones incorrectas */
function useFifty(it,btn){
  if(run.answered||btn.disabled) return;
  if(S.tokens<1){ toast("Necesitas 1 🎟️ para el 50/50."); return; }
  const wrong=[...document.querySelectorAll(".opt")].filter(b=>!b.disabled&&!it.a.includes(+b.dataset.i));
  const out=shuffle(wrong).slice(0,Math.max(1,Math.floor(wrong.length/2)));
  if(!out.length) return;
  out.forEach(b=>{ b.disabled=true; b.classList.remove("sel"); b.classList.add("gone"); b.setAttribute("aria-pressed","false");
    if(run.picked===+b.dataset.i){ run.picked=null; const c=document.getElementById("check"); if(c) c.disabled=true; } });
  S.tokens--; S.stats.tokensSpent++; save();
  btn.disabled=true; btn.textContent="50/50 usado";
  SFX.play("token"); flyXP("−1 🎟️","tok");
}
/* En las preguntas de elegir: A, B, C… o 1, 2, 3… seleccionan la opción que
   aparece en esa posición; Enter comprueba. */
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||!run||run.answered||!drawer.hidden) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const it=run.items[run.i]; if(!it||it.t!=="choice") return;
  if(e.key==="Enter"){
    if(t&&t.tagName==="BUTTON") return;   /* sobre un botón, Enter ya lo pulsa él */
    const c=document.getElementById("check");
    if(c&&!c.disabled){ e.preventDefault(); c.click(); }
    return;
  }
  const k=e.key.toLowerCase(); let idx=-1;
  if(/^[1-9]$/.test(k)) idx=+k-1; else if(/^[a-i]$/.test(k)) idx=k.charCodeAt(0)-97;
  const btn=[...document.querySelectorAll(".opt")][idx];
  if(btn){ e.preventDefault(); btn.click(); }
});
function onEnter(){
  if(run.answered){ const n=document.getElementById("next"); if(n) n.click(); return; }
  const b=document.getElementById("check");
  if(b&&!b.disabled) b.click();
}
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||!drawer.hidden||document.getElementById("giftpop")) return;
  /* un Enter que acaba de comprobar no puede ser también el que avanza */
  if(e.key==="Enter"&&run&&run.answered&&!e.repeat&&Date.now()-(run.checkedAt||0)>400){ e.preventDefault(); const n=document.getElementById("next"); if(n) n.click(); }
});

/* ---------- resolución ---------- */
/* el botón de una opción, buscado por su índice original (no por su posición) */
function optBtn(i){ return document.querySelector('.opt[data-i="'+i+'"]'); }
function resolveChoice(it,pick){
  const ok=it.a.includes(pick);
  if(!ok && !run.tried){
    const b=optBtn(pick);
    b.classList.remove("sel"); b.classList.add("no"); b.disabled=true; b.setAttribute("aria-pressed","false");
    run.picked=null;
    return tryAgain(it,false,{p:pick,o:run.lastOrder});
  }
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
  optBtn(pick).classList.add(ok?"ok":"no");
  if(!ok) optBtn(it.a[0]).classList.add("ok");
  finish(it,ok,it.opts[it.a[0]],it.opts[pick],false,false,false,{p:pick,o:run.lastOrder});
}
function resolveFill(it){
  const inputs=[...document.querySelectorAll(".blank")];
  if(!run.tried){
    const res=inputs.map((inp,k)=>judge(inp.value,it.a[k]));
    if(res.some(r=>r!=="ok")){
      /* las que están bien se quedan fijas; las demás se pueden corregir */
      inputs.forEach((inp,k)=>{
        if(res[k]==="ok"){ inp.classList.add("ok"); inp.disabled=true; }
        else { inp.classList.add("no"); inp.addEventListener("input",()=>inp.classList.remove("no"),{once:true}); }
      });
      const wrong=inputs.find((inp,k)=>res[k]!=="ok"); if(wrong){ wrong.focus(); wrong.select(); }
      return tryAgain(it,res.every(r=>r!=="ko"),{v:inputs.map(i=>i.value)});
    }
  }
  let allOk=true, near=false;
  inputs.forEach((inp,k)=>{
    const r=judge(inp.value,it.a[k]);
    if(r==="ok") inp.classList.add("ok");
    else { inp.classList.add("no"); allOk=false; if(r==="near") near=true; }
    inp.disabled=true;
  });
  const model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  finish(it,allOk,model,inputs.map(i=>i.value).join(" / "),near&&!allOk,false,false,{v:inputs.map(i=>i.value)});
}
function resolveWrite(it){
  const inp=document.getElementById("wr");
  const r=judge(inp.value,it.a,it.lead);
  const ok=r==="ok";
  if(!ok && !run.tried){
    inp.classList.add("no"); inp.addEventListener("input",()=>inp.classList.remove("no"),{once:true});
    inp.focus();
    return tryAgain(it,r==="near",{v:inp.value});
  }
  inp.classList.add(ok?"ok":"no"); inp.disabled=true;
  const model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
  finish(it,ok,model,inp.value,r==="near",!ok,false,{v:inp.value});
}
function setupMatch(it,card){
  let sel=null,errs=0,left=it.pairs.length;
  const wrongs=[];   /* parejas equivocadas: [izquierda, derecha] */
  card.querySelectorAll(".mitem").forEach(b=>b.onclick=()=>{
    if(!sel){ sel=b; b.classList.add("sel"); SFX.play("pick"); return; }
    if(sel===b){ b.classList.remove("sel"); sel=null; return; }
    if(sel.dataset.side===b.dataset.side){ sel.classList.remove("sel"); sel=b; b.classList.add("sel"); SFX.play("pick"); return; }
    if(sel.dataset.i===b.dataset.i){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done");
      sel=null; left--;
      if(left>0) SFX.play("matchOk");   /* la última pareja suena como acierto de la pregunta */
      if(left===0) finish(it,errs===0,"Todas emparejadas",errs+" fallo(s) por el camino",false,false,false,{e:errs,w:wrongs});
    } else {
      errs++; wrongs.push(sel.dataset.side==="L"?sel.dataset.i+"-"+b.dataset.i:b.dataset.i+"-"+sel.dataset.i);
      SFX.play("matchBad"); b.classList.add("shake"); sel.classList.add("shake");
      const a=sel; setTimeout(()=>{a.classList.remove("shake","sel");b.classList.remove("shake");},320);
      sel=null;
    }
  });
}
function reveal(it){
  if(run.answered) return;
  let model="", typed;
  if(it.t==="choice"){
    document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
    optBtn(it.a[0]).classList.add("ok");
    model=it.opts[it.a[0]];
  } else if(it.t==="fill"){
    typed=[...document.querySelectorAll(".blank")].map(i=>i.value);
    [...document.querySelectorAll(".blank")].forEach((inp,k)=>{ inp.value=expand(it.a[k][0])[0]; inp.classList.add("ok"); inp.disabled=true; });
    model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  } else if(it.t==="write"){
    const inp=document.getElementById("wr");
    typed=inp.value;
    model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
    inp.value=model; inp.classList.add("ok"); inp.disabled=true;
  } else if(it.t==="match"){
    document.querySelectorAll(".mitem").forEach(b=>b.classList.add("done"));
    model=it.pairs.map((p,i)=>(i+1)+" → "+p[1]).join(" · ");
  }
  finish(it,false,model,"",false,false,true,typed!==undefined?{v:typed}:(it.t==="choice"?{o:run.lastOrder}:{}));
}

/* ---------- segunda oportunidad ----------
   Al primer fallo no se enseña la solución: sale una pista (la regla de la
   explicación) y se puede volver a intentar por la mitad de XP. El primer
   intento queda guardado para que el profe lo vea. */
function tryAgain(it,near,ans){
  run.tried=true;
  recordAnswer(it, near?"near":"ko", ans);
  save();
  SFX.play(near?"near":"bad");
  reactCard(false);
  const foot=document.getElementById("qfoot");
  const hasTheory=theoryFor(it.ex.unit,it.ex).length>0;
  const hint=near?"Está casi: revisa cómo lo has escrito, letra a letra."
    :(it.why||"Vuelve a leer la frase con calma. Si te atascas, abre la chuleta.");
  foot.className="qsheet near";
  foot.setAttribute("role","status");
  foot.innerHTML=`
    <div class="sh-top"><h3>${near?"¡Casi! Revisa la ortografía":"No es esa. ¡Prueba otra vez!"}</h3><span class="xpp soft">2.º intento · ½ XP</span></div>
    <div class="readit">👀 <b>Léetelo bien antes de contestar:</b> la frase entera y la instrucción, sin prisa.</div>
    <div class="why">💡 ${hint}</div>
    <div class="acts"><button class="bigbtn" id="check">Comprobar otra vez</button></div>
    <div class="row" style="justify-content:center;gap:6px">
      ${hasTheory?'<button class="textbtn" id="cheat2">📖 Chuleta</button><span aria-hidden="true" style="color:var(--soft)">·</span>':""}
      <button class="textbtn" id="skip">Ver la respuesta</button>
    </div>`;
  const c=document.getElementById("check");
  if(it.t==="choice"){ c.disabled=true; c.onclick=()=>{ if(run.picked!=null) resolveChoice(it,run.picked); }; }
  else if(it.t==="fill") c.onclick=()=>resolveFill(it);
  else c.onclick=()=>resolveWrite(it);
  document.getElementById("skip").onclick=()=>reveal(it);
  const ch=document.getElementById("cheat2"); if(ch) ch.onclick=e=>{e.stopPropagation();openTheory(it.ex.unit,it.ex);};
}

/* ---------- ¿puede autocorregirse? ---------- */
function canSelfMark(given,model){
  const g=norm(given).split(" ").filter(Boolean);
  const m=norm(model).split(" ").filter(Boolean);
  if(g.length<2) return false;
  return g.length>=Math.max(3,Math.ceil(m.length*0.6));
}

/* ---------- feedback ---------- */
/* Lo que contesta el alumno se guarda para que el profe pueda revisarlo como si
   estuviera dentro del ejercicio: el PRIMER intento (siempre) y los últimos
   MAX_ATT. ans: {p,o} opción elegida y orden en que la vio · {v} lo escrito ·
   {e,w} fallos al emparejar. */
const MAX_ATT=5;
function recordAnswer(it,r,ans){
  const A=S.answers||(S.answers={});
  const arr=A[it.id]||(A[it.id]=[]);
  arr.push(Object.assign({t:Date.now(),r},ans||{}));
  while(arr.length>MAX_ATT) arr.splice(1,1);   /* se descarta el segundo más antiguo: el primero se queda */
}
function finish(it,ok,model,given,near,selfmarkable,revealed,ans){
  run.answered=true; run.checkedAt=Date.now();
  const foot=document.getElementById("qfoot");
  const prevStreak=run.streak;
  let gained=0, mult=1;

  S.stats.answers++;
  const uid=it.ex.unit.id;
  S.stats.byUnit[uid]=S.stats.byUnit[uid]||{ok:0,ko:0};

  const second=!!run.tried;
  const xb=boostToday()?2:1;                 /* XP doble el día después de un regalo raro */
  /* relacionar con fallos: se pierde la parte proporcional de los 10 XP
     (las parejas que costaron algún intento) y la racha no se corta */
  const pairs=it.t==="match"?it.pairs.length:0;
  const badPairs=it.t==="match"&&ans?Math.min(pairs,new Set((ans.w||[]).map(w=>pairOf(w)[0])).size||(ans.e?1:0)):0;
  const partial=!ok && !revealed && it.t==="match" && badPairs<pairs;
  const base=partial?Math.round(10*(pairs-badPairs)/pairs):second?5:10;
  if(partial){
    run.correct++;
    mult=multOf(run.streak);
    S.stats.byUnit[uid].ko++;
    gained=base?addXP(base,mult*xb):0; run.xp=(run.xp||0)+gained;
    if(S.ex[it.id]!=="ok") S.ex[it.id]="ko";
    if(!S.wrong.includes(it.id)) S.wrong.push(it.id);
  } else if(ok && second){
    /* a la segunda: cuenta para la ronda y no corta la racha, pero no la sube;
       la mitad de XP y se queda en «Repasar» para afianzarla */
    run.correct++;
    mult=multOf(run.streak);
    S.stats.byUnit[uid].ko++;
    gained=addXP(5,mult*xb); run.xp=(run.xp||0)+gained;
    S.ex[it.id]="ok";
    if(!S.wrong.includes(it.id)) S.wrong.push(it.id);
  } else if(ok){
    run.correct++; run.streak++; run.best=Math.max(run.best,run.streak);
    mult=multOf(run.streak);
    run.bestMult=Math.max(run.bestMult,mult);
    S.stats.bestStreak=Math.max(S.stats.bestStreak,run.streak);
    S.stats.bestMult=Math.max(S.stats.bestMult,mult);
    S.stats.correct++; S.stats.byUnit[uid].ok++;
    gained=addXP(10,mult*xb); run.xp=(run.xp||0)+gained;
    S.ex[it.id]="ok";
    if(S.wrong.includes(it.id)) S.stats.fixed=(S.stats.fixed||0)+1;
    S.wrong=S.wrong.filter(x=>x!==it.id);
  } else {
    run.streak=0;
    S.stats.byUnit[uid].ko++;
    run.misses.push({it,given:revealed?"(sin responder)":given,model});
    if(S.ex[it.id]!=="ok") S.ex[it.id]="ko";
    if(!S.wrong.includes(it.id)) S.wrong.push(it.id);
  }
  if(!revealed) countDay();
  /* la banda enseña cómo cae el multiplicador: ×1.2 tachado → ×1.0 */
  run.lastOk=ok||partial;
  run.drop=!ok&&!partial&&multOf(prevStreak)>1?multOf(prevStreak):0;
  recordAnswer(it, ok?"ok":revealed?"rev":near?"near":"ko", ans);
  saveResume();
  save(); syncTop(); checkAch();
  reactCard(ok||partial);
  /* el acierto suena más rico cuanto más larga es la racha */
  SFX.play(partial?"near":ok?(run.streak>=6?"good3":run.streak>=3?"good2":"good"):near?"near":revealed?"reveal":"bad");
  if(ok&&!second&&run.streak>=2) bumpChip("[data-fly]");

  const cls=ok?"good":(near||partial?"near":"bad");
  const short=!!model && model.length<=28 && it.t!=="match";
  const title=ok&&second?"¡Bien! A la segunda"
    :ok?(run.streak>=2?"¡Correcto! Racha de "+run.streak:"¡Correcto!")
    :near?"¡Casi! Revisa la ortografía"
    :revealed?"Respuesta modelo"
    :partial?(pairs-badPairs)+" de "+pairs+" parejas a la primera"
    :it.t==="match"?"Emparejadas, con "+esc(given)
    :short?"Casi. Era «"+esc(model)+"»":"No es esa";
  const showSol=!ok && it.t!=="match" && (near||revealed||!short);
  const xpPill=gained?`<span class="xpp">${mult>1||xb>1?base+(mult>1?" × "+mult.toFixed(1):"")+(xb>1?" × 2 ⚡":"")+" = ":""}+${gained} XP</span>`:partial?`<span class="xpp soft">+0 XP</span>`:"";

  const canSave = !ok && !partial && !revealed && prevStreak>=2 && S.tokens>0;
  const selfOK  = selfmarkable && !revealed && canSelfMark(given,model) && run.selfUsed<SELFMARK_MAX;
  let selfNote="";
  if(selfmarkable && !revealed && !selfOK){
    if(run.selfUsed>=SELFMARK_MAX) selfNote="Ya has usado las "+SELFMARK_MAX+" autocorrecciones de esta ronda.";
    else selfNote="La autocorrección necesita una respuesta completa, no una palabra suelta.";
  }
  const hasTheory=theoryFor(it.ex.unit,it.ex).length>0;
  const last=run.i+1>=run.items.length;

  foot.className="qsheet "+cls;
  foot.setAttribute("role","status");
  foot.innerHTML=`
    <div class="sh-top"><h3>${title}</h3>${xpPill}</div>
    ${showSol?`<div class="sol"><b>Solución:</b> ${esc(model)}</div>`:""}
    ${it.why?`<div class="why">${it.why}</div>`:""}
    ${selfOK?`<button class="ghostbtn wide" id="selfok">Mi frase también vale ✓ (${SELFMARK_MAX-run.selfUsed} restante${SELFMARK_MAX-run.selfUsed===1?"":"s"})</button>`:""}
    ${selfNote?`<p class="fb-note">${selfNote}</p>`:""}
    <div class="acts ${canSave?"two":""}">
      ${canSave?`<button class="tokbtn" id="usetok" title="Gasta 1 token para salvar la racha de ${prevStreak}">🎟️ Mantener ${fmtMult(multOf(prevStreak))}</button>`:""}
      <button class="bigbtn" id="next">${last?"Ver resultados":"Siguiente"}</button>
    </div>
    ${hasTheory?'<button class="textbtn" id="cheat2">📖 Ver la chuleta</button>':""}`;
  const cheat2=document.getElementById("cheat2"); if(cheat2) cheat2.onclick=e=>{e.stopPropagation();openTheory(it.ex.unit,it.ex);};
  document.getElementById("next").onclick=()=>{
    run.i++;
    if(run.i>=run.items.length) go({name:"done"}); else renderPlay();
  };
  document.getElementById("next").focus({preventScroll:true});

  const tk=document.getElementById("usetok");
  if(tk) tk.onclick=()=>{
    if(S.tokens<=0) return;
    S.tokens--; S.stats.tokensSpent++; S.stats.saves++;
    run.streak=prevStreak; run.saves++; run.drop=0;
    tk.disabled=true; tk.textContent="Racha salvada 🎟️";
    save(); syncTop();
    bumpChip("[data-fly]"); flyXP("−1 🎟️","tok");
    SFX.play("token");
    reactCard(true);
    toast("Racha restaurada: "+prevStreak+" · multiplicador "+fmtMult(multOf(prevStreak)));
  };

  const sb=document.getElementById("selfok");
  if(sb) sb.onclick=()=>{
    sb.disabled=true; sb.textContent="Anotada en el informe ✓";
    run.selfUsed++; run.correct++;
    S.ex[it.id]="self";
    { const arr=(S.answers||{})[it.id]; if(arr&&arr.length) arr[arr.length-1].s=1; }
    S.stats.selfmarks.push({ts:Date.now(),unit:it.ex.unit.short,unitTitle:it.ex.unit.title,
      exN:it.ex.n,exTitle:it.ex.title,q:it.q.replace(/\n/g," "),given:given,model:model});
    run.misses=run.misses.filter(m=>m.it!==it);
    run.lastOk=true;
    /* dada por buena: no corta la racha (se recupera la que llevaba) y
       la pregunta queda en amarillo, pendiente de que la revise el profe */
    run.streak=Math.max(run.streak,prevStreak); run.drop=0;
    if(tk) tk.remove();
    foot.querySelector(".acts").classList.remove("two");
    foot.className="qsheet near";
    foot.querySelector("h3").textContent="Dada por buena · la revisará tu profe";
    const card=document.getElementById("qcard");
    if(card){ card.classList.remove("bad"); card.querySelectorAll(".no").forEach(e=>{ e.classList.remove("no"); e.classList.add("self"); }); }
    run.xp=(run.xp||0)+addXP(5,1); saveResume(); save(); syncTop();
    toast(prevStreak?"Cuenta como acierto y mantienes la racha de "+prevStreak+". Tu profe la revisará.":"Cuenta como acierto, pero queda anotada para que la revise tu profe.");
  };
}

    xp:run.xp||0,pct,best:run.best,self:run.selfUsed,saves:run.saves});

  if(m.exam&&pct===100){ S.flags=S.flags||{}; S.flags.exam10=1; }
  setTimeout(checkAch,0);
  save();
  setTimeout(()=>SFX.play(pct>=80?"win":pct>=60?"ok":"meh"),450);  /* tras el sonido de la última respuesta */

        <div class="stat"><b>${fmtMult(run.bestMult)}</b><span>Máx.</span></div>
      </div>
    </div>

function csvReport(){
  const rows=[["Fecha","Unidad","Ejercicio","Enunciado","Respuesta del alumno","Respuesta modelo"]];
  S.stats.selfmarks.forEach(r=>rows.push([fecha(r.ts),r.unit+" "+r.unitTitle,"Ej. "+r.exN+" "+r.exTitle,r.q,r.given,r.model]));

function sparkline(sessions){
  if(sessions.length<2) return `<p class="empty">Cuando termines un par de rondas verás aquí tu evolución.</p>`;
  const d=sessions.slice(-12), W=Math.max(320,d.length*46), H=96, P=18;
  const x=i=>P+i*((W-P*2)/(d.length-1)), y=v=>H-P-(v/100)*(H-P*2);
  const pts=d.map((s,i)=>[x(i),y(s.pct)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1], lastV=d[d.length-1].pct;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precisión de las últimas rondas">
    <line x1="${P}" y1="${y(50)}" x2="${W-P}" y2="${y(50)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${P}" y="${y(50)-5}" fill="var(--ink-faint)" font-size="10" font-family="IBM Plex Mono, monospace">50%</text>
    <path d="${path}" fill="none" stroke="var(--pen)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}"
        fill="${i===pts.length-1?"var(--pen)":"var(--card)"}" stroke="var(--pen)" stroke-width="2"><title>${esc(d[i].title)} · ${d[i].pct}% · ${fecha(d[i].ts)}</title></circle>`).join("")}
    <text x="${Math.min(last[0]+8,W-30)}" y="${(last[1]-9).toFixed(1)}" fill="var(--ink)" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace">${lastV}%</text>
  </svg>`;
}

<script type="module">
/* =====================================================================
   SINCRONIZACIÓN — Firestore
   El progreso sigue guardándose en el navegador (funciona sin conexión);
   esta capa lo sube a la nube y lo baja al entrar desde otro dispositivo.
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { initializeFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPZ54PzHWwb78e4u0lA_dgxTsPt3-aaxU",
  authDomain: "ingles-web-alumnos.firebaseapp.com",
  projectId: "ingles-web-alumnos",
  storageBucket: "ingles-web-alumnos.firebasestorage.app",
  messagingSenderId: "852909277881",
  appId: "1:852909277881:web:26e9a85c23b1526ab89168"
};
const CLASE = "5c96aa91a9d5";

try{
  const app = initializeApp(firebaseConfig);
  /* Long polling en vez de WebChannel: en iPad/Safari y en redes con filtro
     (colegio, control parental) la conexión normal a veces no llega y la web
     creía estar «sin conexión» aunque hubiera internet. */
  const db  = initializeFirestore(app, { experimentalForceLongPolling: true });
  const auth = getAuth(app);
  const ref = id => doc(db, "clases", CLASE, "progreso", id);
  window.CLOUD = {
    async load(id){ const s = await getDoc(ref(id)); return s.exists() ? s.data() : null; },
    async save(id, data){ await setDoc(ref(id), data); },
    async login(email, pass){ const c = await signInWithEmailAndPassword(auth, email, pass); return c.user.email; },
    async logout(){ await signOut(auth); },
    email(){ return auth.currentUser ? auth.currentUser.email : null; }
  };
  window.dispatchEvent(new Event("cloud-ready"));
  /* La sesión se recuerda en el dispositivo (persistencia local por defecto).
     Al arrancar, Firebase avisa una vez de si ya había alguien dentro. */
  let first = true;
  onAuthStateChanged(auth, user => {
    window.dispatchEvent(new CustomEvent("auth-state", { detail: { email: user ? user.email : null, first } }));
    first = false;
  });
}catch(e){
  console.warn("Sin sincronización:", e && e.message);
}
</script>
