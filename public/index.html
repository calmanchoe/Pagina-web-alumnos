{
 id:"m1", short:"U1", owner:"marcos", num:"Unidad 1", title:"All Fun and Games", icon:"🎮",
 desc:"Módulo 1 del libro: vocabulario de música y baile, videojuegos y ocio; present perfect continuous, present perfect simple frente a continuous, formación de palabras, conectores y comprensión lectora.",
 gram:["Present perfect continuous","Present perfect simple vs continuous","Formación de palabras"],
 lex:["Música y baile","Videojuegos","Ocio y conectores"],
 theory:[
  {h:"Present perfect continuous: la forma", dl:[
    ["Afirmativa","<code>have/has + been + verbo-ing</code> · <i>Claire has been singing for two years.</i>"],
    ["Negativa","<code>haven't / hasn't + been + -ing</code> · <i>We haven't been waiting for long.</i>"],
    ["Pregunta","<code>Have/Has + sujeto + been + -ing?</code> · <i>Have you been rehearsing lately?</i>"],
    ["Con wh-","<i>How long have they been playing? · What has John been doing all day?</i>"]
  ]},
  {h:"Present perfect continuous: cuándo se usa", p:"Para una acción que <b>empezó en el pasado y sigue ahora</b>, o que <b>acaba de terminar</b> y se nota el resultado: <i>I've been practising all day (y estoy agotado)</i>. Señales: <i>for, since, all day, lately, recently, how long</i>.<br><b>For</b> + periodo (<i>for two years</i>) · <b>since</b> + momento en que empezó (<i>since Monday</i>)."},
  {h:"Present perfect simple o continuous", p:"<b>Simple</b>: acción terminada y relevante ahora, o <b>cuántas</b> cosas se han hecho (<i>I've just gone up a level · How many games have you played?</i>). Va con <i>just, already, yet, ever, never</i>.<br><b>Continuous</b>: se destaca la <b>duración</b> o el proceso (<i>They've been developing this game for years</i>) y las preguntas con <i>how long</i>."},
  {h:"Verbos que no van en continuous", p:"Los verbos de estado (<i>want, need, like, love, understand, hear, see, know</i>) no suelen usarse en continuous: <i>I've known her since primary school</i>, nunca <i>I've been knowing</i>."},
  {h:"Si dices cuándo: pasado simple", p:"Con un momento concreto y terminado (<i>yesterday, last week, in 2020</i>) se usa <b>past simple</b>: <i>I practised the song yesterday</i>, no <i>I've been practising … yesterday</i>."},
  {h:"Formación de palabras", dl:[
    ["-ment","achieve → achieve<b>ment</b> · improve → improve<b>ment</b> · move → move<b>ment</b>"],
    ["-ance / -ence","appear → appear<b>ance</b> · differ → differ<b>ence</b> · attend → attend<b>ance</b>"],
    ["-ion","collect → collect<b>ion</b> · discuss → discuss<b>ion</b> · invent → invent<b>ion</b>"],
    ["-ity / -ty","active → activ<b>ity</b> · safe → safe<b>ty</b> · certain → certain<b>ty</b>"],
    ["-er / -or","teach → teach<b>er</b> · act → act<b>or</b> · visit → visit<b>or</b>"],
    ["-ive / -ous / -able","attract → attract<b>ive</b> · nerve → nerv<b>ous</b> · comfort → comfort<b>able</b>"],
    ["un- / im-","<b>un</b>usual · <b>un</b>fair · <b>im</b>patient · <b>im</b>polite"]
  ]},
  {h:"Vocabulario: música y baile", vocab:1, dl:[
    ["venue","lugar donde se celebra un concierto"],["cheer","vitorear, animar"],["wave","agitar (los brazos)"],
    ["rhythm","ritmo"],["dance moves","pasos de baile"],["criticism","críticas"],["broadcast","retransmisión"],
    ["rehearse","ensayar"],["star in","protagonizar"],["show off","presumir, lucirse"],["get the feeling","tener la sensación"],
    ["weird","raro"],["fond of","aficionado a"],["eager (to)","con muchas ganas de"],["change your mind","cambiar de opinión"],
    ["try hard","esforzarse"],["wireless speakers","altavoces inalámbricos"]
  ]},
  {h:"Vocabulario: videojuegos", vocab:1, dl:[
    ["appeal","atractivo"],["engaged","enganchado, implicado"],["ensure","asegurar"],["enjoyment","disfrute"],["feat","hazaña"],
    ["features","características"],["vivid","vivo, intenso"],["fictional","ficticio"],["bizarre","extraño"],["entirely","completamente"],
    ["properly","como es debido"],["immersed","sumergido"],["keep track of","seguir la pista de"],["depend on","depender de"],
    ["relate to","identificarse con"],["pull off","conseguir algo difícil"],["set off","ponerse en marcha"],["sell out","agotarse"],
    ["take an interest in","interesarse por"]
  ]},
  {h:"Vocabulario: ocio y conectores", vocab:1, dl:[
    ["roller coaster","montaña rusa"],["big wheel","noria"],["main attraction","atracción principal"],["brochure","folleto"],
    ["upside down","boca abajo"],["at full speed","a toda velocidad"],["either way","de cualquier manera"],
    ["after a while","después de un rato"],["as soon as","en cuanto"],["eventually","al final, con el tiempo"],
    ["ever since then","desde entonces"],["in the course of","a lo largo de"],
    ["what have you been up to?","¿en qué has andado metido?"],["quite trendy","bastante de moda"]
  ]},
  {h:"Adjetivo + to + verbo", p:"Para expresar cómo te sientes ante una acción: <i>I'm <b>eager to</b> go on stage · She's <b>lucky to</b> be here</i>. Se usa con <b>ready, pleased, excited, lucky, likely, proud</b>."}
 ],
 exercises:[

  /* ------------------------------ NIVEL 1 ------------------------------ */
  {n:1, lvl:1, no:1, vocab:1, title:"Música y baile: vocabulario en contexto", instr:"Elige la opción que completa mejor la frase.", items:[
   {t:"choice", gloss:{"opening": "de estreno (opening night = noche de estreno)"}, q:"After months of ___, the cast finally felt ready for opening night.", opts:["rehearsing","cheering","broadcasting","waving"], a:[0], why:"<b>rehearse</b> = ensayar: es lo que hace un reparto durante meses antes del estreno. <i>Broadcast</i> es retransmitir."},
   {t:"choice", gloss:{"take": "encajar, aguantar"}, q:"He doesn't take ___ well: every negative comment about his songs makes him furious.", opts:["criticism","rhythm","venue","appeal"], a:[0], why:"<b>take criticism</b> = encajar las críticas."},
   {t:"choice", gloss:{"moves": "movimientos"}, q:"She was ___ her new dance moves to anyone who would watch, even though nobody had asked.", opts:["showing off","starring in","cheering on","waving at"], a:[0], why:"<b>show off</b> = presumir, lucirse. <i>Star in</i> se usa para películas y obras de teatro."},
   {t:"choice", gloss:{"get": ""}, q:"I get the ___ that tonight's concert is going to be something special.", opts:["feeling","rhythm","moves","mind"], a:[0], why:"<b>get the feeling (that)</b> = tener la sensación de que."},
   {t:"choice", q:"Although the costume looked ___ at first, it soon became a trend among teenagers.", opts:["weird","eager","fond","proud"], a:[0], why:"<b>weird</b> = raro. <i>Eager</i> y <i>proud</i> van seguidos de <i>to</i> / <i>of</i> y se dicen de personas."},
   {t:"choice", q:"The semi-final will be shown as a live ___ on national television.", opts:["broadcast","venue","criticism","rhythm"], a:[0], why:"<b>broadcast</b> = retransmisión, emisión."},
   {t:"choice", q:"Thousands of fans were ___ their arms in the air and singing along to every song.", opts:["waving","rehearsing","starring","broadcasting"], a:[0], why:"<b>wave</b> = agitar. <i>Waving their arms</i> = moviendo los brazos."},
   {t:"choice", gloss:{"early": "pronto, con antelación"}, q:"Clara was so ___ to meet her idol that she arrived at the venue five hours early.", opts:["eager","fond","weird","tired"], a:[0], why:"<b>eager to + verbo</b> = con muchas ganas de. <i>Fond</i> necesita <i>of</i>."},
   {t:"choice", q:"Their new single has a catchy ___ that makes everyone want to dance.", opts:["rhythm","venue","criticism","broadcast"], a:[0], why:"<b>rhythm</b> = ritmo."}
  ]},

  {n:2, lvl:1, no:2, vocab:1, title:"Música y baile: completa el texto", instr:"Completa cada texto con las palabras del banco. Sobra una.",
   bank:["venue","rehearsed","cheered","criticism","fond of","dance moves","show off","eager","weird","rhythm","broadcast"], items:[
   {t:"fill", gloss:{"had":""}, q:"Last Saturday my band played at a small ___ in our town. We had ___ every afternoon for a month, so we felt confident. The audience ___ after every song and, honestly, I was surprised: I had been expecting some ___.", a:[["venue"],["rehearsed"],["cheered"],["criticism"]], why:"<b>venue</b> (lugar del concierto) · <b>rehearsed</b> (<i>had rehearsed</i>) · <b>cheered</b> (vitoreó) · <b>criticism</b> (críticas)."},
   {t:"fill", q:"My little sister is really ___ hip-hop. She learns every one of the new ___ from online videos, and she loves to ___ in front of the whole family.", a:[["fond of"],["dance moves"],["show off"]], why:"<b>fond of</b> + nombre · <b>dance moves</b> = pasos de baile · <b>show off</b> = presumir."},
   {t:"fill", gloss:{"break": "descanso, pausa", "ends": "acaba (end up = acabar haciendo algo)"}, q:"The lead singer is ___ to perform again after a long break. At first the new song sounds ___, but the ___ is so catchy that the whole crowd ends up dancing.", a:[["eager"],["weird"],["rhythm"]], why:"<b>eager to</b> = con ganas de · <b>weird</b> = raro · <b>rhythm</b> = ritmo."}
  ]},

  {n:3, lvl:1, no:3, vocab:1, title:"Videojuegos: de la definición a la palabra", instr:"Escribe la palabra o expresión que corresponde a la definición en inglés.", items:[
   {t:"fill", q:"The graphics are so good that you quickly become ___ in the game's world.", hint:"completely absorbed in something", a:[["immersed"]], why:"<b>immersed</b> = sumergido, totalmente metido en algo."},
   {t:"fill", gloss:{"has":"", "keep": "seguir el ritmo (keep up with)"}, q:"Shops can't keep up with demand: the new console has ___ everywhere.", hint:"no copies are left", a:[["sold out"]], why:"<b>sell out</b> = agotarse. Aquí <i>has sold out</i>."},
   {t:"fill", q:"Learning the whole song in one afternoon was an incredible ___.", hint:"an impressive achievement", a:[["feat"]], why:"<b>feat</b> = hazaña."},
   {t:"fill", q:"Developers use ___ graphics to make the colours look bright and intense.", hint:"bright and intense", a:[["vivid"]], why:"<b>vivid</b> = vivo, intenso."},
   {t:"fill", q:"Do you think you can ___ that level without losing a single life?", hint:"succeed in doing something difficult", a:[["pull off"]], why:"<b>pull off</b> = conseguir algo difícil."},
   {t:"fill", gloss:{"opening": "inicial, de apertura"}, q:"In the opening scene, the hero ___ on a long journey to rescue his friends.", hint:"starts a journey", a:[["sets off"]], why:"<b>set off</b> = ponerse en marcha. Con <i>the hero</i>: <i>sets off</i>."},
   {t:"fill", gloss:{"like": "como, parecido a"}, q:"I can't ___ the characters in that game; their problems are nothing like mine.", hint:"identify with", a:[["relate to"]], why:"<b>relate to</b> = identificarse con."},
   {t:"fill", q:"Whether you win or lose, the real ___ comes from playing with friends.", hint:"the pleasure you get from something", a:[["enjoyment"]], why:"<b>enjoyment</b> = disfrute (nombre)."},
   {t:"fill", q:"The final boss was so ___ that nobody could explain what it was supposed to be.", hint:"very strange", a:[["bizarre"]], why:"<b>bizarre</b> = extraño, raro."},
   {t:"fill", gloss:{"coaches": "entrenadores"}, q:"Good coaches ___ their players' progress to see who needs extra training.", hint:"follow closely", a:[["keep track of"]], why:"<b>keep track of</b> = seguir la pista de."}
  ]},

  {n:4, lvl:1, no:4, title:"Formación de palabras", instr:"Escribe la forma correcta de la palabra entre paréntesis.", items:[
   {t:"fill", q:"Her ___ in the main role was praised by every critic.", hint:"perform", a:[["performance"]], why:"perform → perform<b>ance</b>."},
   {t:"fill", gloss:{"getting": "recibir"}, q:"Getting so much ___ from the fans made him more confident.", hint:"encourage", a:[["encouragement"]], why:"encourage → encourage<b>ment</b>."},
   {t:"fill", gloss:{"sold": "agotarse (sell out)"}, q:"The concert was a huge ___: every ticket sold out in minutes.", hint:"succeed", a:[["success"]], why:"succeed → <b>success</b> (cambia la raíz)."},
   {t:"fill", gloss:{"forms": "formas, tipos"}, q:"Online games have become one of the most popular forms of ___.", hint:"entertain", a:[["entertainment"]], why:"entertain → entertain<b>ment</b>."},
   {t:"fill", q:"The painting was the ___ for his new song.", hint:"inspire", a:[["inspiration"]], why:"inspire → inspir<b>ation</b>."},
   {t:"fill", q:"The ___ of this game has grown quickly: it now has ten million players.", hint:"popular", a:[["popularity"]], why:"popular → popular<b>ity</b>."},
   {t:"fill", q:"The main ___ of the game is that the levels are extremely long.", hint:"difficult", a:[["difficulty"]], why:"difficult → difficul<b>ty</b>."},
   {t:"fill", q:"It is ___ to hear the singer over all that noise.", hint:"possible", a:[["impossible"]], why:"possible → <b>im</b>possible."},
   {t:"fill", q:"She is a very ___ dancer: her moves are always original.", hint:"create", a:[["creative"]], why:"create → creat<b>ive</b>."},
   {t:"fill", gloss:{"beginning": "principio", "end": "final"}, q:"The film was so ___ that we laughed from beginning to end.", hint:"enjoy", a:[["enjoyable"]], why:"enjoy → enjoy<b>able</b>."}
  ]},

  {n:5, lvl:1, no:5, nogloss:1, title:"Present perfect: completa el texto", instr:"Completa con los verbos entre paréntesis en present perfect simple o continuous.", items:[
   {t:"fill", q:"I ___ (learn) the drums for about a year now. I ___ (already / join) a band, and we ___ (rehearse) every Friday since January.", a:[["{have|'ve} been learning"],["{have|'ve} already joined"],["{have|'ve} been rehearsing"]], why:"<i>For about a year</i> → <b>have been learning</b> · <i>already</i> + acción hecha → <b>have already joined</b> · <i>since January</i> → <b>have been rehearsing</b>."},
   {t:"fill", q:"Mia ___ (study) for the exam all afternoon, so she's exhausted. She ___ (not / finish) the last chapter yet, but she ___ (read) three others already.", a:[["{has|'s} been studying"],["{hasn't|has not} finished"],["{has|'s} read"]], why:"<i>All afternoon</i> + cansancio → <b>has been studying</b> · <i>yet</i> → <b>hasn't finished</b> · cantidad (<i>three</i>) → <b>has read</b>."},
   {t:"fill", q:"Developers ___ (work) on this game for five years. They ___ (release) two updates this month, and players ___ (complain) about the bugs ever since.", a:[["{have|'ve} been working"],["{have|'ve} released"],["{have|'ve} been complaining"]], why:"<i>For five years</i> → <b>have been working</b> · <i>two updates this month</i> → <b>have released</b> · <i>ever since</i> → <b>have been complaining</b>."},
   {t:"fill", q:"A: How long ___ you ___ (wait) here?\nB: About two hours. The doors ___ (not / open) yet, and the queue ___ (get) longer all morning.", a:[["have"],["been waiting"],["{haven't|have not} opened"],["{has|'s} been getting"]], why:"<b>How long have you been waiting</b>? · <i>yet</i> → <b>haven't opened</b> · <i>all morning</i> → <b>has been getting</b>."}
  ]},

  {n:6, lvl:1, no:6, nogloss:1, title:"Encuentra el error y corrígelo", instr:"Cada frase tiene un error de tiempo verbal o de uso. Escribe la frase corregida.", items:[
   {t:"write", q:"We've been seeing that film three times already.", a:["we{ have|'ve} seen that film three times already"], why:"Con una cantidad (<i>three times</i>) se usa el <b>present perfect simple</b>: <i>We've seen</i>."},
   {t:"write", q:"She has been playing the guitar yesterday afternoon.", a:["she {played|was playing} the guitar yesterday afternoon"], why:"<i>Yesterday afternoon</i> es un momento concreto y terminado → <b>past simple</b>."},
   {t:"write", q:"I've been wanting to see this band for years.", a:["i{ have|'ve} wanted to see this band for years"], why:"<i>Want</i> es un verbo de estado: no suele ir en continuous → <b>I've wanted</b>."},
   {t:"write", q:"The singer hasn't been rehearsing since three hours.", a:["the singer {hasn't|has not} been rehearsing for three hours"], why:"<b>For</b> + periodo (<i>three hours</i>); <b>since</b> + momento en que empezó."},
   {t:"write", q:"How many songs has the band been recording this year?", a:["how many songs has the band recorded this year"], why:"<i>How many</i> (cantidad) → <b>present perfect simple</b>."},
   {t:"write", q:"They have been just finishing their new album.", a:["they{ have|'ve} just finished their new album"], why:"<i>Just</i> + acción terminada → <b>present perfect simple</b>."},
   {t:"write", q:"My brother is playing video games since he got home.", a:["my brother{ has|'s} been playing video games since he got home"], why:"<i>Since</i> + algo que continúa → <b>has been playing</b>, no presente simple/continuous."},
   {t:"write", q:"Have you been ever to a music festival?", a:["have you ever been to a music festival"], why:"<i>Ever</i> va entre <i>have</i> y el participio: <b>Have you ever been…?</b>"}
  ]},

  {n:7, lvl:1, no:7, nogloss:1, title:"Reescribe con la palabra clave", instr:"Reescribe la frase para que signifique lo mismo. Usa la palabra entre paréntesis.", items:[
   {t:"write", q:"I started playing the piano three years ago and I still play it. (for)", a:["i{ have|'ve} been playing the piano for three years","i{ have|'ve} played the piano for three years"], why:"<b>for three years</b> + acción que continúa: <i>I've been playing…</i>"},
   {t:"write", q:"The last time we went to a concert was in June. (since)", a:["we {haven't|have not} {been|gone} to a concert since june"], why:"<b>We haven't been to a concert since June.</b>"},
   {t:"write", q:"When did you start working on this project? (How long)", a:["how long have you been working on this project"], why:"La duración se pregunta con <b>How long have you been + -ing</b>."},
   {t:"write", q:"It's the first time he has performed on stage. (never)", a:["he{ has|'s} never performed on stage[ before]"], why:"<b>He has never performed on stage (before).</b>"},
   {t:"write", q:"They began rehearsing at nine and they are still rehearsing. (since)", a:["they{ have|'ve} been rehearsing since nine[ o'clock]"], why:"<b>since nine</b> = desde las nueve → present perfect continuous."},
   {t:"write", q:"My phone broke two weeks ago and it still doesn't work. (for)", a:["my phone {hasn't|has not} {been working|worked} for two weeks"], why:"<b>My phone hasn't been working for two weeks.</b>"},
   {t:"write", q:"I got to the venue at six and I'm still waiting. (since)", a:["i{ have|'ve} been waiting [at the venue ]since six[ o'clock]"], why:"<b>I've been waiting since six.</b>"},
   {t:"write", q:"Lucy is tired because she danced for three hours. (been)", a:["lucy is tired because she{ has|'s} been dancing for three hours"], why:"Resultado visible + duración → <b>she has been dancing</b>."}
  ]},

  {n:8, lvl:1, no:8, vocab:1, nogloss:1, title:"Ocio, conectores y diálogo", instr:"Completa cada texto con las palabras o expresiones indicadas.", items:[
   {t:"fill", q:"We queued for almost two hours to get into the amusement park. ___ we reached the entrance, and ___ we were inside, we ran to the roller coaster. ___ the day we went on every ride, and ___, I've been a roller coaster fan.", hint:"eventually · as soon as · in the course of · ever since then", a:[["eventually"],["as soon as"],["in the course of"],["ever since then"]], why:"<b>eventually</b> (al final) · <b>as soon as</b> (en cuanto) · <b>in the course of</b> (a lo largo de) · <b>ever since then</b> (desde entonces)."},
   {t:"fill", q:"Last summer I visited a huge amusement park. The ___ was a giant roller coaster that goes ___ speed and even turns you upside ___. If you prefer something calmer, you can ride the big ___ and enjoy the view.", hint:"main attraction · at full · down · wheel", a:[["main attraction"],["at full"],["down"],["wheel"]], why:"<b>main attraction</b> · <b>at full speed</b> (a toda velocidad) · <b>upside down</b> (boca abajo) · <b>big wheel</b> (noria)."},

/* =====================================================================
   ÍNDICE Y PERFILES
   ===================================================================== */
const UNITS = ALL_UNITS;

const INDEX={};
UNITS.forEach(u=>u.exercises.forEach(ex=>{
  ex.unit=u; ex.id=u.id+"e"+ex.n;
  ex.items.forEach((it,i)=>{ it.id=ex.id+"i"+i; it.ex=ex; INDEX[it.id]=it; });
}));
const ALL_ITEMS=Object.values(INDEX);
const SELFMARK_MAX=2;

let PROFILE=null;
function profileOf(id){ return (id==="profe"?TEACHER:null)||PROFILES.find(p=>p.id===id)||null; }
function me(){ return profileOf(PROFILE); }
function myUnits(){ return UNITS.filter(u=>u.owner===PROFILE); }
function myItems(){ return ALL_ITEMS.filter(i=>i.ex.unit.owner===PROFILE); }

/* =====================================================================
   ESTADO — uno independiente por alumno
   ===================================================================== */
const TKEY="cuaderno-arcade-theme";
const LASTKEY="cuaderno-arcade-last";
function skey(){ return "cuaderno-arcade-v3-"+PROFILE; }
function blank(){
  return {xp:0, tokens:3, lvl:0, ex:{}, wrong:[], resume:{}, answers:{},
    stats:{answers:0, correct:0, bestStreak:0, bestMult:1, saves:0, tokensSpent:0,
           byUnit:{}, sessions:[], selfmarks:[]}};
}
let S=blank();
function hydrate(o){
  const b=blank();
  return Object.assign(b, o, {stats:Object.assign(b.stats, (o&&o.stats)||{})});
}
function useProfile(id){
  PROFILE=id;
  S=blank();
  try{
    const raw=localStorage.getItem(skey());
    if(raw) S=hydrate(JSON.parse(raw));
  }catch(e){}
  try{ localStorage.setItem(LASTKEY, id); }catch(e){}
  paintWho();
  syncDown(id);
}
function saveLocal(){ if(!PROFILE) return; try{ localStorage.setItem(skey(), JSON.stringify(S)); }catch(e){} }
function save(){
  if(!PROFILE) return;
  S.updatedAt=Date.now();
  saveLocal();
  schedulePush();
}

/* ---------- nube ---------- */
let cloudState="…", pushT=null;
function setCloud(st){
  cloudState=st;
  const c=document.getElementById("cloudchip"); if(!c) return;
  c.hidden=!PROFILE || view.name==="profiles";
  const map={ok:["☁︎","Guardado en la nube","var(--green)"],
              wait:["⟳","Guardando…","var(--ink-faint)"],
              off:["⚠","Sin conexión: se guardará al volver","var(--mark-deep)"],
              deny:["🔒","Sin permiso para guardar: cierra sesión y vuelve a entrar","var(--red)"],
              none:["☁︎","Solo en este dispositivo","var(--ink-faint)"]};
  const [ico,title,col]=map[st]||map.none;
  c.textContent=ico; c.title=title; c.style.color=col;
}
async function syncDown(id){
  if(!window.CLOUD) return setCloud("none");
  setCloud("wait");
  try{
    const remote=await CLOUD.load(id);
    if(PROFILE!==id) return;
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
      S=hydrate(remote); saveLocal(); setCloud("ok");
      if(view.name!=="play") render();
      toast("Progreso recuperado de la nube");
    } else if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)){
      await pushUp();
    } else setCloud("ok");
  }catch(e){ setCloud(e&&e.code==="permission-denied"?"deny":"off"); }
}
function schedulePush(){
  if(!window.CLOUD) return setCloud("none");
  setCloud("wait");
  clearTimeout(pushT);
  pushT=setTimeout(pushUp, 1500);
}
async function pushUp(){
  if(!window.CLOUD || !PROFILE) return;
  clearTimeout(pushT);
  try{ await CLOUD.save(PROFILE, JSON.parse(JSON.stringify(S))); setCloud("ok"); }
  catch(e){ setCloud(e&&e.code==="permission-denied"?"deny":"off"); }
}
window.addEventListener("cloud-ready",()=>{ if(PROFILE) syncDown(PROFILE); else setCloud("none"); });

/* Sesión recordada: solo se mira en el arranque. Si ya había un alumno dentro,
   se abre su perfil sin pedir nada; si era el profesor, su panel. */
window.addEventListener("auth-state",e=>{
  const {email, first}=e.detail||{};
  if(!first || !email) return;
  if(PROFILE) return;
  const id=studentFromEmail(email);
  if(id){ useProfile(id); go({name:"home"}); }
  else { go({name:"teacher"}); }
});
window.addEventListener("online",()=>{ if(PROFILE) pushUp(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") pushUp(); });
function paintWho(){
  const btn=document.getElementById("whobtn"), p=me();
  const sub=document.querySelector(".brand-sub");
  if(!p){ btn.hidden=true; if(sub) sub.textContent="Elige alumno"; return; }
  btn.hidden=false;

const LEVELS=[
  {xp:0,name:"Rookie"},{xp:250,name:"A2 Explorer"},{xp:600,name:"B1 Runner"},
  {xp:1100,name:"B1+ Sniper"},{xp:1800,name:"B2 Boss"},{xp:2600,name:"Grammar Legend"}
];
function levelIdx(xp){let i=0;for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k].xp) i=k;return i;}
function levelOf(xp){
  const i=levelIdx(xp), cur=LEVELS[i], nxt=LEVELS[i+1];
  return {i,name:cur.name,cur,nxt,pct:nxt?Math.round((xp-cur.xp)/(nxt.xp-cur.xp)*100):100};
}
/* multiplicador de racha: ×1.0 sin racha, ×1.1 a partir de 2 aciertos, tope ×2.0 */
function multOf(streak){ return streak<2 ? 1 : Math.min(2, 1+0.1*(streak-1)); }
function fmtMult(m){ return "×"+m.toFixed(1); }

function addXP(base, mult){
  const g=Math.round(base*mult);
  S.xp+=g;
  const nl=levelIdx(S.xp);
  const up=nl>S.lvl?2*(nl-S.lvl):0;
  if(up){ S.tokens+=up; S.lvl=nl; toast("¡Nivel "+LEVELS[nl].name+"! +"+up+" 🎟️"); setTimeout(()=>SFX.play("levelup"),380); }
  setTimeout(()=>{
    if(g) flyXP("+"+g+" XP");
    bumpChip(".chip.xp");
    if(up){ bumpChip(".chip.tok"); setTimeout(()=>flyXP("+"+up+" 🎟️","tok"),240); }
  },0);
  return g;
}

function statsFor(p, d){
  const units=UNITS.filter(u=>u.owner===p.id);
  const items=units.flatMap(u=>u.exercises.flatMap(e=>e.items));
  const ok=d?items.filter(i=>d.ex[i.id]==="ok").length:0;
  const levels={};
  units.forEach(u=>u.exercises.forEach(e=>{
    const L=e.lvl||1;
    levels[L]=levels[L]||{ok:0,tot:0};
    e.items.forEach(i=>{ levels[L].tot++; if(d&&d.ex[i.id]==="ok") levels[L].ok++; });
  }));
  const acc=d&&d.stats.answers?Math.round(d.stats.correct/d.stats.answers*100):0;
  const wrong=(d?d.wrong:[]).map(id=>INDEX[id]).filter(Boolean);
  return {units, items, ok, levels, acc, wrong, d};
}

let TDATA={};   /* progreso de cada alumno, cargado al abrir el panel */
function tdata(id){ return TDATA[id]||hydrate({}); }
function lastAtt(d,it){ const a=(d.answers||{})[it.id]; return a&&a.length?a[a.length-1]:null; }
/* ok · ko · mid (casi / dada por buena) · "" sin contestar */
function itemState(d,it){
  const a=lastAtt(d,it);
  if(a){ if(a.s) return "mid"; return a.r==="ok"?"ok":a.r==="near"?"mid":"ko"; }
  const e=d.ex[it.id]; return e==="ok"?"ok":e==="ko"?"ko":e==="self"?"mid":"";
}
function escAttr(s){ return esc(String(s==null?"":s)).replace(/"/g,"&quot;"); }
function modelOf(it){
  if(it.t==="choice") return it.opts[it.a[0]];
  if(it.t==="fill") return it.a.map(t=>expand(t[0])[0]).join(" / ");
  if(it.t==="write") return (it.lead?it.lead+" ":"")+expand(it.a[0])[0];
  return "Todas emparejadas";
}

/* lo que ve el profe de una pregunta: igual que dentro del ejercicio, con las
   respuestas del alumno puestas y todo desactivado */
function reviewBody(it,att){
  const ex=it.ex, has=!!att, L="ABCDEFGHI";
  const rev=has&&att.r==="rev";
  const vals=has&&Array.isArray(att.v)?att.v:[];
  const bank=ex.bank?`<div class="instr" style="margin-top:8px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:"";
  if(it.t==="choice"){
    const pick=has&&att.p!=null?att.p:-1;
    return `<div class="stem">${esc(it.q).replace(/___/g,'<span style="color:var(--ink-faint)">______</span>')}</div>
    <div class="opts ${it.opts.length>4?"bank":""}">
      ${it.opts.map((o,k)=>{
        const right=it.a.includes(k); let cls="";
        if(has&&right) cls="ok"; if(k===pick&&!right) cls="no";
        return `<button class="opt ${cls}" disabled><span class="key">${L[k]}</span><span>${esc(o)}</span>${k===pick?'<span class="rv-tag">respuesta del alumno</span>':""}</button>`;
      }).join("")}
    </div>`;
  }
  if(it.t==="fill"){
    let n=0;
    const stem=esc(it.q).replace(/___/g,()=>{
      const k=n++, v=vals[k]; let cls="";
      if(has&&!rev&&v!=null) cls=judge(v,it.a[k])==="ok"?"ok":"no";
      return `<input class="blank ${cls}" value="${escAttr(v)}" disabled>`;
    });
    return `<div class="stem">${stem}</div>
      ${it.hint?`<div style="margin-top:12px" class="instr">Pista: <span class="hint" style="font-family:var(--f-mono)">${esc(it.hint)}</span></div>`:""}${bank}`;
  }
  if(it.t==="write"){
    const v=has&&typeof att.v==="string"?att.v:"";
    const cls=has&&!rev?(judge(v,it.a,it.lead)==="ok"?"ok":"no"):"";
    return `<div class="stem">${esc(it.q)}</div>${bank}
      <div class="answerline">
        ${it.lead?`<div class="stem lead" style="font-size:15px">${esc(it.lead)} …</div>`:""}
        <input class="${cls}" value="${escAttr(v)}" placeholder="${has?"(sin escribir nada)":""}" disabled>
      </div>`;
  }
  /* match */
  return `<div class="stem" style="font-size:16px">${esc(it.q)}</div>
    <div class="mcol" style="margin-top:14px">${it.pairs.map((q,k)=>`<div class="mitem done"><span class="tag">${k+1}</span>${esc(q[0])} <b>→</b> ${esc(q[1])}</div>`).join("")}</div>
    ${has&&!rev?(att.e?`<p class="fb-note" style="margin-top:12px;display:block;line-height:1.55">Fallos al emparejar (${att.e}): ${(att.w||[]).map(w=>esc(it.pairs[w[0]][0])+" ↔ "+esc(it.pairs[w[1]][1])).join(" · ")}</p>`
        :`<p class="fb-note" style="margin-top:12px;display:block">Lo emparejó todo a la primera.</p>`):""}`;
}
function reviewFeedback(it,att,d){
  let cls="", title="";
  if(att){
    if(att.s){ cls="near"; title="≈ La dio por buena el alumno (autocorrección)"; }
    else if(att.r==="ok") { cls="good"; title="✓ Correcta"; }
    else if(att.r==="near"){ cls="near"; title="≈ Casi: error de ortografía"; }
    else if(att.r==="rev") { cls="bad"; title="Vio la respuesta sin contestar"; }
    else if(it.t==="match"){ cls="bad"; title="✕ Las emparejó todas, pero con "+(att.e||0)+" fallo(s) por el camino"; }
    else { cls="bad"; title="✕ Incorrecta"; }
  } else {
    const e=d.ex[it.id];
    if(e){ cls=e==="ok"?"good":e==="self"?"near":"bad";
      title=(e==="ok"?"✓ Constaba como acertada":e==="self"?"≈ Constaba como dada por buena":"✕ Constaba como fallada")+" · su respuesta no se guardó (la hizo antes de que la web guardara las respuestas)"; }
    else title="Todavía no ha contestado esta pregunta";
  }
  const correct=att&&att.r==="ok"&&!att.s;
  return `<div class="fb ${cls}">
    <div class="fb-t">${title}</div>
    ${correct?"":`<div class="fb-sol"><b>Solución:</b> ${esc(modelOf(it))}</div>`}
    ${it.why?`<div class="fb-why">${it.why}</div>`:""}
  </div>`;
}

/* ---------- rondas a medias ----------
   Cada ronda tiene una clave (un ejercicio, una unidad entera, el examen o el
   repaso de fallos) y, tras cada pregunta contestada, se guarda por dónde va.
   Se guarda junto al resto del progreso, así que también viaja a la nube. */
function roundKey(m){
  if(m.key!==undefined) return m.key;
  return m.exam?"exam":m.review?"wrong":m.ex?"ex:"+m.ex.id:m.unit?"unit:"+m.unit.id:null;
}
function metaToStore(m){
  return {title:m.title||"", unit:m.unit?m.unit.id:null, ex:m.ex?m.ex.id:null, exam:!!m.exam, review:!!m.review};
}
function metaFromStore(s){
  const unit=s.unit?UNITS.find(u=>u.id===s.unit):null;
  let ex=null;
  if(s.ex) UNITS.forEach(u=>u.exercises.forEach(e=>{ if(e.id===s.ex) ex=e; }));
  return {title:s.title, unit, ex, exam:s.exam||undefined, review:s.review||undefined};
}
function saveResume(){
  if(!run) return;
  const key=roundKey(run.meta); if(!key) return;
  S.resume=S.resume||{};
  S.resume[key]={at:Date.now(), ids:run.items.map(x=>x.id), i:run.i+1,
    correct:run.correct, xp:run.xp||0, streak:run.streak, best:run.best, bestMult:run.bestMult,
    selfUsed:run.selfUsed, saves:run.saves,
    misses:run.misses.map(m=>({id:m.it.id,given:m.given,model:m.model})),
    meta:metaToStore(run.meta)};
  /* como mucho 8 rondas guardadas: se descartan las más antiguas */
  const keys=Object.keys(S.resume).sort((a,b)=>S.resume[b].at-S.resume[a].at);
  keys.slice(8).forEach(k=>delete S.resume[k]);
}
function clearResume(key){ if(key && S.resume && S.resume[key]){ delete S.resume[key]; } }
/* una ronda guardada solo vale si todas sus preguntas siguen existiendo */
function resumeValid(r){ return !!r && Array.isArray(r.ids) && r.ids.length && r.ids.every(id=>INDEX[id]); }
function pendingList(){
  return Object.keys(S.resume||{}).filter(k=>resumeValid(S.resume[k]))
    .map(k=>Object.assign({key:k},S.resume[k]))
    .sort((a,b)=>b.at-a.at);
}
function resumeRun(key){
  const r=S.resume&&S.resume[key];
  if(!resumeValid(r)){ clearResume(key); save(); return false; }
  const items=r.ids.map(id=>INDEX[id]);
  run={items, i:Math.min(r.i,items.length), correct:r.correct||0, xp:r.xp||0, streak:r.streak||0,
       best:r.best||0, bestMult:r.bestMult||1, selfUsed:r.selfUsed||0, saves:r.saves||0,
       misses:(r.misses||[]).map(m=>({it:INDEX[m.id],given:m.given,model:m.model})).filter(m=>m.it),
       answered:false, meta:metaFromStore(r.meta||{}), t0:Date.now()};
  go({name:run.i>=items.length?"done":"play"});
  return true;
}

function startRun(items,meta){
  meta=meta||{};
  const key=roundKey(meta);
  /* si esa ronda estaba a medias, se pregunta antes de empezar de cero */
  if(key && !meta.fresh && resumeValid(S.resume&&S.resume[key])){
    go({name:"resume", key, items, meta});
    return;
  }
  if(key) clearResume(key);
  run={items:items.slice(),i:0,correct:0,xp:0,streak:0,best:0,bestMult:1,misses:[],
       answered:false,selfUsed:0,saves:0,meta:meta,t0:Date.now()};
  go({name:"play"});
}

const VERBS={}, VERB_FORMS={};
(function(){
  const thirdOf=b=>/(s|sh|ch|x|z|o)$/.test(b)?b+"es":(/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ies":b+"s");
  const ingOf=b=>/[^e]e$/.test(b)?b.slice(0,-1)+"ing":b+"ing";
  const edOf=b=>/e$/.test(b)?b+"d":(/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ied":b+"ed");
  VERB_SRC.forEach(src=>{
    const [base,es,v2,v3,extra]=src.split("|");
    const past=v2||edOf(base), pp=v3||edOf(base);
    const v={base,es,past,pp};
    VERBS[base]=v;
    const set=new Set([base,thirdOf(base),ingOf(base),edOf(base)]);
    past.split(" / ").forEach(x=>set.add(x.trim()));
    pp.split(" / ").forEach(x=>set.add(x.trim()));
    (extra||"").split(",").forEach(x=>{ x=x.trim(); if(x) set.add(x); });
    set.forEach(f=>{ if(f&&!VERB_FORMS[f]) VERB_FORMS[f]=v; });
  });
})();
function verbLookup(w){
  const k=w.toLowerCase().replace(/[’']/g,"'");
  if(NO_GLOSS.has(k)||GLOSSARY[k]) return null;
  return VERB_FORMS[k]||null;
}
function verbRole(v,form){
  const f=form.toLowerCase();
  if(f===v.base) return "infinitivo / presente";
  if(v.past.split(" / ").some(x=>x.trim()===f)) return "pasado simple";
  if(v.pp.split(" / ").some(x=>x.trim()===f)) return "participio";
  if(/ing$/.test(f)) return "gerundio (-ing)";
  if(/n't$/.test(f)) return "negativa";
  if(/s$/.test(f)) return "3.ª persona del singular";
  return "forma del verbo";
}
function glossLookup(w){
  const k=w.toLowerCase().replace(/[’']s$/,"");
  if(NO_GLOSS.has(k)) return null;
  if(GLOSSARY[k]) return GLOSSARY[k];
  if(/ies$/.test(k)&&GLOSSARY[k.slice(0,-3)+"y"]) return GLOSSARY[k.slice(0,-3)+"y"];
  if(/(ches|shes|sses|xes)$/.test(k)&&GLOSSARY[k.slice(0,-2)]) return GLOSSARY[k.slice(0,-2)];
  if(/s$/.test(k)&&GLOSSARY[k.slice(0,-1)]) return GLOSSARY[k.slice(0,-1)];
  return null;
}
/* Los verbos auxiliares (do, have, be) no se traducen cuando solo ayudan a otro verbo. */
function nextWords(text, from){
  const r=/[A-Za-z][A-Za-z'’-]*/g; r.lastIndex=from; const o=[]; let m;
  while(o.length<3 && (m=r.exec(text))) o.push(m[0].toLowerCase());
  return o;
}
function isAuxUse(vb, k, nx){
  const PRON=/^(i|you|he|she|it|we|they)$/;
  const ADV=/^(even|still|only|really|nearly|almost|often|already|just|always|never|ever|also|finally|recently|not|yet)$/;
  let [n0="", n1="", n2=""]=nx;
  if(ADV.test(n0)){ n0=n1; n1=n2; }
  const pp=w=>{ const v=VERB_FORMS[w]; return !!v && (/ed$/.test(w) || v.pp.split(" / ").some(x=>x.trim()===w)); };
  const ing=w=>/ing$/.test(w) && w.length>4;
  if(vb.base==="do") return !/^(doing|done)$/.test(k) && !!n0;
  if(vb.base==="have"){
    if(k==="having") return false;
    if(/n't$/.test(k)) return true;
    return pp(n0) || (PRON.test(n0) && pp(n1));
  }
  if(vb.base==="be"){
    if(k==="being") return false;
    return ing(n0) || pp(n0) || (PRON.test(n0) && (ing(n1) || pp(n1)));
  }
  return false;
}
/* Recorre el texto en crudo, escapa lo que no es palabra y envuelve las que
   tienen traducción. Devuelve HTML listo para insertar.
   itemGloss manda sobre el glosario general: es la traducción que vale en esa
   frase; con "" la palabra se deja sin traducir. */
function wrapGloss(text, itemGloss, useGlobal){
  const own={}; if(itemGloss) Object.keys(itemGloss).forEach(k=>own[k.toLowerCase()]=itemGloss[k]);
  const re=/[A-Za-z][A-Za-z'’-]*/g;
  let out="", last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const w=m[0], k=w.toLowerCase();
    const hasOwn=Object.prototype.hasOwnProperty.call(own,k);
    const tr=hasOwn?own[k]:(useGlobal?glossLookup(k):null);
    let vb=(!hasOwn&&!tr&&useGlobal)?verbLookup(k):null;
    if(vb && isAuxUse(vb,k,nextWords(text,m.index+w.length))) vb=null;
    if(tr){
      out+=`<button type="button" class="voc" data-t="${esc(tr).replace(/"/g,"&quot;")}">${esc(w)}</button>`;
    } else if(vb){
      out+=`<button type="button" class="vrb" data-v="${esc(vb.base)}" data-f="${esc(k)}">${esc(w)}</button>`;
    } else {
      out+=esc(w);
    }
    last=m.index+w.length;
  }
  return out+esc(text.slice(last));
}

  card.querySelectorAll(".voc, .vrb").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    card.querySelectorAll(".open").forEach(x=>x.classList.remove("open"));
    b.classList.add("open"); SFX.play("pop");
    const isVerb=b.classList.contains("vrb");
    if(isVerb){
      const v=VERBS[b.dataset.v], f=b.dataset.f;
      glossEl.className="gloss verb";
      glossEl.innerHTML=`<b>to ${esc(v.base)}</b>${esc(v.es)}
        <div class="vrole">${esc(b.textContent)} · ${esc(verbRole(v,f))}</div>
        <div class="vgrid">
          <span class="vh">Infinitivo</span><span class="vh">Pasado</span><span class="vh">Participio</span>
          <span class="vf ${f===v.base?"cur":""}">${esc(v.base)}</span>
          <span class="vf ${v.past.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.past)}</span>
          <span class="vf ${v.pp.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.pp)}</span>
        </div>`;
    } else {
      glossEl.className="gloss";
      glossEl.innerHTML=`<b>${esc(b.textContent)}</b>${esc(b.dataset.t||"")}`;
    }
    glossEl.hidden=false;
    const r=b.getBoundingClientRect();
    const w=Math.min(isVerb?300:250, glossEl.offsetWidth||(isVerb?300:250));
    let left=r.left+window.scrollX+r.width/2-w/2;
    left=Math.max(10, Math.min(left, window.innerWidth-w-14));
    glossEl.style.left=left+"px";
    glossEl.style.top=(r.bottom+window.scrollY+8)+"px";
  });
}
document.addEventListener("click",()=>{ glossEl.hidden=true; document.querySelectorAll(".voc.open, .vrb.open").forEach(x=>x.classList.remove("open")); });

function paintQuestion(it){
  const card=document.getElementById("qcard"), ex=it.ex;
  let body="";
  const stemHTML=t=>wrapGloss(t, it.gloss, !(it.tr||ex.nogloss));

  if(it.t==="choice"){
    /* Las opciones se muestran en orden aleatorio, para que la buena no sea
       siempre la primera. Cada botón guarda su índice original (data-i): la
       corrección compara con ese índice, no con la posición en pantalla. */
    const order=shuffle(it.opts.map((_,i)=>i));
    body=`<div class="stem">${stemHTML(it.q).replace(/___/g,'<span style="color:var(--ink-faint)">______</span>')}</div>
    <div class="opts ${it.opts.length>4?"bank":""}" id="opts">
      ${order.map((i,pos)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(it.opts[i])}</span></button>`).join("")}
    </div>`;
  } else if(it.t==="fill"){
    let n=0;
    const stem=stemHTML(it.q).replace(/___/g,()=>`<input class="blank" data-b="${n++}" autocomplete="off" autocapitalize="off" spellcheck="false">`);
    body=`<div class="stem">${stem}</div>
      ${it.hint?`<div style="margin-top:12px" class="instr">Pista: <span class="hint" style="font-family:var(--f-mono)">${esc(it.hint)}</span></div>`:""}
      ${ex.bank?`<div class="instr" style="margin-top:6px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:""}`;
  } else if(it.t==="write"){
    body=`<div class="stem">${stemHTML(it.q)}</div>
      ${ex.bank?`<div class="instr" style="margin-top:10px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:""}
      <div class="answerline">
        ${it.lead?`<div class="stem lead" style="font-size:15px">${esc(it.lead)} …</div>`:""}
        <input id="wr" placeholder="${it.tr?"Escribe la frase en inglés":"Escribe la frase completa"}" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>`;
  } else if(it.t==="match"){
    const left=it.pairs.map((p,i)=>({txt:p[0],i}));
    const right=shuffle(it.pairs.map((p,i)=>({txt:p[1],i})));
    body=`<div class="stem" style="font-size:16px">${esc(it.q)}</div>
    <div class="matchgrid">
      <div class="mcol">${left.map(o=>`<button class="mitem" data-side="L" data-i="${o.i}"><span class="tag">${o.i+1}</span>${esc(o.txt)}</button>`).join("")}</div>
      <div class="mcol">${right.map(o=>`<button class="mitem" data-side="R" data-i="${o.i}">${esc(o.txt)}</button>`).join("")}</div>
    </div>`;
  }

  card.innerHTML=`
    <div class="qtag">
      <span class="badge">${typeBadge(it)}</span>
      <span class="badge">${ex.unit.short} · N${ex.lvl||1} · Ej. ${ex.no||ex.n}</span>
      <span class="instr">${esc(ex.instr)}</span>
    </div>
    ${body}
    ${(body.indexOf('class="voc"')>=0||body.indexOf('class="vrb"')>=0)?`<div class="vochelp">Toca las palabras subrayadas: <span class="lg-n">azul</span> = sustantivos y adjetivos, <span class="lg-v">rojo</span> = verbos con sus tres columnas.</div>`:""}
    <div id="fbslot"></div>
    <div class="qfoot">
      <button class="btn" id="check">Comprobar</button>
      <button class="btn ghost" id="skip">Ver la respuesta</button>
      <span class="spacer"></span>
      ${theoryFor(ex.unit,ex).length?'<button class="btn ghost small" id="cheat">📖 Chuleta</button>':""}
      <span class="kbd">Enter</span>
    </div>`;

  bindGloss(card);
  const cheat=document.getElementById("cheat"); if(cheat) cheat.onclick=e=>{e.stopPropagation();openTheory(ex.unit,ex);};
  const checkBtn=document.getElementById("check");
  run.answered=false;

  if(it.t==="choice"){
    /* tocar una opción solo la selecciona; se corrige al pulsar «Comprobar» */
    let picked=null;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(run.answered) return;
      picked=+b.dataset.i;
      card.querySelectorAll(".opt").forEach(x=>{ const on=x===b; x.classList.toggle("sel",on); x.setAttribute("aria-pressed",String(on)); });
      checkBtn.disabled=false; checkBtn.style.opacity="";
      SFX.play("pick");
    });
    checkBtn.disabled=true; checkBtn.style.opacity=".45";
    checkBtn.onclick=()=>{ if(picked!==null) resolveChoice(it,picked); };
  }
  if(it.t==="fill"){
    const first=card.querySelector(".blank"); if(first) first.focus();
    card.querySelectorAll(".blank").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}}));
    checkBtn.onclick=()=>resolveFill(it);
  }
  if(it.t==="write"){
    const inp=document.getElementById("wr"); inp.focus();
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}});
    checkBtn.onclick=()=>resolveWrite(it);
  }
  if(it.t==="match"){ setupMatch(it,card); checkBtn.disabled=true; checkBtn.style.opacity=".45"; }
  document.getElementById("skip").onclick=()=>reveal(it);
}
/* En las preguntas de elegir: A, B, C… o 1, 2, 3… seleccionan la opción que
   aparece en esa posición; Enter comprueba. */
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||!run||run.answered||!drawer.hidden) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const it=run.items[run.i]; if(!it||it.t!=="choice") return;
  if(e.key==="Enter"){
    if(t&&t.tagName==="BUTTON") return;   /* sobre un botón, Enter ya lo pulsa él */
    const c=document.getElementById("check");
    if(c&&!c.disabled){ e.preventDefault(); c.click(); }
    return;
  }
  const k=e.key.toLowerCase(); let idx=-1;
  if(/^[1-9]$/.test(k)) idx=+k-1; else if(/^[a-i]$/.test(k)) idx=k.charCodeAt(0)-97;
  const btn=[...document.querySelectorAll(".opt")][idx];
  if(btn){ e.preventDefault(); btn.click(); }
});
function onEnter(){
  if(run.answered){ const n=document.getElementById("next"); if(n) n.click(); return; }
  const b=document.getElementById("check");
  if(b&&!b.disabled) b.click();
}
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||!drawer.hidden) return;
  /* un Enter que acaba de comprobar no puede ser también el que avanza */
  if(e.key==="Enter"&&run&&run.answered&&!e.repeat&&Date.now()-(run.checkedAt||0)>400){ e.preventDefault(); const n=document.getElementById("next"); if(n) n.click(); }
});

/* ---------- resolución ---------- */
/* el botón de una opción, buscado por su índice original (no por su posición) */
function optBtn(i){ return document.querySelector('.opt[data-i="'+i+'"]'); }
function resolveChoice(it,pick){
  const ok=it.a.includes(pick);
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
  optBtn(pick).classList.add(ok?"ok":"no");
  if(!ok) optBtn(it.a[0]).classList.add("ok");
  finish(it,ok,it.opts[it.a[0]],it.opts[pick],false,false,false,{p:pick});
}
function resolveFill(it){
  const inputs=[...document.querySelectorAll(".blank")];
  let allOk=true, near=false;
  inputs.forEach((inp,k)=>{
    const r=judge(inp.value,it.a[k]);
    if(r==="ok") inp.classList.add("ok");
    else { inp.classList.add("no"); allOk=false; if(r==="near") near=true; }
    inp.disabled=true;
  });
  const model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  finish(it,allOk,model,inputs.map(i=>i.value).join(" / "),near&&!allOk,false,false,{v:inputs.map(i=>i.value)});
}
function resolveWrite(it){
  const inp=document.getElementById("wr");
  const r=judge(inp.value,it.a,it.lead);
  const ok=r==="ok";
  inp.classList.add(ok?"ok":"no"); inp.disabled=true;
  const model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
  finish(it,ok,model,inp.value,r==="near",!ok,false,{v:inp.value});
}
function setupMatch(it,card){
  let sel=null,errs=0,left=it.pairs.length;
  const wrongs=[];   /* parejas equivocadas: [izquierda, derecha] */
  card.querySelectorAll(".mitem").forEach(b=>b.onclick=()=>{
    if(!sel){ sel=b; b.classList.add("sel"); SFX.play("pick"); return; }
    if(sel===b){ b.classList.remove("sel"); sel=null; return; }
    if(sel.dataset.side===b.dataset.side){ sel.classList.remove("sel"); sel=b; b.classList.add("sel"); SFX.play("pick"); return; }
    if(sel.dataset.i===b.dataset.i){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done");
      sel=null; left--;
      if(left>0) SFX.play("matchOk");   /* la última pareja suena como acierto de la pregunta */
      if(left===0) finish(it,errs===0,"Todas emparejadas",errs+" fallo(s) por el camino",false,false,false,{e:errs,w:wrongs});
    } else {
      errs++; wrongs.push(sel.dataset.side==="L"?[+sel.dataset.i,+b.dataset.i]:[+b.dataset.i,+sel.dataset.i]);
      SFX.play("matchBad"); b.classList.add("shake"); sel.classList.add("shake");
      const a=sel; setTimeout(()=>{a.classList.remove("shake","sel");b.classList.remove("shake");},320);
      sel=null;
    }
  });
}
function reveal(it){
  if(run.answered) return;
  let model="", typed;
  if(it.t==="choice"){
    document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
    optBtn(it.a[0]).classList.add("ok");
    model=it.opts[it.a[0]];
  } else if(it.t==="fill"){
    typed=[...document.querySelectorAll(".blank")].map(i=>i.value);
    [...document.querySelectorAll(".blank")].forEach((inp,k)=>{ inp.value=expand(it.a[k][0])[0]; inp.classList.add("ok"); inp.disabled=true; });
    model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  } else if(it.t==="write"){
    const inp=document.getElementById("wr");
    typed=inp.value;
    model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
    inp.value=model; inp.classList.add("ok"); inp.disabled=true;
  } else if(it.t==="match"){
    document.querySelectorAll(".mitem").forEach(b=>b.classList.add("done"));
    model=it.pairs.map((p,i)=>(i+1)+" → "+p[1]).join(" · ");
  }
  finish(it,false,model,"",false,false,true,typed!==undefined?{v:typed}:{});
}

/* ---------- ¿puede autocorregirse? ---------- */
function canSelfMark(given,model){
  const g=norm(given).split(" ").filter(Boolean);
  const m=norm(model).split(" ").filter(Boolean);
  if(g.length<2) return false;
  return g.length>=Math.max(3,Math.ceil(m.length*0.6));
}

/* ---------- feedback ---------- */
/* Lo que contesta el alumno se guarda (las últimas MAX_ATT veces por pregunta)
   para que el profe pueda revisarlo como si estuviera dentro del ejercicio.
   ans: {p} opción elegida · {v} lo escrito · {e,w} fallos al emparejar. */
const MAX_ATT=5;
function recordAnswer(it,r,ans){
  const A=S.answers||(S.answers={});
  const arr=A[it.id]||(A[it.id]=[]);
  arr.push(Object.assign({t:Date.now(),r},ans||{}));
  while(arr.length>MAX_ATT) arr.shift();
}
function finish(it,ok,model,given,near,selfmarkable,revealed,ans){
  run.answered=true; run.checkedAt=Date.now();
  const slot=document.getElementById("fbslot"), foot=document.querySelector(".qfoot");
  const prevStreak=run.streak;
  let gained=0, mult=1;

  S.stats.answers++;
  const uid=it.ex.unit.id;
  S.stats.byUnit[uid]=S.stats.byUnit[uid]||{ok:0,ko:0};

  if(ok){
    run.correct++; run.streak++; run.best=Math.max(run.best,run.streak);
    mult=multOf(run.streak);
    run.bestMult=Math.max(run.bestMult,mult);
    S.stats.bestStreak=Math.max(S.stats.bestStreak,run.streak);
    S.stats.bestMult=Math.max(S.stats.bestMult,mult);
    S.stats.correct++; S.stats.byUnit[uid].ok++;
    gained=addXP(10,mult); run.xp=(run.xp||0)+gained;
    S.ex[it.id]="ok";
    S.wrong=S.wrong.filter(x=>x!==it.id);
  } else {
    run.streak=0;
    S.stats.byUnit[uid].ko++;
    run.misses.push({it,given:revealed?"(sin responder)":given,model});
    if(S.ex[it.id]!=="ok") S.ex[it.id]="ko";
    if(!S.wrong.includes(it.id)) S.wrong.push(it.id);
  }
  recordAnswer(it, ok?"ok":revealed?"rev":near?"near":"ko", ans);
  saveResume();
  save(); syncTop();
  reactCard(ok);
  /* el acierto suena más rico cuanto más larga es la racha */
  SFX.play(ok?(run.streak>=6?"good3":run.streak>=3?"good2":"good"):near?"near":revealed?"reveal":"bad");
  if(ok&&run.streak>=2) bumpChip(".chip.streak");

  const cls=ok?"good":(near?"near":"bad");
  const title=ok?(run.streak>=2?"¡Correcto! Racha de "+run.streak:"¡Correcto!")
    :near?"¡Casi! Revisa la ortografía"
    :revealed?"Respuesta modelo":"No es esa";

  const canSave = !ok && !revealed && prevStreak>=2 && S.tokens>0;
  const selfOK  = selfmarkable && !revealed && canSelfMark(given,model) && run.selfUsed<SELFMARK_MAX;
  let selfNote="";
  if(selfmarkable && !revealed && !selfOK){
    if(run.selfUsed>=SELFMARK_MAX) selfNote="Ya has usado las "+SELFMARK_MAX+" autocorrecciones de esta ronda.";
    else selfNote="La autocorrección necesita una respuesta completa, no una palabra suelta.";
  }

  slot.innerHTML=`<div class="fb ${cls}">
    <div class="fb-t">${ok?"✓":(near?"≈":"✕")} ${title}
      ${gained?`<span class="xpgain">+${gained} XP ${mult>1?"("+fmtMult(mult)+")":""}</span>`:""}</div>
    ${ok?"":`<div class="fb-sol"><b>Solución:</b> ${esc(model)}</div>`}
    ${it.why?`<div class="fb-why">${it.why}</div>`:""}
    ${(canSave||selfOK||selfNote)?`<div class="fb-acts">
      ${canSave?`<button class="btn tok small" id="usetok">🎟️ Salvar la racha de ${prevStreak} (1 token)</button>`:""}
      ${selfOK?`<button class="btn ghost small" id="selfok">Mi frase también vale ✓ (${SELFMARK_MAX-run.selfUsed} restante${SELFMARK_MAX-run.selfUsed===1?"":"s"})</button>`:""}
      ${selfNote?`<span class="fb-note">${selfNote}</span>`:""}
    </div>`:""}
  </div>`;

  foot.innerHTML=`<button class="btn" id="next">${run.i+1<run.items.length?"Siguiente →":"Ver resultados →"}</button>
    <span class="spacer"></span>
    ${theoryFor(it.ex.unit,it.ex).length?'<button class="btn ghost small" id="cheat2">📖 Chuleta</button>':""}
    <span class="kbd">Enter</span>`;
  const cheat2=document.getElementById("cheat2"); if(cheat2) cheat2.onclick=e=>{e.stopPropagation();openTheory(it.ex.unit,it.ex);};
  document.getElementById("next").onclick=()=>{
    run.i++;
    if(run.i>=run.items.length) go({name:"done"}); else renderPlay();
  };
  document.getElementById("next").focus();

  const tk=document.getElementById("usetok");
  if(tk) tk.onclick=()=>{
    if(S.tokens<=0) return;
    S.tokens--; S.stats.tokensSpent++; S.stats.saves++;
    run.streak=prevStreak; run.saves++;
    tk.disabled=true; tk.textContent="Racha salvada 🎟️ ("+prevStreak+")";
    save(); syncTop();
    bumpChip(".chip.tok"); bumpChip(".chip.streak"); flyXP("−1 🎟️","tok");
    SFX.play("token");
    reactCard(true);
    toast("Racha restaurada: "+prevStreak+" · multiplicador "+fmtMult(multOf(prevStreak+1)));
  };

  const sb=document.getElementById("selfok");
  if(sb) sb.onclick=()=>{
    sb.disabled=true; sb.textContent="Anotada en el informe ✓";
    run.selfUsed++; run.correct++;
    S.ex[it.id]="self";
    { const arr=(S.answers||{})[it.id]; if(arr&&arr.length) arr[arr.length-1].s=1; }
    S.stats.selfmarks.push({ts:Date.now(),unit:it.ex.unit.short,unitTitle:it.ex.unit.title,
      exN:it.ex.n,exTitle:it.ex.title,q:it.q.replace(/\n/g," "),given:given,model:model});
    run.misses=run.misses.filter(m=>m.it!==it);
    run.xp=(run.xp||0)+addXP(5,1); saveResume(); save(); syncTop();
    toast("Cuenta como acierto, pero queda anotada para que la revise tu profe.");
  };
}

/* =====================================================================
   RESULTADOS
   ===================================================================== */
function renderDone(){
  const total=run.items.length, pct=Math.round(run.correct/total*100);
  const grade=(run.correct/total*10).toFixed(1), m=run.meta;
  S.stats.sessions.push({ts:Date.now(),title:m.title||"Ronda",total,correct:run.correct,
    xp:run.xp||0,pct,best:run.best,self:run.selfUsed,saves:run.saves});
  if(S.stats.sessions.length>60) S.stats.sessions=S.stats.sessions.slice(-60);
  clearResume(roundKey(m));
  save();
  setTimeout(()=>SFX.play(pct>=80?"win":pct>=60?"ok":"meh"),450);  /* tras el sonido de la última respuesta */
  const msg=pct===100?"Pleno. Esto ya lo tienes dominado."
    :pct>=80?"Muy buen control. Solo quedan detalles."
    :pct>=60?"Vas bien: repasa los fallos y vuelve a intentarlo."
    :"Toca repasar la chuleta y volver a la carga. Es normal al principio.";
  app.innerHTML=`
  <div class="playhead"><div class="track"><i style="width:100%"></i></div><span class="qcount">${total} / ${total}</span></div>
  <div class="result">
    <div class="eyebrow">${esc(m.title||"Ronda completada")}</div>
    <div class="score">${m.exam?grade+'<small>/10</small>':run.correct+'<small>/'+total+'</small>'}</div>
    <p class="lede">${msg}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <span class="chip">Aciertos <b>${pct}%</b></span>
      <span class="chip xp">XP <b>+${run.xp||0}</b></span>
      <span class="chip streak">🔥 Mejor racha <b>${run.best}</b></span>
      <span class="chip mult">Máx. <b>${fmtMult(run.bestMult)}</b></span>
      ${run.saves?`<span class="chip tok">🎟️ Salvadas <b>${run.saves}</b></span>`:""}
      ${run.selfUsed?`<span class="chip">Autocorregidas <b>${run.selfUsed}</b></span>`:""}
    </div>
    ${run.misses.length?`
      <div style="width:100%;text-align:left;margin-top:10px">
        <div class="eyebrow" style="margin-bottom:8px">Para repasar (${run.misses.length})</div>
        <div class="misslist">
          ${run.misses.map(x=>`<div class="miss">
            <div style="color:var(--ink-soft)">${esc(x.it.q.split("\n")[0]).slice(0,110)}</div>
            ${x.given?`<div class="yours">${esc(x.given)}</div>`:""}
            <div class="right">${esc(x.model)}</div>
          </div>`).join("")}
        </div>
      </div>`:""}
    <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:8px">
      ${run.misses.length?`<button class="btn" id="retry">Repetir solo los fallos</button>`:""}
      <button class="btn ${run.misses.length?"ghost":""}" id="again">Repetir la ronda</button>
      <button class="btn ghost" id="stats">📊 Estadísticas</button>
      <button class="btn ghost" id="home">Ir al inicio</button>
    </div>
  </div>`;
  document.getElementById("home").onclick=()=>go({name:"home"});
  document.getElementById("stats").onclick=()=>go({name:"stats"});
  document.getElementById("again").onclick=()=>startRun(run.items,Object.assign({},run.meta,{fresh:true}));
  const rt=document.getElementById("retry");
  if(rt) rt.onclick=()=>startRun(run.misses.map(x=>x.it),Object.assign({},run.meta,{title:"Repaso de fallos",key:null}));
}

async function initDownloads(){
  if(dlChecked) return; dlChecked=true;

    const n=document.getElementById("dlnote"); if(n) n.hidden=false;

function csvReport(){
  const rows=[["Fecha","Unidad","Ejercicio","Enunciado","Respuesta del alumno","Respuesta modelo"]];
  S.stats.selfmarks.forEach(r=>rows.push([fecha(r.ts),r.unit+" "+r.unitTitle,"Ej. "+r.exN+" "+r.exTitle,r.q,r.given,r.model]));
  return "﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
}
function sparkline(sessions){
  if(sessions.length<2) return `<p class="empty">Cuando termines un par de rondas verás aquí tu evolución.</p>`;
  const d=sessions.slice(-12), W=Math.max(320,d.length*46), H=96, P=18;
  const x=i=>P+i*((W-P*2)/(d.length-1)), y=v=>H-P-(v/100)*(H-P*2);
  const pts=d.map((s,i)=>[x(i),y(s.pct)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1], lastV=d[d.length-1].pct;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precisión de las últimas rondas">
    <line x1="${P}" y1="${y(50)}" x2="${W-P}" y2="${y(50)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${P}" y="${y(50)-5}" fill="var(--ink-faint)" font-size="10" font-family="IBM Plex Mono, monospace">50%</text>
    <path d="${path}" fill="none" stroke="var(--pen)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}"
        fill="${i===pts.length-1?"var(--pen)":"var(--card)"}" stroke="var(--pen)" stroke-width="2"><title>${esc(d[i].title)} · ${d[i].pct}% · ${fecha(d[i].ts)}</title></circle>`).join("")}
    <text x="${Math.min(last[0]+8,W-30)}" y="${(last[1]-9).toFixed(1)}" fill="var(--ink)" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace">${lastV}%</text>
  </svg>`;
}

          <span class="rung-body">
            <span class="rung-name">${esc(L.name)}${state==="now"?'<span class="rung-tag">tu nivel</span>':""}</span>
            <span class="rung-need">${need}</span>
            ${state==="now"&&nxt?`<span class="rung-bar"><i style="width:${Math.round(into/span*100)}%"></i></span>
              <span class="rung-left">${into} / ${span} XP · faltan <b>${nxt.xp-S.xp}</b> para ${esc(nxt.name)}</span>`
              :state==="now"?`<span class="rung-left">¡Has llegado al último nivel!</span>`:""}
          </span>
          <span class="rung-xp"><b>${L.xp}</b><small>XP en total</small></span>
        </div>`;
      }).join("")}
    </div>
  </div>

  <div class="panel">
    <h3>Racha y multiplicador de XP</h3>
    <p class="sub">Cada acierto encadenado sube el multiplicador <b>0,1</b>, desde <b>×1.0</b> hasta el tope de <b>×2.0</b> a los 11 aciertos seguidos. Un fallo lo devuelve a ×1.0, salvo que gastes un token 🎟️ para salvar la racha. Marcado en verde, hasta dónde has llegado.</p>
    <div class="scale">
      ${Array.from({length:11},(_,k)=>{
        const r=k+1, m=multOf(r===1?1:r), on=st.bestStreak>=r;
        return `<div class="step ${on?(r===11?"top":"on"):""}"><div class="m">${fmtMult(m)}</div><div class="r">racha ${r}${r===11?"+":""}</div></div>`;
      }).join("")}
    </div>
  </div>

  <div class="panel">
    <h3>Preguntas dominadas por unidad</h3>
    <p class="sub">Porcentaje de preguntas acertadas al menos una vez. Pasa el ratón por encima para ver el detalle.</p>
    <div class="bars">
      ${unitRows.map(r=>`<div class="barrow" title="${esc(r.u.title)}: ${r.ok} de ${r.items.length}">
        <span class="nm">${r.u.short} · ${esc(r.u.title)}</span>
        <span class="bartrack"><span class="barfill" style="width:${Math.max(1,r.pct/maxPct*100)}%"></span></span>
        <span class="vv">${r.pct}%</span>
      </div>`).join("")}

  </div>

  <div class="panel">
    <h3>Evolución de las últimas rondas</h3>
    <p class="sub">Porcentaje de aciertos de cada ronda terminada, de la más antigua a la más reciente.</p>
    ${sparkline(st.sessions)}
    ${st.sessions.length?`<div class="tablewrap" style="margin-top:14px"><table class="rep">
      <thead><tr><th>Fecha</th><th>Ronda</th><th>Resultado</th><th>XP</th></tr></thead>
      <tbody>${st.sessions.slice(-8).reverse().map(s=>`<tr>
        <td class="mono">${fecha(s.ts)}</td><td>${esc(s.title)}</td>
        <td class="mono">${s.correct}/${s.total} · ${s.pct}%</td><td class="mono">+${s.xp}</td></tr>`).join("")}</tbody></table></div>`:""}
  </div>

  <div class="panel">
    <h3>Informe de autocorrecciones</h3>
    <p class="sub">Frases que el alumno dio por válidas con el botón «Mi frase también vale». Máximo ${SELFMARK_MAX} por ronda. Conviene revisarlas una a una.</p>
    ${selfN?`
      <div class="tablewrap"><table class="rep">
        <thead><tr><th>Fecha</th><th>Unidad</th><th>Enunciado</th><th>Respuesta del alumno / modelo</th></tr></thead>
        <tbody>${st.selfmarks.slice().reverse().map(r=>`<tr>
          <td class="mono">${fecha(r.ts)}</td>
          <td class="mono">${r.unit} · Ej. ${r.exN}</td>
          <td>${esc(r.q).slice(0,120)}</td>
          <td><span class="yours">${esc(r.given)}</span><br><span class="right">${esc(r.model)}</span></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
        <button class="btn" id="dlbtn">⬇ Descargar informe (CSV)</button>
        <button class="btn ghost" id="copybtn">Copiar al portapapeles</button>
        <button class="btn ghost" id="clearself">Vaciar informe</button>
      </div>
      <p class="fb-note" id="dlnote" hidden style="margin-top:10px;display:block;line-height:1.5">Con el enlace compartido en público, el navegador no deja que la página guarde archivos. Pulsa <b>Copiar al portapapeles</b> y pega el contenido en Excel o Google Sheets: se abre en columnas.</p>`
    :`<p class="empty">Todavía no se ha usado ninguna autocorrección. Aquí aparecerán con fecha, enunciado, la respuesta del alumno y la respuesta modelo.</p>`}
  </div>

  <div class="panel">
    <h3>Empezar de cero</h3>
    <p class="sub">Borra progreso, XP, tokens y estadísticas de este navegador. No se puede deshacer.</p>
    <button class="btn ghost" id="reset">Reiniciar todo el progreso</button>
  </div>`;

  document.getElementById("back").onclick=()=>go({name:"home"});
  const dl=document.getElementById("dlbtn");
  if(dl){
    initDownloads();
    dl.onclick=async()=>{
      await initDownloads();
      if(!DL){ toast("La descarga no está disponible aquí: usa «Copiar al portapapeles»."); return; }
      try{
        await DL.save({filename:"informe-autocorrecciones.csv",data:csvReport()});
        toast("Informe guardado.");
      }catch(err){
        toast(err&&err.code==="declined"?"Descarga cancelada.":"No se ha podido guardar el informe.");
      }
    };
  }
  const cp=document.getElementById("copybtn");
  if(cp) cp.onclick=async()=>{
    try{ await navigator.clipboard.writeText(csvReport()); toast("Informe copiado."); }
    catch(e){ toast("Tu navegador no permite copiar aquí."); }
  };
  const cs=document.getElementById("clearself");
  if(cs) cs.onclick=()=>{ if(confirm("¿Vaciar el informe de autocorrecciones?")){ S.stats.selfmarks=[]; save(); renderStats(); } };
  document.getElementById("reset").onclick=()=>{
    if(confirm("¿Seguro? Se borrará todo el progreso guardado en este navegador.")){

}

<script type="module">
/* =====================================================================
   SINCRONIZACIÓN — Firestore
   El progreso sigue guardándose en el navegador (funciona sin conexión);
   esta capa lo sube a la nube y lo baja al entrar desde otro dispositivo.
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPZ54PzHWwb78e4u0lA_dgxTsPt3-aaxU",
  authDomain: "ingles-web-alumnos.firebaseapp.com",
  projectId: "ingles-web-alumnos",
  storageBucket: "ingles-web-alumnos.firebasestorage.app",
  messagingSenderId: "852909277881",
  appId: "1:852909277881:web:26e9a85c23b1526ab89168"
};
const CLASE = "5c96aa91a9d5";

try{
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const auth = getAuth(app);
  const ref = id => doc(db, "clases", CLASE, "progreso", id);
  window.CLOUD = {
    async load(id){ const s = await getDoc(ref(id)); return s.exists() ? s.data() : null; },
    async save(id, data){ await setDoc(ref(id), data); },
    async login(email, pass){ const c = await signInWithEmailAndPassword(auth, email, pass); return c.user.email; },
    async logout(){ await signOut(auth); },
    email(){ return auth.currentUser ? auth.currentUser.email : null; }
  };
  window.dispatchEvent(new Event("cloud-ready"));
  /* La sesión se recuerda en el dispositivo (persistencia local por defecto).
     Al arrancar, Firebase avisa una vez de si ya había alguien dentro. */
  let first = true;
  onAuthStateChanged(auth, user => {
    window.dispatchEvent(new CustomEvent("auth-state", { detail: { email: user ? user.email : null, first } }));
    first = false;
  });
}catch(e){
  console.warn("Sin sincronización:", e && e.message);
}
</script>
