{
 id:"m1", short:"U1", owner:"marcos", num:"Unidad 1", title:"All Fun and Games", icon:"🎮",
 desc:"Módulo 1 del libro: vocabulario de música y baile, videojuegos y ocio; present perfect continuous, present perfect simple frente a continuous, formación de palabras, conectores y comprensión lectora.",
 gram:["Present perfect continuous","Present perfect simple vs continuous","Formación de palabras"],
 lex:["Música y baile","Videojuegos","Ocio y conectores"],
 theory:[
  {h:"Present perfect continuous: la forma", dl:[
    ["Afirmativa","<code>have/has + been + verbo-ing</code> · <i>Claire has been singing for two years.</i>"],
    ["Negativa","<code>haven't / hasn't + been + -ing</code> · <i>We haven't been waiting for long.</i>"],
    ["Pregunta","<code>Have/Has + sujeto + been + -ing?</code> · <i>Have you been rehearsing lately?</i>"],
    ["Con wh-","<i>How long have they been playing? · What has John been doing all day?</i>"]
  ]},
  {h:"Present perfect continuous: cuándo se usa", p:"Para una acción que <b>empezó en el pasado y sigue ahora</b>, o que <b>acaba de terminar</b> y se nota el resultado: <i>I've been practising all day (y estoy agotado)</i>. Señales: <i>for, since, all day, lately, recently, how long</i>.<br><b>For</b> + periodo (<i>for two years</i>) · <b>since</b> + momento en que empezó (<i>since Monday</i>)."},
  {h:"Present perfect simple o continuous", p:"<b>Simple</b>: acción terminada y relevante ahora, o <b>cuántas</b> cosas se han hecho (<i>I've just gone up a level · How many games have you played?</i>). Va con <i>just, already, yet, ever, never</i>.<br><b>Continuous</b>: se destaca la <b>duración</b> o el proceso (<i>They've been developing this game for years</i>) y las preguntas con <i>how long</i>."},
  {h:"Verbos que no van en continuous", p:"Los verbos de estado (<i>want, need, like, love, understand, hear, see, know</i>) no suelen usarse en continuous: <i>I've known her since primary school</i>, nunca <i>I've been knowing</i>."},
  {h:"Si dices cuándo: pasado simple", p:"Con un momento concreto y terminado (<i>yesterday, last week, in 2020</i>) se usa <b>past simple</b>: <i>I practised the song yesterday</i>, no <i>I've been practising … yesterday</i>."},
  {h:"Formación de palabras", dl:[
    ["-ment","achieve → achieve<b>ment</b> · improve → improve<b>ment</b> · move → move<b>ment</b>"],
    ["-ance / -ence","appear → appear<b>ance</b> · differ → differ<b>ence</b> · attend → attend<b>ance</b>"],
    ["-ion","collect → collect<b>ion</b> · discuss → discuss<b>ion</b> · invent → invent<b>ion</b>"],
    ["-ity / -ty","active → activ<b>ity</b> · safe → safe<b>ty</b> · certain → certain<b>ty</b>"],
    ["-er / -or","teach → teach<b>er</b> · act → act<b>or</b> · visit → visit<b>or</b>"],
    ["-ive / -ous / -able","attract → attract<b>ive</b> · nerve → nerv<b>ous</b> · comfort → comfort<b>able</b>"],
    ["un- / im-","<b>un</b>usual · <b>un</b>fair · <b>im</b>patient · <b>im</b>polite"]
  ]},

  {n:1, lvl:1, no:1, vocab:1, title:"Música y baile: vocabulario en contexto", instr:"Elige la opción que completa mejor la frase.", items:[

   {t:"choice", gloss:{"take": "encajar, aguantar"}, q:"He doesn't take ___ well: every negative comment about his songs makes him furious.", opts:["criticism", "enjoyment", "location", "atmosphere"], a:[0], why:"<b>take criticism</b> = encajar las críticas."},
   {t:"choice", gloss:{"moves": "movimientos"}, q:"She was ___ her new dance moves to anyone who would watch, even though nobody had asked.", opts:["showing off","starring in","cheering on","waving at"], a:[0], why:"<b>show off</b> = presumir, lucirse. <i>Star in</i> se usa para películas y obras de teatro."},
   {t:"choice", gloss:{"get": ""}, q:"I get the ___ that tonight's concert is going to be something special.", opts:["feeling","rhythm","moves","mind"], a:[0], why:"<b>get the feeling (that)</b> = tener la sensación de que."},
   {t:"choice", q:"Although the costume looked ___ at first, it soon became a trend among teenagers.", opts:["weird","eager","fond","proud"], a:[0], why:"<b>weird</b> = raro. <i>Eager</i> y <i>proud</i> van seguidos de <i>to</i> / <i>of</i> y se dicen de personas."},
   {t:"choice", q:"The semi-final will be shown as a live ___ on national television.", opts:["broadcast","venue","criticism","rhythm"], a:[0], why:"<b>broadcast</b> = retransmisión, emisión."},
   {t:"choice", q:"Thousands of fans were ___ their arms in the air and singing along to every song.", opts:["waving","rehearsing","starring","broadcasting"], a:[0], why:"<b>wave</b> = agitar. <i>Waving their arms</i> = moviendo los brazos."},
   {t:"choice", gloss:{"early": "pronto, con antelación"}, q:"Clara was so ___ to meet her idol that she arrived at the venue five hours early.", opts:["eager","fond","weird","tired"], a:[0], why:"<b>eager to + verbo</b> = con muchas ganas de. <i>Fond</i> necesita <i>of</i>."},
   {t:"choice", q:"Their new single has a catchy ___ that makes everyone want to dance.", opts:["rhythm","venue","criticism","broadcast"], a:[0], why:"<b>rhythm</b> = ritmo."}
  ]},

  {n:2, lvl:1, no:2, vocab:1, title:"Música y baile: completa el texto", instr:"Completa cada texto con las palabras del banco. Sobra una.",
   bank:["venue","rehearsed","cheered","criticism","fond of","dance moves","show off","eager","weird","rhythm","broadcast"], items:[
   {t:"fill", gloss:{"had":""}, q:"Last Saturday my band played at a small ___ in our town. We had ___ every afternoon for a month, so we felt confident. The audience ___ after every song and, honestly, I was surprised: I had been expecting some ___.", a:[["venue"],["rehearsed"],["cheered"],["criticism"]], why:"<b>venue</b> (lugar del concierto) · <b>rehearsed</b> (<i>had rehearsed</i>) · <b>cheered</b> (vitoreó) · <b>criticism</b> (críticas)."},
   {t:"fill", q:"My little sister is really ___ hip-hop. She learns every one of the new ___ from online videos, and she loves to ___ in front of the whole family.", a:[["fond of"],["dance moves"],["show off"]], why:"<b>fond of</b> + nombre · <b>dance moves</b> = pasos de baile · <b>show off</b> = presumir."},
   {t:"fill", gloss:{"break": "descanso, pausa", "ends": "acaba (end up = acabar haciendo algo)"}, q:"The lead singer is ___ to perform again after a long break. At first the new song sounds ___, but the ___ is so catchy that the whole crowd ends up dancing.", a:[["eager"],["weird"],["rhythm"]], why:"<b>eager to</b> = con ganas de · <b>weird</b> = raro · <b>rhythm</b> = ritmo."}
  ]},

  {n:3, lvl:1, no:3, vocab:1, title:"Videojuegos: de la definición a la palabra", instr:"Escribe la palabra o expresión que corresponde a la definición en inglés.", items:[
   {t:"fill", q:"The graphics are so good that you quickly become ___ in the game's world.", hint:"completely absorbed in something", a:[["immersed"]], why:"<b>immersed</b> = sumergido, totalmente metido en algo."},
   {t:"fill", gloss:{"has":"", "keep": "seguir el ritmo (keep up with)"}, q:"Shops can't keep up with demand: the new console has ___ everywhere.", hint:"no copies are left", a:[["sold out"]], why:"<b>sell out</b> = agotarse. Aquí <i>has sold out</i>."},
   {t:"fill", q:"Learning the whole song in one afternoon was an incredible ___.", hint:"an impressive achievement", a:[["feat"]], why:"<b>feat</b> = hazaña."},
   {t:"fill", q:"Developers use ___ graphics to make the colours look bright and intense.", hint:"bright and intense", a:[["vivid"]], why:"<b>vivid</b> = vivo, intenso."},
   {t:"fill", q:"Do you think you can ___ that level without losing a single life?", hint:"succeed in doing something difficult", a:[["pull off"]], why:"<b>pull off</b> = conseguir algo difícil."},
   {t:"fill", gloss:{"opening": "inicial, de apertura"}, q:"In the opening scene, the hero ___ on a long journey to rescue his friends.", hint:"starts a journey", a:[["sets off"]], why:"<b>set off</b> = ponerse en marcha. Con <i>the hero</i>: <i>sets off</i>."},
   {t:"fill", gloss:{"like": "como, parecido a"}, q:"I can't ___ the characters in that game; their problems are nothing like mine.", hint:"identify with", a:[["relate to"]], why:"<b>relate to</b> = identificarse con."},
   {t:"fill", q:"Whether you win or lose, the real ___ comes from playing with friends.", hint:"the pleasure you get from something", a:[["enjoyment"]], why:"<b>enjoyment</b> = disfrute (nombre)."},
   {t:"fill", q:"The final boss was so ___ that nobody could explain what it was supposed to be.", hint:"very strange", a:[["bizarre"]], why:"<b>bizarre</b> = extraño, raro."},
   {t:"fill", gloss:{"coaches": "entrenadores"}, q:"Good coaches ___ their players' progress to see who needs extra training.", hint:"follow closely", a:[["keep track of"]], why:"<b>keep track of</b> = seguir la pista de."}
  ]},

  {n:4, lvl:1, no:4, title:"Formación de palabras", instr:"Escribe la forma correcta de la palabra entre paréntesis.", items:[
   {t:"fill", q:"Her ___ in the main role was praised by every critic.", hint:"perform", a:[["performance"]], why:"perform → perform<b>ance</b>."},
   {t:"fill", gloss:{"getting": "recibir"}, q:"Getting so much ___ from the fans made him more confident.", hint:"encourage", a:[["encouragement"]], why:"encourage → encourage<b>ment</b>."},
   {t:"fill", gloss:{"sold": "agotarse (sell out)"}, q:"The concert was a huge ___: every ticket sold out in minutes.", hint:"succeed", a:[["success"]], why:"succeed → <b>success</b> (cambia la raíz)."},
   {t:"fill", gloss:{"forms": "formas, tipos"}, q:"Online games have become one of the most popular forms of ___.", hint:"entertain", a:[["entertainment"]], why:"entertain → entertain<b>ment</b>."},
   {t:"fill", q:"The painting was the ___ for his new song.", hint:"inspire", a:[["inspiration"]], why:"inspire → inspir<b>ation</b>."},
   {t:"fill", q:"The ___ of this game has grown quickly: it now has ten million players.", hint:"popular", a:[["popularity"]], why:"popular → popular<b>ity</b>."},
   {t:"fill", q:"The main ___ of the game is that the levels are extremely long.", hint:"difficult", a:[["difficulty"]], why:"difficult → difficul<b>ty</b>."},
   {t:"fill", q:"It is ___ to hear the singer over all that noise.", hint:"possible", a:[["impossible"]], why:"possible → <b>im</b>possible."},
   {t:"fill", q:"She is a very ___ dancer: her moves are always original.", hint:"create", a:[["creative"]], why:"create → creat<b>ive</b>."},
   {t:"fill", gloss:{"beginning": "principio", "end": "final"}, q:"The film was so ___ that we laughed from beginning to end.", hint:"enjoy", a:[["enjoyable"]], why:"enjoy → enjoy<b>able</b>."}
  ]},

  {n:5, lvl:1, no:5, nogloss:1, title:"Present perfect: completa el texto", instr:"Completa con los verbos entre paréntesis en present perfect simple o continuous.", items:[
   {t:"fill", q:"I ___ (learn) the drums for about a year now. I ___ (already / join) a band, and we ___ (rehearse) every Friday since January.", a:[["{have|'ve} been learning"],["{have|'ve} already joined"],["{have|'ve} been rehearsing"]], why:"<i>For about a year</i> → <b>have been learning</b> · <i>already</i> + acción hecha → <b>have already joined</b> · <i>since January</i> → <b>have been rehearsing</b>."},
   {t:"fill", q:"Mia ___ (study) for the exam all afternoon, so she's exhausted. She ___ (not / finish) the last chapter yet, but she ___ (read) three others already.", a:[["{has|'s} been studying"],["{hasn't|has not} finished"],["{has|'s} read"]], why:"<i>All afternoon</i> + cansancio → <b>has been studying</b> · <i>yet</i> → <b>hasn't finished</b> · cantidad (<i>three</i>) → <b>has read</b>."},
   {t:"fill", q:"Developers ___ (work) on this game for five years. They ___ (release) two updates this month, and players ___ (complain) about the bugs ever since.", a:[["{have|'ve} been working"],["{have|'ve} released"],["{have|'ve} been complaining"]], why:"<i>For five years</i> → <b>have been working</b> · <i>two updates this month</i> → <b>have released</b> · <i>ever since</i> → <b>have been complaining</b>."},
   {t:"fill", q:"A: How long ___ you ___ (wait) here?\nB: About two hours. The doors ___ (not / open) yet, and the queue ___ (get) longer all morning.", a:[["have"],["been waiting"],["{haven't|have not} opened"],["{has|'s} been getting"]], why:"<b>How long have you been waiting</b>? · <i>yet</i> → <b>haven't opened</b> · <i>all morning</i> → <b>has been getting</b>."}
  ]},

  {n:6, lvl:1, no:6, nogloss:1, title:"Encuentra el error y corrígelo", instr:"Cada frase tiene un error de tiempo verbal o de uso. Escribe la frase corregida.", items:[
   {t:"write", q:"We've been seeing that film three times already.", a:["we{ have|'ve} seen that film three times already"], why:"Con una cantidad (<i>three times</i>) se usa el <b>present perfect simple</b>: <i>We've seen</i>."},
   {t:"write", q:"She has been playing the guitar yesterday afternoon.", a:["she {played|was playing} the guitar yesterday afternoon"], why:"<i>Yesterday afternoon</i> es un momento concreto y terminado → <b>past simple</b>."},
   {t:"write", q:"I've been wanting to see this band for years.", a:["i{ have|'ve} wanted to see this band for years"], why:"<i>Want</i> es un verbo de estado: no suele ir en continuous → <b>I've wanted</b>."},
   {t:"write", q:"The singer hasn't been rehearsing since three hours.", a:["the singer {hasn't|has not} been rehearsing for three hours"], why:"<b>For</b> + periodo (<i>three hours</i>); <b>since</b> + momento en que empezó."},
   {t:"write", q:"How many songs has the band been recording this year?", a:["how many songs has the band recorded this year"], why:"<i>How many</i> (cantidad) → <b>present perfect simple</b>."},
   {t:"write", q:"They have been just finishing their new album.", a:["they{ have|'ve} just finished their new album"], why:"<i>Just</i> + acción terminada → <b>present perfect simple</b>."},
   {t:"write", q:"My brother is playing video games since he got home.", a:["my brother{ has|'s} been playing video games since he got home"], why:"<i>Since</i> + algo que continúa → <b>has been playing</b>, no presente simple/continuous."},
   {t:"write", q:"Have you been ever to a music festival?", a:["have you ever been to a music festival"], why:"<i>Ever</i> va entre <i>have</i> y el participio: <b>Have you ever been…?</b>"}
  ]},

  {n:7, lvl:1, no:7, nogloss:1, title:"Reescribe con la palabra clave", instr:"Reescribe la frase para que signifique lo mismo. Usa la palabra entre paréntesis.", items:[
   {t:"write", q:"I started playing the piano three years ago and I still play it. (for)", a:["i{ have|'ve} been playing the piano for three years","i{ have|'ve} played the piano for three years"], why:"<b>for three years</b> + acción que continúa: <i>I've been playing…</i>"},
   {t:"write", q:"The last time we went to a concert was in June. (since)", a:["we {haven't|have not} {been|gone} to a concert since june"], why:"<b>We haven't been to a concert since June.</b>"},
   {t:"write", q:"When did you start working on this project? (How long)", a:["how long have you been working on this project"], why:"La duración se pregunta con <b>How long have you been + -ing</b>."},
   {t:"write", q:"It's the first time he has performed on stage. (never)", a:["he{ has|'s} never performed on stage[ before]"], why:"<b>He has never performed on stage (before).</b>"},
   {t:"write", q:"They began rehearsing at nine and they are still rehearsing. (since)", a:["they{ have|'ve} been rehearsing since nine[ o'clock]"], why:"<b>since nine</b> = desde las nueve → present perfect continuous."},
   {t:"write", q:"My phone broke two weeks ago and it still doesn't work. (for)", a:["my phone {hasn't|has not} {been working|worked} for two weeks"], why:"<b>My phone hasn't been working for two weeks.</b>"},
   {t:"write", q:"I got to the venue at six and I'm still waiting. (since)", a:["i{ have|'ve} been waiting [at the venue ]since six[ o'clock]"], why:"<b>I've been waiting since six.</b>"},
   {t:"write", q:"Lucy is tired because she danced for three hours. (been)", a:["lucy is tired because she{ has|'s} been dancing for three hours"], why:"Resultado visible + duración → <b>she has been dancing</b>."}
  ]},

  {n:8, lvl:1, no:8, vocab:1, nogloss:1, title:"Ocio, conectores y diálogo", instr:"Completa cada texto con las palabras o expresiones indicadas.", items:[
   {t:"fill", q:"We queued for almost two hours to get into the amusement park. ___ we reached the entrance, and ___ we were inside, we ran to the roller coaster. ___ the day we went on every ride, and ___, I've been a roller coaster fan.", hint:"eventually · as soon as · in the course of · ever since then", a:[["eventually"],["as soon as"],["in the course of"],["ever since then"]], why:"<b>eventually</b> (al final) · <b>as soon as</b> (en cuanto) · <b>in the course of</b> (a lo largo de) · <b>ever since then</b> (desde entonces)."},
   {t:"fill", q:"Last summer I visited a huge amusement park. The ___ was a giant roller coaster that goes ___ speed and even turns you upside ___. If you prefer something calmer, you can ride the big ___ and enjoy the view.", hint:"main attraction · at full · down · wheel", a:[["main attraction"],["at full"],["down"],["wheel"]], why:"<b>main attraction</b> · <b>at full speed</b> (a toda velocidad) · <b>upside down</b> (boca abajo) · <b>big wheel</b> (noria)."},
   {t:"fill", q:"A: What ___ lately?\nB: I've been learning to skateboard.\nA: ___ been interested in skateboarding?\nB: Since last summer. It's become ___ at my school.\nA: Really? I ___ myself falling off a board!\nB: ___ try it with me on Saturday?", hint:"have you been up to · since when have you · quite trendy · can't imagine · why don't you", a:[["have you been up to"],["since when have you"],["quite trendy"],["{can't|cannot} imagine"],["why don't you"]], why:"<b>What have you been up to?</b> · <b>Since when have you been…?</b> · <b>quite trendy</b> (bastante de moda) · <b>I can't imagine myself…</b> · <b>Why don't you…?</b> (sugerencia)."}
  ]},

  {n:9, lvl:1, no:9, title:"Mini-lecturas", instr:"Lee el texto y elige la mejor respuesta.", items:[
   {t:"choice", gloss:{"light": "iluminarse (light up)"}, q:"Silent discos are becoming popular at festivals. Instead of loud speakers, everyone wears wireless headphones and chooses between several music channels. The headphones light up in different colours, so you can see who is listening to the same music as you. The neighbours are happy too, because the party makes no noise.\n\nWhy do the headphones light up in different colours?", opts:["To show which channel each person is listening to", "To make the party look more colourful for everyone", "To stop the neighbours from complaining about noise", "To help people find the venue in the dark"], a:[0], why:"El texto dice que las luces permiten <b>ver quién escucha la misma música</b>, es decir, el mismo canal."},
   {t:"choice", gloss:{"give": "rendirse (give up)", "keep": "seguir, continuar (keep + -ing)"}, q:"When Jonas started learning the violin, he was a terrible player and wanted to give up after a month. His teacher told him to record himself every week. Hearing his progress motivated him so much that he has been practising every day ever since. Now he plays in the school orchestra.\n\nWhat made Jonas keep practising?", opts:["Listening to recordings that showed his progress", "Winning an important competition at school", "Being accepted into the school orchestra", "Receiving harsh criticism from his parents at home"], a:[0], why:"<i>Hearing his progress motivated him</i>: oír su mejora en las grabaciones le motivó."},
   {t:"choice", q:"Retro games are back. Although modern consoles offer realistic graphics, many players say older games are more fun because they are simpler and you can learn the rules in minutes. Some developers have even been remaking classic titles with updated graphics, hoping to attract both new and nostalgic players.\n\nWhat does the writer say about retro games?", opts:["They are popular partly because they are easy to learn", "They have much better graphics than modern games", "They are impossible to find in shops nowadays", "Developers refuse to remake them with new graphics"], a:[0], why:"El texto dice que son más divertidos porque son <b>más simples y se aprenden en minutos</b>."},
   {t:"choice", gloss:{"cast": "reparto (los actores)", "sold": "agotarse (sell out)"}, q:"The theatre in our town has been showing a musical every summer since 1998. This year's production is the most ambitious yet: the cast has been rehearsing since March and the set is built entirely by local students. Tickets have sold out for every performance, so the organisers are planning extra shows.\n\nWhat can we infer from the text?", opts:["The musical is very popular this year","The cast has only just started rehearsing","Professional builders made the set","The theatre has never shown a musical before"], a:[0], why:"Las entradas se han agotado en todas las funciones y se planean más: <b>el musical tiene mucho éxito</b>."}
  ]},

  /* ------------------------------ NIVEL 2 ------------------------------ */
  {n:10, lvl:2, no:1, vocab:1, title:"Música y baile: vocabulario en contexto", instr:"Elige la opción que completa mejor la frase.", items:[
   {t:"choice", q:"The festival has moved to a bigger ___ because so many people wanted tickets.", opts:["venue","rhythm","criticism","broadcast"], a:[0], why:"<b>venue</b> = lugar donde se celebra el evento."},
   {t:"choice", q:"Fans who couldn't attend watched the whole show as a live ___ online.", opts:["broadcast", "location", "feeling", "criticism"], a:[0], why:"<b>broadcast</b> = retransmisión."},
   {t:"choice", gloss:{"break": "separarse (break up)"}, q:"He has the ___ that the band is about to break up, though nobody has said anything.", opts:["feeling","mind","moves","appeal"], a:[0], why:"<b>have/get the feeling that</b> = tener la sensación de que."},
   {t:"choice", q:"Don't ___ in front of your friends; just enjoy the dance.", opts:["show off","star in","cheer for","broadcast"], a:[0], why:"<b>show off</b> = presumir, lucirse."},
   {t:"choice", q:"The audience started ___ loudly as soon as the band played its biggest hit.", opts:["cheering","rehearsing","starring","broadcasting"], a:[0], why:"<b>cheer</b> = vitorear, animar."},
   {t:"choice", q:"My grandfather is very ___ old jazz records; he has hundreds of them.", opts:["fond of","eager to","proud to","likely to"], a:[0], why:"<b>fond of + nombre</b> = aficionado a. <i>Eager/proud/likely</i> + <i>to</i> + verbo."},
   {t:"choice", q:"I was going to buy the tickets, but then I changed my ___.", opts:["mind","feeling","moves","venue"], a:[0], why:"<b>change your mind</b> = cambiar de opinión."},
   {t:"choice", q:"The drummer is brilliant: he never loses the ___, even in the fastest songs.", opts:["rhythm","venue","broadcast","criticism"], a:[0], why:"<b>rhythm</b> = ritmo."},
   {t:"choice", q:"That outfit looks a bit ___, but it suits you.", opts:["weird","eager","fond","ready"], a:[0], why:"<b>weird</b> = raro, extraño."}
  ]},

  {n:11, lvl:2, no:2, vocab:1, title:"Música y baile: completa el texto", instr:"Completa cada texto con las palabras del banco. Sobra una.",
   bank:["star in","rehearsed","try hard","wireless speakers","get the feeling","changed my mind","broadcast","dance moves","eager","criticism"], items:[
   {t:"fill", gloss:{"end": "final (in the end = al final)"}, q:"I wanted to ___ the school musical, so I ___ every day after class. In the end I didn't get the main role, but my teacher said that if I ___, I'll get a bigger part next year.", a:[["star in"],["rehearsed"],["try hard"]], why:"<b>star in</b> = protagonizar · <b>rehearsed</b> = ensayé · <b>try hard</b> = esforzarse."},
   {t:"fill", q:"My parents gave me new ___ for my birthday, and the sound is incredible. I ___ that the neighbours are enjoying it too, although they have never said a word. Yesterday I was going to stay in, but I ___ and went to a concert instead.", a:[["wireless speakers"],["get the feeling"],["changed my mind"]], why:"<b>wireless speakers</b> · <b>get the feeling that</b> · <b>changed my mind</b> (cambié de opinión)."},
   {t:"fill", q:"The final of the dance contest was a live ___ watched by millions. The winner learned every one of her ___ from online videos, and she was so ___ to win that she cried when they announced it.", a:[["broadcast"],["dance moves"],["eager"]], why:"<b>broadcast</b> = retransmisión · <b>dance moves</b> = pasos de baile · <b>eager to</b> = con muchas ganas de."}
  ]},

  {n:12, lvl:2, no:3, vocab:1, title:"Videojuegos: de la definición a la palabra", instr:"Escribe la palabra o expresión que corresponde a la definición en inglés.", items:[
   {t:"fill", q:"A game with a good plot and strong characters keeps players ___ for hours.", hint:"interested and involved", a:[["engaged"]], why:"<b>engaged</b> = enganchado, implicado."},
   {t:"fill", q:"The sequel ___ in just two days, which surprised even the developers.", hint:"all copies were bought", a:[["sold out"]], why:"<b>sell out</b> = agotarse. En pasado: <i>sold out</i>."},

   {t:"fill", q:"What I like most are the great ___ of this game: the soundtrack, the graphics and the story.", hint:"important parts or characteristics", a:[["features"]], why:"<b>features</b> = características."},
   {t:"fill", q:"The game's success ___ its realistic graphics.", hint:"is determined by", a:[["depends on"]], why:"<b>depend on</b> = depender de. Con <i>success</i>: <i>depends on</i>."},
   {t:"fill", q:"The story was so ___ that I couldn't follow it: a talking sandwich ruled the galaxy.", hint:"very strange", a:[["bizarre"]], why:"<b>bizarre</b> = extraño, raro."},

   {t:"fill", q:"He ___ the final level without losing a single life.", hint:"succeeded in doing something difficult", a:[["pulled off"]], why:"<b>pull off</b> = conseguir algo difícil. En pasado: <i>pulled off</i>."}
  ]},

  {n:13, lvl:2, no:4, title:"Formación de palabras", instr:"Escribe la forma correcta de la palabra entre paréntesis.", items:[

   {t:"fill", q:"The ___ of the festival announced three extra concerts.", hint:"organise", a:[["organiser","organizer"]], why:"organise → organis<b>er</b>."},
   {t:"fill", q:"He became ___ overnight after a viral video.", hint:"fame", a:[["famous"]], why:"fame → fam<b>ous</b>."},
   {t:"fill", gloss:{"busy": "concurrido, con mucho tráfico"}, q:"Playing on a busy road is ___.", hint:"danger", a:[["dangerous"]], why:"danger → danger<b>ous</b>."},
   {t:"fill", gloss:{"ending": "final"}, q:"Many fans were ___ with the ending of the game.", hint:"happy", a:[["unhappy"]], why:"happy → <b>un</b>happy."}
  ]},

  {n:14, lvl:2, no:5, nogloss:1, title:"Present perfect: completa el texto", instr:"Completa con los verbos entre paréntesis en present perfect simple o continuous.", items:[
   {t:"fill", q:"My brother ___ (play) the same video game all day, and he ___ (not / stop) for lunch yet. He ___ (already / reach) level 50.", a:[["{has|'s} been playing"],["{hasn't|has not} stopped"],["{has|'s} already reached"]], why:"<i>All day</i> → <b>has been playing</b> · <i>yet</i> → <b>hasn't stopped</b> · <i>already</i> + logro → <b>has already reached</b>."},
   {t:"fill", q:"Scientists ___ (study) teenagers' gaming habits for a decade. A recent survey ___ (find) that 70% of them play online, and many experts ___ (warn) about the risks ever since.", a:[["{have|'ve} been studying"],["{has|'s} found"],["{have|'ve} been warning"]], why:"<i>For a decade</i> → <b>have been studying</b> · una encuesta reciente → <b>has found</b> · <i>ever since</i> → <b>have been warning</b>."},
   {t:"fill", q:"Our school choir ___ (rehearse) since September. We ___ (already / learn) six songs, but we ___ (not / decide) which one to open the show with.", a:[["{has|have} been rehearsing"],["{have|'ve} already {learned|learnt}"],["{haven't|have not} decided"]], why:"<i>Since September</i> → <b>has been rehearsing</b> · <i>already</i> + cantidad → <b>have already learnt</b> · todavía sin decidir → <b>haven't decided</b>."},
   {t:"fill", q:"A: What ___ you ___ (do) lately?\nB: I ___ (look) for a new hobby, and I ___ (fall) off a skateboard five times so far!", a:[["have"],["been doing"],["{have|'ve} been looking"],["{have|'ve} fallen"]], why:"<b>What have you been doing lately?</b> · <b>I've been looking</b> (proceso) · <b>I've fallen</b> (cantidad: <i>five times</i>)."}
  ]},

  {n:15, lvl:2, no:6, nogloss:1, title:"Encuentra el error y corrígelo", instr:"Cada frase tiene un error de tiempo verbal o de uso. Escribe la frase corregida.", items:[
   {t:"write", q:"I've been knowing her since primary school.", a:["i{ have|'ve} known her since primary school"], why:"<i>Know</i> es un verbo de estado: no va en continuous → <b>I've known</b>."},
   {t:"write", q:"How long do you play the guitar?", a:["how long {have you been playing|have you played} the guitar"], why:"La duración se pregunta con el present perfect: <b>How long have you been playing…?</b>"},
   {t:"write", q:"The band has been releasing five albums so far.", a:["the band has released five albums so far"], why:"Cantidad (<i>five albums</i>) → <b>present perfect simple</b>."},
   {t:"write", q:"We've been waiting for the bus since an hour.", a:["we{ have|'ve} been waiting for the bus for an hour"], why:"<b>For</b> + periodo (<i>an hour</i>); <b>since</b> + momento de inicio."},
   {t:"write", q:"I have been finishing my homework, so now I can play.", a:["i{ have|'ve} finished my homework so now i can play"], why:"Tarea ya terminada y con resultado → <b>present perfect simple</b>."},
   {t:"write", q:"Did you ever been to a music festival?", a:["have you ever been to a music festival"], why:"Experiencia sin decir cuándo → <b>Have you ever been…?</b>"},
   {t:"write", q:"They have been playing at the stadium last night.", a:["they {played|were playing} at the stadium last night"], why:"<i>Last night</i> es un momento concreto → <b>past simple</b>."},
   {t:"write", q:"My computer isn't working since Monday.", a:["my computer {hasn't|has not} been working since monday"], why:"<i>Since Monday</i> + algo que continúa → <b>hasn't been working</b>."}
  ]},

  {n:16, lvl:2, no:7, nogloss:1, title:"Reescribe con la palabra clave", instr:"Reescribe la frase para que signifique lo mismo. Usa la palabra entre paréntesis.", items:[
   {t:"write", q:"She started singing in the choir in 2021 and she still sings there. (since)", a:["she{ has|'s} been singing in the choir since 2021","she{ has|'s} sung in the choir since 2021"], why:"<b>since 2021</b> + acción que continúa."},
   {t:"write", q:"I last saw my cousins a month ago. (for)", a:["i {haven't|have not} seen my cousins for a month"], why:"<b>I haven't seen my cousins for a month.</b>"},
   {t:"write", q:"When did the band start touring? (How long)", a:["how long {has|have} the band been touring"], why:"<b>How long has the band been touring?</b>"},
   {t:"write", q:"This is my first time at a music festival. (never)", a:["i{ have|'ve} never been to a music festival[ before]"], why:"<b>I've never been to a music festival (before).</b>"},
   {t:"write", q:"They began recording the album in May, and it is now July. They are still recording it. (for)", a:["they{ have|'ve} been recording the album for two months"], why:"De mayo a julio son <b>two months</b> → <b>have been recording … for two months</b>."},
   {t:"write", q:"He is tired because he ran for two hours. (been)", a:["he is tired because he{ has|'s} been running for two hours"], why:"Resultado visible + duración → <b>he has been running</b>."},
   {t:"write", q:"Where are my headphones? Someone took them. (has)", a:["someone has taken my headphones"], why:"Resultado relevante ahora → <b>present perfect simple</b>: <i>has taken</i>."},
   {t:"write", q:"How many levels did you complete today? (have)", a:["how many levels have you completed today"], why:"<i>Today</i> sin acabar y cantidad → <b>How many levels have you completed…?</b>"}
  ]},

  {n:17, lvl:2, no:8, vocab:1, nogloss:1, title:"Ocio, conectores y diálogo", instr:"Completa cada texto con las palabras o expresiones indicadas.", items:[
   {t:"fill", q:"___ I got on the roller coaster, I closed my eyes and screamed. ___, I opened them and realised I was having fun. I've been back four times, and ___ I've never missed a summer visit.", hint:"as soon as · after a while · ever since then · in the course of", a:[["as soon as"],["after a while"],["ever since then"]], why:"<b>as soon as</b> (en cuanto) · <b>after a while</b> (después de un rato) · <b>ever since then</b> (desde entonces)."},
   {t:"fill", q:"Before our trip, we read the ___ to plan the day. The park's main ___ is a huge roller coaster; if you don't like that, you can take a quiet ride on the big ___. ___, you'll have a great day.", hint:"either way · brochure · wheel · attraction · provide", a:[["brochure"],["attraction"],["wheel"],["either way"]], why:"<b>brochure</b> (folleto) · <b>main attraction</b> · <b>big wheel</b> (noria) · <b>either way</b> (de cualquier manera)."},
   {t:"fill", q:"A: Have you ___ anything interesting lately?\nB: I've started going to a climbing wall.\nA: ___ have you been doing that?\nB: Since March. It has become ___ among teenagers in my town.\nA: Wow, I ___ myself climbing a wall; heights terrify me!\nB: ___ come along on Saturday and give it a try?", hint:"been up to · since when · quite trendy · can't imagine · why don't you", a:[["been up to"],["since when"],["quite trendy"],["{can't|cannot} imagine"],["why don't you"]], why:"<b>Have you been up to anything…?</b> · <b>Since when…?</b> · <b>quite trendy</b> · <b>I can't imagine myself…</b> · <b>Why don't you…?</b>"}
  ]},

  {n:18, lvl:2, no:9, title:"Mini-lecturas", instr:"Lee el texto y elige la mejor respuesta.", items:[
   {t:"choice", gloss:{"rooms": "salas", "room": "sala", "end": "acabar (end up = acabar haciendo algo)", "taking": "participar (take part)", "get": "salir (get out)"}, q:"Escape rooms have been growing in popularity for the last decade. Teams of four to six players are locked in a themed room and must solve puzzles within an hour to get out. Organisers say the real appeal is cooperation: nobody can win alone, so even shy players end up taking part.\n\nAccording to the text, why are escape rooms attractive?", opts:["Everyone has to cooperate to succeed", "They are cheaper than going to the cinema", "Players compete against each other", "You can play them alone at home"], a:[0], why:"<i>The real appeal is cooperation: nobody can win alone</i> → hay que <b>cooperar</b> para conseguirlo."},
   {t:"choice", gloss:{"landed": "clavar, conseguir (un truco)", "kept": "seguir, continuar (keep + -ing)"}, q:"Marta has been vlogging about her skateboarding practice since January. At first only her friends watched, but one video went viral after she landed a difficult trick. She admits the sudden attention was stressful, yet she has kept posting every week.\n\nHow did Marta feel about becoming popular online?", opts:["It was stressful, but she carried on", "She stopped posting videos immediately", "She enjoyed every moment of it", "She ignored all the comments completely"], a:[0], why:"<i>The sudden attention was stressful, yet she has kept posting</i>: fue estresante, pero siguió."},
   {t:"choice", gloss:{"fixed": "fijo, establecido", "time": "hora"}, q:"Streaming has changed how we watch entertainment. Instead of waiting for a programme to be broadcast at a fixed time, viewers can choose what to watch and when. However, critics argue that having thousands of options makes it harder to decide, and many people spend longer browsing than watching.\n\nWhat is the critics' main complaint?", opts:["Too many options make choosing difficult", "Streaming is more expensive than normal TV", "Programmes are always broadcast too late", "There are not enough films to watch"], a:[0], why:"<i>Thousands of options makes it harder to decide</i>: demasiadas opciones dificultan elegir."},
   {t:"choice", gloss:{"had":"tener que (have to)", "meant": "estar pensado para (be meant to)", "take": "participar (take part)"}, q:"The Lip Synch Contest was meant to be a small school event, but this year more than 400 people bought tickets. The organisers have had to move it from the gym to the town theatre. Several teachers have already agreed to take part, which has made the event even more exciting for students.\n\nWhy has the contest moved to the theatre?", opts:["The gym was too small for so many people", "The gym is being repaired after a storm", "The teachers asked for a bigger stage", "It is going to be broadcast on national TV"], a:[0], why:"Más de 400 personas compraron entradas: <b>el gimnasio se quedaba pequeño</b>."}
  ]}
 ]
},
{
 id:"m2", short:"U2", owner:"marcos", num:"Unidad 2", title:"Getting Along · Live and Learn", icon:"👪",
 desc:"Módulo 2 del libro: vocabulario de familia y amigos y de la vida escolar, oraciones de relativo especificativas y explicativas (defining y non-defining), gerundios e infinitivos, make/do, expresiones con way, self- y take, falsos amigos y comprensión lectora.",
 gram:["Defining relative clauses","Non-defining relative clauses","Gerundios e infinitivos"],
 lex:["Familia y amigos","Vida escolar","make/do · way · self- · take"],
 theory:[
  {h:"Oraciones de relativo: los pronombres", dl:[
    ["who","personas · <i>My aunt is the relative <b>who</b> I trust the most.</i>"],
    ["which","cosas y animales · <i>I apologised for the mistakes <b>which</b> I made.</i>"],
    ["that","personas o cosas, <b>solo en las especificativas</b> · <i>the book <b>that</b> you lent me</i>"],
    ["whose","posesión («cuyo») · <i>people <b>whose</b> opinion I respect</i>"],
    ["where","lugares · <i>the town <b>where</b> my parents grew up</i>"],
    ["when","momentos · <i>the day <b>when</b> we all got together</i>"]
  ]},
  {h:"Defining: información imprescindible", p:"Dice <b>de quién o de qué</b> hablamos; sin ella la frase no se entiende. <b>Sin comas</b>. Se puede usar <b>that</b> en lugar de <i>who/which</i>.<br><i>The students <b>who/that</b> failed the exam can take it again.</i> (solo los que suspendieron)"},
  {h:"Non-defining: información extra", p:"Añade un dato que <b>se podría quitar</b> sin perder el sentido. Va <b>entre comas</b>, <b>nunca con that</b> y el pronombre <b>no se puede omitir</b>.<br><i>My mother, <b>who</b> is a nurse, works at night.</i> · <i>Madrid, <b>where</b> my cousins live, is very hot in summer.</i>"},
  {h:"Cuándo se puede quitar el pronombre", p:"Solo en las <b>defining</b> y cuando detrás va <b>un sujeto</b>: <i>The recipe (which) my grandmother gave me…</i> · <i>The day (when) we met…</i><br>Si detrás va el verbo, no se puede: <i>The boy <b>who sits</b> next to me…</i><br>Con pasiva se quitan el pronombre y <i>to be</i>: <i>The photos <s>that were</s> taken at the wedding</i> → <i>The photos <b>taken</b> at the wedding</i>."},
  {h:"Errores típicos", p:"<i>The woman <s>who her son</s></i> → <b>whose son</b> · <i>the house where I was born <s>in</s></i> (no repitas la preposición) · <i>my grandparents, who live in Seville, <s>they</s> are…</i> (no repitas el sujeto) · <i>the day <s>where</s></i> → <b>when</b>."},
  {h:"Gerundio (-ing) o infinitivo (to + verbo)", dl:[
    ["Verbo + -ing","enjoy, avoid, mind, finish, keep, suggest, can't stand · <i>I don't mind <b>helping</b>.</i>"],
    ["Verbo + to","want, decide, hope, plan, agree, refuse, expect, learn, afford · <i>She refused <b>to apologise</b>.</i>"],
    ["Preposición + -ing","good at, interested in, look forward to, instead of · <i>I'm looking forward <b>to starting</b>.</i> (aquí <i>to</i> es preposición)"],
    ["-ing como sujeto","<i><b>Making</b> friends is easier when you join a club.</i>"],
    ["Adjetivo + to","<i>It's important <b>to get</b> enough sleep.</i>"]
  ]},
  {h:"Cambian de significado", dl:[
    ["stop + -ing","dejar de · <i>I stopped <b>eating</b> sweets.</i>"],
    ["stop + to","pararse para · <i>We stopped <b>to have</b> a coffee.</i>"],
    ["remember / forget + -ing","recordar / olvidar algo que ya pasó · <i>I'll never forget <b>meeting</b> her.</i>"],
    ["remember / forget + to","acordarse / olvidarse de hacer algo · <i>Remember <b>to hand in</b> your project.</i>"]
  ]},
  {h:"Make o do", dl:[
    ["make","make sense · make friends · make a mistake · make an effort · make a decision · make noise · make a mess"],
    ["do","do your own thing · do homework · do the housework · do someone a favour · do your best · do exercise"]
  ]},
  {h:"Expresiones con way", dl:[
    ["by the way","por cierto (<i>incidentally</i>)"],
    ["in a way","en cierto modo, hasta cierto punto (<i>up to a point</i>)"],
    ["no way","ni hablar, imposible (<i>impossible</i>)"]
  ]},
  {h:"Falsos amigos y palabras que se confunden", dl:[
    ["lesson","clase (<i>an English lesson</i>), no «lección» de conferencia"],
    ["revise","repasar para un examen; «revisar» un texto es <b>check</b>"],
    ["only / single / lonely","<b>only</b> único (<i>an only child</i>) · <b>single</b> soltero · <b>lonely</b> solo, que se siente solo"],
    ["remember / remind","<b>remember</b> acordarse · <b>remind</b> recordar a otra persona (<i>remind me to call</i>)"]
  ]},

  /* ------------------------------ NIVEL 1 ------------------------------ */
  {n:1, lvl:1, no:1, vocab:1, title:"Familia y amigos: vocabulario en contexto", instr:"Elige la opción que completa mejor la frase.", items:[
   {t:"choice", q:"My brother and I don't always ___, but we respect each other's opinions.", opts:["see eye to eye","get together","turn out","make sense"], a:[0], why:"<b>see eye to eye</b> = estar de acuerdo."},
   {t:"choice", q:"I didn't break your phone ___! It slipped out of my hand.", opts:["on purpose","on good terms","in a way","by the way"], a:[0], why:"<b>on purpose</b> = a propósito. Lo contrario es <i>by mistake</i>."},
   {t:"choice", q:"Every Christmas all our ___ come to my grandparents' house: aunts, uncles and cousins.", opts:["relatives","gatherings","belongings","peacemakers"], a:[0], why:"<b>relatives</b> = familiares, parientes."},
   {t:"choice", q:"Lucas felt ___ when his friends planned the trip without asking him.", opts:["left out","spoiled","on purpose","well-rounded"], a:[0], why:"<b>feel left out</b> = sentirse excluido."},
   {t:"choice", q:"You can always ___ your grandmother: she never lets anyone down.", opts:["rely on","complain about","refuse","impose"], a:[0], why:"<b>rely on</b> = contar con alguien."},
   {t:"choice", q:"I'll ___ this photo forever: it's the last one of all my cousins together.", opts:["cherish","complain","refuse","apologise"], a:[0], why:"<b>cherish</b> = atesorar, apreciar mucho."},
   {t:"choice", q:"Even after the argument, the two sisters are still ___ with each other.", opts:["on good terms","on purpose","by mistake","in a way"], a:[0], why:"<b>be on good terms with</b> = llevarse bien con."},
   {t:"choice", q:"Parents shouldn't ___ their beliefs on their children.", opts:["impose","rely","trust","turn"], a:[0], why:"<b>impose something on someone</b> = imponer algo a alguien."},
   {t:"choice", q:"Don't worry about the broken plate. It wasn't your ___.", opts:["fault","purpose","example","gathering"], a:[0], why:"<b>It isn't your fault</b> = no es culpa tuya."},
   {t:"choice", q:"Sam was a difficult child, but he ___ to be a very responsible adult.", opts:["turned out","worked out","got together","showed off"], a:[0], why:"<b>turn out (to be)</b> = resultar, acabar siendo."}
  ]},

  {n:2, lvl:1, no:2, vocab:1, title:"Familia y amigos: completa el texto", instr:"Completa cada texto con las palabras del banco. Sobra una.",
   bank:["gathering","get together","complain","set a good example","apologise","trust","do our own thing","refuse","make sense","work out","rely on"], items:[
   {t:"fill", q:"Last weekend we had a big family ___ at my aunt's house. We don't ___ very often, so everyone was happy. My little cousins always ___ about the food, but this time they ate everything!", a:[["gathering"],["get together"],["complain"]], why:"<b>gathering</b> (reunión) · <b>get together</b> (reunirse) · <b>complain</b> (quejarse)."},
   {t:"fill", q:"As the eldest, I try to ___ for my younger brothers. When I make a mistake, I ___ to my parents, and they ___ me to fix it.", a:[["set a good example"],["{apologise|apologize}"],["trust"]], why:"<b>set a good example</b> · <b>apologise</b> (pedir perdón) · <b>trust</b> (confiar en)."},
   {t:"fill", q:"My parents let us ___ at the weekend, but they ___ to let us stay up late. Their rules don't always ___ to me, but we always ___ a solution together.", a:[["do our own thing"],["refuse"],["make sense"],["work out"]], why:"<b>do our own thing</b> (ir a nuestro aire) · <b>refuse</b> (negarse) · <b>make sense</b> (tener sentido) · <b>work out</b> (encontrar una solución)."}
  ]},

  {n:3, lvl:1, no:3, nogloss:1, title:"Make o do", instr:"Elige make o do en la forma correcta.", items:[
   {t:"choice", q:"Children should follow the rules, even if they don't ___ sense.", opts:["make","do"], a:[0], why:"<b>make sense</b> = tener sentido."},
   {t:"choice", q:"Teenagers want to ___ their own thing at the weekend.", opts:["do","make"], a:[0], why:"<b>do your own thing</b> = ir a tu aire."},
   {t:"choice", q:"Could you ___ me a favour and help me with this box?", opts:["do","make"], a:[0], why:"<b>do someone a favour</b> = hacer un favor."},
   {t:"choice", q:"Everyone can ___ a mistake; the important thing is to apologise.", opts:["make","do"], a:[0], why:"<b>make a mistake</b> = equivocarse."},
   {t:"choice", q:"My brother never ___ his homework before dinner.", opts:["does","makes"], a:[0], why:"<b>do homework</b> = hacer los deberes."},
   {t:"choice", q:"It's hard to ___ friends when you move to a new city.", opts:["make","do"], a:[0], why:"<b>make friends</b> = hacer amigos."},
   {t:"choice", q:"We all have to ___ the housework on Saturdays.", opts:["do","make"], a:[0], why:"<b>do the housework</b> = hacer las tareas de casa."},
   {t:"choice", q:"You need to ___ an effort if you want to pass.", opts:["make","do"], a:[0], why:"<b>make an effort</b> = esforzarse."},
   {t:"choice", q:"Please don't ___ so much noise: the baby is sleeping.", opts:["make","do"], a:[0], why:"<b>make noise</b> = hacer ruido."},
   {t:"choice", q:"She ___ her best in the exam, but she still failed.", opts:["did","made"], a:[0], why:"<b>do your best</b> = hacerlo lo mejor posible."}
  ]},

  {n:4, lvl:1, no:4, vocab:1, title:"El foro: personalidad y expresiones con way", instr:"Elige la opción que completa mejor la frase.", items:[
   {t:"choice", q:"Sophia finds it ___ when she gets into trouble because of her little brothers.", opts:["annoying","generous","easy-going","available"], a:[0], why:"<b>annoying</b> = molesto, irritante."},
   {t:"choice", q:"Some middle children are ___: they hate following rules.", opts:["rebellious","easy-going","generous","well-rounded"], a:[0], why:"<b>rebellious</b> = rebelde, que no se deja controlar."},
   {t:"choice", q:"Grace makes everyone laugh at family parties: she's the ___.", opts:["life of the party","only child","peacemaker","firstborn"], a:[0], why:"<b>the life of the party</b> = el alma de la fiesta."},
   {t:"choice", q:"Only children are ___ perfectionists, but I'm not sure that's true.", opts:["supposedly","on purpose","by mistake","eventually"], a:[0], why:"<b>supposedly</b> = supuestamente (<i>apparently</i>)."},
   {t:"choice", q:"Please don't touch my ___ without asking: those are my things.", opts:["belongings","relatives","gatherings","siblings"], a:[0], why:"<b>belongings</b> = pertenencias (<i>possessions</i>)."},
   {t:"choice", q:"Charlie always helps his brother and sister solve their problems. He's the family ___.", opts:["peacemaker","life of the party","only child","show-off"], a:[0], why:"<b>peacemaker</b> = el que pone paz."},
   {t:"choice", q:"___, have you seen my keys? I can't find them anywhere.", opts:["By the way","In a way","No way"], a:[0], why:"<b>By the way</b> = por cierto (<i>incidentally</i>)."},
   {t:"choice", q:"You got 10 out of 10 in the exam? ___! I don't believe it.", opts:["No way","By the way","In a way"], a:[0], why:"<b>No way!</b> = ¡imposible!, ¡ni hablar!"},
   {t:"choice", q:"I agree with you ___: some of Adler's ideas make sense, but not all of them.", opts:["in a way","by the way","no way"], a:[0], why:"<b>in a way</b> = en cierto modo, hasta cierto punto."}
  ]},

  {n:5, lvl:1, no:5, nogloss:1, title:"Pronombres relativos", instr:"Completa con who, which, whose, where, when o that. A veces vale más de uno.", items:[
   {t:"fill", q:"My uncle Leo, ___ lives in Bilbao, is a chef. The restaurant ___ he works is always full. It's also the place ___ we celebrated my grandmother's 80th birthday.", a:[["who"],["where"],["where"]], why:"Persona en una explicativa → <b>who</b> (nunca <i>that</i>) · lugar → <b>where</b>."},
   {t:"fill", q:"I'll never forget the day ___ my sister was born. She's the person ___ I trust the most, and the one ___ advice I always follow.", a:[["{when|that}"],["{who|that|whom}"],["whose"]], why:"Momento → <b>when</b> · persona → <b>who/that</b> · posesión → <b>whose</b> (<i>cuyos consejos</i>)."},
   {t:"fill", q:"We have a dog ___ name is Rocky. He's a dog ___ loves children. He sleeps in the garden, ___ he has his own little house.", a:[["whose"],["{who|which|that}"],["where"]], why:"<b>whose name</b> (cuyo nombre) · <b>which/that</b> (animal; también <i>who</i> con mascotas) · lugar → <b>where</b>."},
   {t:"fill", q:"The book ___ you lent me is brilliant. It's about a girl ___ parents run a hotel, in a town ___ it never stops raining.", a:[["{which|that}"],["whose"],["where"]], why:"Cosa → <b>which/that</b> · posesión → <b>whose</b> · lugar → <b>where</b>."}
  ]},

  {n:6, lvl:1, no:6, nogloss:1, title:"Defining o non-defining: ¿cuál está bien?", instr:"Elige la frase correcta. Fíjate en las comas y en el pronombre.", items:[
   {t:"choice", q:"Hablas de tu madre (solo tienes una).", opts:["My mother, who is a nurse, works at night.","My mother who is a nurse works at night.","My mother, that is a nurse, works at night."], a:[0], why:"Solo hay una madre: la información es extra → <b>entre comas</b> y nunca con <i>that</i>."},
   {t:"choice", q:"Solo pueden repetir el examen los que suspendieron.", opts:["The students who failed the exam can take it again.","The students, who failed the exam, can take it again.","The students which failed the exam can take it again."], a:[0], why:"Solo los que suspendieron: información imprescindible → <b>sin comas</b>; personas → <b>who</b>."},
   {t:"choice", q:"Un dato sobre Madrid.", opts:["Madrid, where my cousins live, is very hot in summer.","Madrid where my cousins live is very hot in summer.","Madrid, that my cousins live, is very hot in summer."], a:[0], why:"Un nombre propio ya está identificado → explicativa <b>entre comas</b>; lugar → <b>where</b>."},
   {t:"choice", q:"Le hablas a un amigo de un libro concreto.", opts:["This is the book that I told you about.","This is the book, that I told you about.","This is the book, who I told you about."], a:[0], why:"Especificativa (qué libro) → <b>sin comas</b>, y con cosas <b>that/which</b>."},
   {t:"choice", q:"Tu mejor amigo y sus padres.", opts:["My best friend, whose parents are teachers, always helps me with my homework.","My best friend, who's parents are teachers, always helps me with my homework.","My best friend that parents are teachers always helps me with my homework."], a:[0], why:"Posesión → <b>whose</b>. <i>Who's</i> es <i>who is</i>."},
   {t:"choice", q:"Un dato sobre el Everest.", opts:["Mount Everest, which is in Nepal, is the highest mountain in the world.","Mount Everest that is in Nepal is the highest mountain in the world.","Mount Everest, that is in Nepal, is the highest mountain in the world."], a:[0], why:"Información extra sobre un nombre propio → <b>, which …,</b> (nunca <i>that</i>)."},
   {t:"choice", q:"Hablas de un tipo de personas.", opts:["I don't like people who are rude to waiters.","I don't like people, who are rude to waiters.","I don't like people which are rude to waiters."], a:[0], why:"Especificativa (qué personas) → <b>sin comas</b>; personas → <b>who</b>, no <i>which</i>."},
   {t:"choice", q:"Un año que lo cambió todo.", opts:["2020 was the year when everything changed.","2020 was the year where everything changed.","2020 was the year, when everything changed."], a:[0], why:"Momento → <b>when</b>, y sin comas porque define el año."}
  ]},

  {n:7, lvl:1, no:7, nogloss:1, title:"Une las frases", instr:"Une las dos frases con un pronombre relativo (who, which, that, whose, where o when). Las comas no se corrigen, pero piensa si irían.", items:[
   {t:"write", q:"I have a cousin. He lives in Canada.", a:["i have a cousin {who|that} lives in canada"], why:"<b>I have a cousin who lives in Canada.</b> (sin comas: dice qué primo)"},
   {t:"write", q:"That's the girl. Her brother plays in my team.", a:["that{'s| is} the girl whose brother plays in my team"], why:"<i>Her brother</i> → <b>whose brother</b>."},
   {t:"write", q:"My father is a doctor. He works at the local hospital.", a:["my father who is a doctor works at the local hospital","my father who works at the local hospital is a doctor"], why:"<b>My father, who is a doctor, works at the local hospital.</b> Información extra → entre comas."},
   {t:"write", q:"This is the park. We met here for the first time.", a:["this is the park where we met for the first time","this is the park in which we met for the first time","this is the park {which|that} we met in for the first time"], why:"Lugar → <b>where</b>: <i>This is the park where we met for the first time.</i>"},
   {t:"write", q:"I can't find the photo. You gave it to me.", a:["i {can't|cannot|can not} find the photo [{which|that} ]you gave [to ]me"], why:"<b>I can't find the photo (which/that) you gave me.</b> Se quita <i>it</i>: el pronombre ya ocupa su lugar."},
   {t:"write", q:"Rome is the capital of Italy. It has amazing monuments.", a:["rome which is the capital of italy has amazing monuments","rome which has amazing monuments is the capital of italy"], why:"<b>Rome, which is the capital of Italy, has amazing monuments.</b>"},
   {t:"write", q:"Summer is the season. Families travel the most then.", a:["summer is the season {when|in which} families travel the most"], why:"Momento → <b>when</b>: <i>Summer is the season when families travel the most.</i>"},
   {t:"write", q:"My sister's friend is very funny. I met her yesterday.", a:["my sister{'s|s} friend [{who|whom|that} ]i met yesterday is very funny"], why:"<b>My sister's friend (who) I met yesterday is very funny.</b> Se quita <i>her</i>."}
  ]},

  {n:8, lvl:1, no:8, nogloss:1, title:"¿Se puede quitar el pronombre?", instr:"Decide si se puede quitar el pronombre relativo. En las últimas, quita el pronombre y el verbo to be.", items:[
   {t:"choice", q:"The recipe that my grandmother gave me is delicious.", opts:["Sí, se puede quitar","No, no se puede quitar"], a:[0], why:"Detrás va un sujeto (<i>my grandmother</i>) en una especificativa → <b>sí</b>: <i>The recipe my grandmother gave me…</i>"},
   {t:"choice", q:"The boy who sits next to me is new.", opts:["No, no se puede quitar","Sí, se puede quitar"], a:[0], why:"Detrás va el verbo (<i>sits</i>): <i>who</i> es el sujeto → <b>no</b>."},
   {t:"choice", q:"My aunt, who lives in Paris, is visiting us.", opts:["No, no se puede quitar","Sí, se puede quitar"], a:[0], why:"Es explicativa (entre comas) → el pronombre <b>nunca</b> se quita."},
   {t:"choice", q:"The film which we watched last night was scary.", opts:["Sí, se puede quitar","No, no se puede quitar"], a:[0], why:"Detrás va un sujeto (<i>we</i>) → <b>sí</b>: <i>The film we watched…</i>"},
   {t:"choice", q:"The girl whose phone was stolen called the police.", opts:["No, no se puede quitar","Sí, se puede quitar"], a:[0], why:"<b>Whose</b> nunca se quita."},
   {t:"write", q:"The photos that were taken at the wedding are beautiful.", a:["the photos taken at the wedding are beautiful"], why:"Pasiva: se quitan <i>that were</i> → <b>The photos taken at the wedding…</b>"},
   {t:"write", q:"A cake which was made by my grandfather was on the table.", a:["a cake made by my grandfather was on the table"], why:"Se quitan <i>which was</i> → <b>A cake made by my grandfather…</b>"},
   {t:"write", q:"The letters that were written by my great-grandparents are in a box.", a:["the letters written by my great-grandparents are in a box"], why:"Se quitan <i>that were</i> → <b>The letters written by…</b>"}
  ]},

  {n:9, lvl:1, no:9, vocab:1, title:"Vida escolar: vocabulario en contexto", instr:"Elige la opción que completa mejor la frase.", items:[
   {t:"choice", q:"I'm really ___ the summer holidays!", opts:["looking forward to","falling behind","handing in","getting by"], a:[0], why:"<b>look forward to</b> = tener ganas de."},
   {t:"choice", q:"You have to ___ your project before Friday or you'll lose points.", opts:["hand in","show around","sit still","pay off"], a:[0], why:"<b>hand in</b> = entregar."},
   {t:"choice", q:"If you miss too many classes, you'll ___ the rest of the class.", opts:["fall behind","get through","come to an end","look forward to"], a:[0], why:"<b>fall behind</b> = quedarse atrás."},
   {t:"choice", q:"On my first day, a student ___: the library, the gym, the canteen...", opts:["showed me around","introduced me","handed me in","got me through"], a:[0], why:"<b>show someone around</b> = enseñarle un sitio."},
   {t:"choice", q:"It's hard for young children to ___ for a whole hour.", opts:["sit still","get by","pay off","fail"], a:[0], why:"<b>sit still</b> = estarse quieto."},
   {t:"choice", q:"Attendance at PE lessons is ___: you can't skip them.", opts:["mandatory","optional","available","disappointing"], a:[0], why:"<b>mandatory</b> = obligatorio."},
   {t:"choice", q:"All your hard work will ___ when you get your results.", opts:["pay off","fall behind","come to an end","get by"], a:[0], why:"<b>pay off</b> = dar fruto."},
   {t:"choice", q:"My English isn't perfect, but I can ___ when I travel.", opts:["get by","sit still","hand in","fall behind"], a:[0], why:"<b>get by</b> = apañárselas."},
   {t:"choice", q:"The film was really ___: the ending was terrible.", opts:["disappointing","available","well-rounded","mandatory"], a:[0], why:"<b>disappointing</b> = decepcionante."},
   {t:"choice", q:"It's ___ to punish the whole class for one student's mistake.", opts:["unfair","unsure","available","rewarding"], a:[0], why:"<b>unfair</b> = injusto."}
  ]},

  {n:10, lvl:1, no:10, vocab:1, title:"Vida escolar: de la definición a la palabra", instr:"Escribe la palabra o expresión que corresponde a la definición en inglés.", items:[
   {t:"fill", q:"I'm ___ about which subjects to choose next year.", hint:"not certain", a:[["unsure"]], why:"<b>unsure</b> = inseguro, que no lo tiene claro."},
   {t:"fill", q:"There are lots of after-school activities ___ to students.", hint:"that you can use or get", a:[["available"]], why:"<b>available</b> = disponible."},
   {t:"fill", q:"My teacher always ___ us to ask questions.", hint:"gives support and confidence", a:[["encourages"]], why:"<b>encourage</b> = animar. Con <i>my teacher</i>: <i>encourages</i>."},
   {t:"fill", q:"A ___ education includes sport, art and music, not just exams.", hint:"complete and balanced", a:[["well-rounded"]], why:"<b>well-rounded</b> = completo, equilibrado."},
   {t:"fill", q:"I don't know how I'm going to ___ this week: I have four exams!", hint:"manage to finish something difficult", a:[["get through"]], why:"<b>get through</b> = superar, sacar adelante."},
   {t:"fill", q:"Everyone was full of ___ on the last day of school.", hint:"a feeling of great happiness and enthusiasm", a:[["excitement"]], why:"<b>excitement</b> = emoción, ilusión."},
   {t:"fill", q:"Helping others is a very ___ experience.", hint:"giving satisfaction, pleasing", a:[["rewarding"]], why:"<b>rewarding</b> = gratificante."},
   {t:"fill", q:"The teacher gave me detailed ___ on my essay.", hint:"comments on how good your work is", a:[["feedback"]], why:"<b>feedback</b> = comentarios sobre tu trabajo."},
   {t:"fill", q:"Short daily practice helps students ___ new information.", hint:"keep for a long time", a:[["retain"]], why:"<b>retain</b> = retener."},
   {t:"fill", q:"It's easier to study if you ___ the material into smaller parts.", hint:"divide", a:[["break down"]], why:"<b>break down</b> = dividir en partes."}
  ]},

  {n:11, lvl:1, no:11, vocab:1, title:"Self- y expresiones con take", instr:"Completa cada texto con las palabras del banco. Sobran dos.",
   bank:["self-confidence","self-control","self-respect","self-defence","self-pity","take part in","take place","take turns","take advantage of","take a chance","take responsibility for"], items:[
   {t:"fill", q:"After the karate course, Marta feels safer: she has learned ___ and her ___ has grown a lot. She has also learned ___: she never loses her temper now.", a:[["self-{defence|defense}"],["self-confidence"],["self-control"]], why:"<b>self-defence</b> (defensa personal) · <b>self-confidence</b> (confianza en sí misma) · <b>self-control</b> (autocontrol)."},
   {t:"fill", q:"The school fair will ___ next Friday. All students can ___ the activities, and we'll ___ to use the stage, so everyone gets a chance.", a:[["take place"],["take part in"],["take turns"]], why:"<b>take place</b> (tener lugar) · <b>take part in</b> (participar en) · <b>take turns</b> (turnarse)."},
   {t:"fill", q:"You have to ___ your own learning. ___ the free classes the library offers, and ___: you might discover a new hobby!", a:[["take responsibility for"],["take advantage of"],["take a chance"]], why:"<b>take responsibility for</b> · <b>take advantage of</b> (aprovechar) · <b>take a chance</b> (arriesgarse)."}
  ]},

  {n:12, lvl:1, no:12, title:"Falsos amigos y palabras que se confunden", instr:"Elige la palabra correcta.", items:[
   {t:"choice", q:"I have to ___ for my history exam tomorrow.", opts:["revise","check","remind","remember"], a:[0], why:"<b>revise</b> = repasar (para un examen). No es «revisar»."},
   {t:"choice", q:"Can you ___ my essay for spelling mistakes?", opts:["check","revise","remind","remember"], a:[0], why:"«Revisar» un texto es <b>check</b>."},
   {t:"choice", q:"Our English ___ starts at nine o'clock.", opts:["lesson","lecture","reading","conference"], a:[0], why:"<b>lesson</b> = clase. <i>Lecture</i> es una conferencia."},
   {t:"choice", q:"Grace is the ___ girl in her family: she has two brothers.", opts:["only","single","lonely"], a:[0], why:"<b>only</b> = única."},
   {t:"choice", q:"My aunt is ___: she isn't married.", opts:["single","only","lonely"], a:[0], why:"<b>single</b> = soltera."},
   {t:"choice", q:"He felt ___ when his best friends moved away.", opts:["lonely","only","single"], a:[0], why:"<b>lonely</b> = solo, que se siente solo."},
   {t:"choice", q:"Please ___ me to call Grandma tonight.", opts:["remind","remember","revise"], a:[0], why:"<b>remind someone to do something</b> = recordarle a alguien que haga algo."},
   {t:"choice", q:"Do you ___ the day we met?", opts:["remember","remind","revise"], a:[0], why:"<b>remember</b> = acordarse."}
  ]},

  {n:13, lvl:1, no:13, nogloss:1, title:"Gerundio o infinitivo", instr:"Escribe el verbo entre paréntesis en la forma correcta: -ing o to + verbo.", items:[
   {t:"fill", q:"I'm looking forward to ___ (start) at my new school.", a:[["starting"]], why:"<i>look forward to</i> + <b>-ing</b> (aquí <i>to</i> es preposición)."},
   {t:"fill", q:"My parents want me ___ (study) at a traditional school.", a:[["to study"]], why:"<i>want someone</i> + <b>to</b> + verbo."},
   {t:"fill", q:"She avoids ___ (talk) about her problems.", a:[["talking"]], why:"<i>avoid</i> + <b>-ing</b>."},
   {t:"fill", q:"We decided ___ (sign) up for the drama club.", a:[["to sign"]], why:"<i>decide</i> + <b>to</b> + verbo."},
   {t:"fill", q:"I don't mind ___ (help) my little brother with his homework.", a:[["helping"]], why:"<i>don't mind</i> + <b>-ing</b>."},
   {t:"fill", q:"He refused ___ (apologise) to his sister.", a:[["to {apologise|apologize}"]], why:"<i>refuse</i> + <b>to</b> + verbo."},
   {t:"fill", q:"___ (make) new friends is easier when you join a club.", a:[["making"]], why:"Como sujeto de la frase → <b>-ing</b>: <i>Making new friends is…</i>"},
   {t:"fill", q:"I'm not very good at ___ (sit) still for long periods.", a:[["sitting"]], why:"Preposición (<i>at</i>) + <b>-ing</b>."},
   {t:"fill", q:"They hope ___ (pass) all their exams.", a:[["to pass"]], why:"<i>hope</i> + <b>to</b> + verbo."},
   {t:"fill", q:"Remember ___ (hand) in your project on Friday!", a:[["to hand"]], why:"<i>remember</i> + <b>to</b> = acordarse de hacer algo que aún no has hecho."},
   {t:"fill", q:"Have you finished ___ (revise) for the test?", a:[["revising"]], why:"<i>finish</i> + <b>-ing</b>."},
   {t:"fill", q:"It's important ___ (get) enough sleep before an exam.", a:[["to get"]], why:"<i>It's important</i> + <b>to</b> + verbo."}
  ]},

  {n:14, lvl:1, no:14, title:"Mini-lecturas", instr:"Lee el texto y elige la mejor respuesta.", items:[
   {t:"choice", q:"In many families, the eldest child is expected to set a good example. The psychologist Alfred Adler believed that birth order shapes personality: firstborns often become responsible leaders, middle children tend to be peacemakers, and the youngest may enjoy being the centre of attention. However, many experts today say that the family environment matters more than the order in which children are born.\n\nWhat do many experts think today?", opts:["The family environment is more important than birth order","Birth order explains everything about our personality","Middle children are always the most rebellious","The youngest children never like attention"], a:[0], why:"El texto dice que <b>el ambiente familiar importa más</b> que el orden de nacimiento."},
   {t:"choice", q:"At GrandFriends, teenagers spend an afternoon a week with elderly people who live alone. Leo, 16, visits a retired teacher called Rose. 'At first I didn't know what to talk about,' he says, 'but now Rose helps me with my maths and I show her how to use her phone.' Leo says the programme has taught him to be more patient.\n\nWhat has Leo learned from the programme?", opts:["To be more patient","To teach maths","To use a phone","To live alone"], a:[0], why:"<i>The programme has taught him to be more patient</i>: aprendió a ser <b>más paciente</b>."},
   {t:"choice", q:"Some schools have stopped giving marks. Instead, teachers write detailed feedback, and students can keep improving their work until they are happy with it. Supporters say this helps students who lack self-confidence, because a single bad mark can make them give up. Critics, however, worry that without marks students won't know where they stand.\n\nWhy do supporters like this method?", opts:["It helps students who are not very confident","It makes exams easier to pass","It means teachers have less work","It tells students exactly where they stand"], a:[0], why:"Los defensores dicen que <b>ayuda a quien tiene poca confianza en sí mismo</b>."},
   {t:"choice", q:"Microlearning breaks lessons down into short units of five to ten minutes, each followed by a quick activity. Because each unit focuses on one idea, students are less likely to suffer from 'brain fog' and can retain more information. It is becoming popular in schools and companies alike, as people's attention spans seem to be getting shorter.\n\nWhy is microlearning becoming more popular?", opts:["People seem to concentrate for shorter periods","Students prefer long lessons","Companies want fewer activities","It is cheaper than normal lessons"], a:[0], why:"Porque <b>la capacidad de atención parece cada vez más corta</b> (<i>attention spans are getting shorter</i>)."}
  ]},

  /* ------------------------------ NIVEL 2 ------------------------------ */
  {n:15, lvl:2, no:1, vocab:1, title:"Relaciona el vocabulario", instr:"Relaciona cada expresión con su traducción.", items:[
   {t:"match", q:"Familia y amigos: relaciona cada expresión con su traducción.", pairs:[["see eye to eye","estar de acuerdo"],["feel left out","sentirse excluido"],["rely on","contar con"],["turn out","resultar, acabar siendo"],["on purpose","a propósito"],["cherish","atesorar"]], why:"<b>see eye to eye</b> estar de acuerdo · <b>feel left out</b> sentirse excluido · <b>rely on</b> contar con · <b>turn out</b> resultar · <b>on purpose</b> a propósito · <b>cherish</b> atesorar."},
   {t:"match", q:"Vida escolar: relaciona cada expresión con su traducción.", pairs:[["hand in","entregar"],["fall behind","quedarse atrás"],["get by","apañárselas"],["pay off","dar fruto"],["sit still","estarse quieto"],["show around","enseñar un lugar"]], why:"<b>hand in</b> entregar · <b>fall behind</b> quedarse atrás · <b>get by</b> apañárselas · <b>pay off</b> dar fruto · <b>sit still</b> estarse quieto · <b>show around</b> enseñar un lugar."},
   {t:"match", q:"Self- y take: relaciona cada expresión con su traducción.", pairs:[["self-esteem","autoestima"],["self-pity","autocompasión"],["take turns","turnarse"],["take place","tener lugar"],["take a chance","arriesgarse"],["belongings","pertenencias"]], why:"<b>self-esteem</b> autoestima · <b>self-pity</b> autocompasión · <b>take turns</b> turnarse · <b>take place</b> tener lugar · <b>take a chance</b> arriesgarse · <b>belongings</b> pertenencias."}
  ]},

  {n:16, lvl:2, no:2, nogloss:1, title:"Oraciones de relativo: encuentra el error", instr:"Cada frase tiene un error con la oración de relativo. Escribe la frase corregida.", items:[
   {t:"write", q:"This is the house where I was born in.", a:["this is the house where i was born","this is the house [{which|that} ]i was born in","this is the house in which i was born"], why:"Con <b>where</b> no se repite la preposición: <i>the house where I was born</i>."},
   {t:"write", q:"My brother, that is a pilot, travels a lot.", a:["my brother who is a pilot travels a lot"], why:"En una explicativa (entre comas) no se usa <i>that</i> → <b>who</b>."},
   {t:"write", q:"The woman who her son is my classmate is a doctor.", a:["the woman whose son is my classmate is a doctor"], why:"Posesión → <b>whose son</b>, no <i>who her son</i>."},
   {t:"write", q:"I remember the day where we moved house.", a:["i remember the day [{when|that} ]we moved house"], why:"Con un momento → <b>when</b> (o <i>that</i>, o nada)."},
   {t:"write", q:"The book who you lent me is fantastic.", a:["the book [{which|that} ]you lent me is fantastic"], why:"Cosas → <b>which/that</b>, o se omite porque detrás va un sujeto."},
   {t:"write", q:"My grandparents, who live in Seville, they are visiting us.", a:["my grandparents who live in seville are visiting us"], why:"No se repite el sujeto: <i>My grandparents, who live in Seville, <b>are</b> visiting us.</i>"},
   {t:"write", q:"Paris, that is the capital of France, is beautiful.", a:["paris which is the capital of france is beautiful"], why:"Explicativa → <b>which</b>, nunca <i>that</i>."},
   {t:"write", q:"He's the teacher which helped me pass the exam.", a:["he{'s| is} the teacher {who|that} helped me[ to] pass the exam"], why:"Persona → <b>who/that</b>, no <i>which</i>."}
  ]},

  {n:17, lvl:2, no:3, nogloss:1, title:"Une las frases con información extra", instr:"Une las frases con una oración de relativo explicativa (non-defining). Las comas no se corrigen, pero irían en tu frase.", items:[
   {t:"write", q:"Alfred Adler was an Austrian psychologist. He studied birth order.", a:["alfred adler who was an austrian psychologist studied birth order","alfred adler who studied birth order was an austrian psychologist"], why:"<b>Alfred Adler, who was an Austrian psychologist, studied birth order.</b>"},

function skey(){ return "cuaderno-arcade-v3-"+PROFILE; }
function blank(){
  return {xp:0, tokens:3, lvl:0, ex:{}, wrong:[], resume:{}, answers:{}, days:{}, bestDays:0, gifts:{},
    shields:{}, stickers:{}, stickerAt:{}, themes:[], accent:"", titles:[], prizes:[], ach:{}, flags:{}, boostDay:"",

let S=blank();
/* Firestore no admite listas dentro de listas: los fallos al emparejar se
   guardan como "i-j". pairOf lee también el formato antiguo [i,j]. */
function pairOf(w){ return Array.isArray(w)?w:String(w).split("-").map(Number); }
function noNestedArrays(x){
  if(Array.isArray(x)) return x.map(v=>Array.isArray(v)?v.join("-"):noNestedArrays(v));
  if(x&&typeof x==="object"){ const o={}; for(const k in x) o[k]=noNestedArrays(x[k]); return o; }
  return x;
}
function hydrate(o){
  const b=blank();
  o=noNestedArrays(o||{});
  return migrateStickers(Object.assign(b, o, {stats:Object.assign(b.stats, (o&&o.stats)||{})}));
}
function useProfile(id){
  PROFILE=id;
  S=blank();
  try{
    const raw=localStorage.getItem(skey());
    if(raw) S=hydrate(JSON.parse(raw));
  }catch(e){}
  if(id!==TEST.id){ try{ localStorage.setItem(LASTKEY, id); }catch(e){} }
  paintWho();
  syncDown(id);
}
function saveLocal(){ if(!PROFILE) return; try{ localStorage.setItem(skey(), JSON.stringify(S)); }catch(e){} }
function save(){
  if(!PROFILE) return;
  S.updatedAt=Date.now();
  saveLocal();
  schedulePush();
}

/* ---------- nube ---------- */
let cloudState="…", pushT=null, cloudErr="", retryT=null;
function setCloud(st, err){
  cloudState=st;
  cloudErr=st==="off"||st==="deny" ? [err&&(err.code||err.message)||"sin código", navigator.onLine?"online":"offline", "v38"].join(" · ") : "";
  /* si falla, se reintenta solo cada 20 s (y al volver internet o la pestaña) */
  clearTimeout(retryT);
  if(st==="off") retryT=setTimeout(retryCloud, 20000);
  paintSyncWarn();
  const c=document.getElementById("cloudline"); if(!c) return;
  const map={ok:["☁︎","Guardado en la nube","var(--green)"],
              wait:["⟳","Guardando…","var(--ink-faint)"],
              off:["⚠","Sin conexión: se guardará al volver","var(--mark-deep)"],
              deny:["🔒","Sin permiso para guardar: cierra sesión y vuelve a entrar","var(--red)"],
              none:["☁︎","Solo en este dispositivo","var(--ink-faint)"]};
  const [ico,title,col]=map[st]||map.none;
  c.textContent=ico+" "+title+(cloudErr?" ("+cloudErr+")":""); c.style.color=col;
}
/* aviso grande en Inicio cuando el progreso no se está guardando en la nube */
function paintSyncWarn(){
  const w=document.getElementById("syncwarn"); if(!w) return;
  const txt=cloudState==="deny"?"🔒 Tu progreso no se está guardando en la nube (sin permiso). Sal con «⇄ Salir» en Progreso, vuelve a entrar y, si sigue, avisa a tu profe."
    :cloudState==="off"?"⚠️ Sin conexión: tu progreso se guarda en este dispositivo y se subirá a la nube cuando vuelva internet."+(cloudErr?" ("+cloudErr+")":"")
    :"";
  w.hidden=!txt; w.textContent=txt;
}
async function syncDown(id){
  if(!window.CLOUD || id===TEST.id) return setCloud("none");
  setCloud("wait");
  try{
    const remote=await CLOUD.load(id);
    if(PROFILE!==id) return;
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
      S=hydrate(remote); saveLocal(); setCloud("ok");
      if(view.name!=="play") render();
      toast("Progreso recuperado de la nube");
    } else if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)){
      await pushUp();
    } else setCloud("ok");
  }catch(e){ console.warn("Nube (bajar):", e); setCloud(e&&e.code==="permission-denied"?"deny":"off", e); }
}
function retryCloud(){
  if(cloudState!=="off" || !PROFILE || !window.CLOUD) return;
  syncDown(PROFILE);
}
window.addEventListener("online", retryCloud);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) retryCloud(); });
function schedulePush(){
  if(!window.CLOUD || isTest()) return setCloud("none");
  setCloud("wait");
  clearTimeout(pushT);
  pushT=setTimeout(pushUp, 1500);
}
async function pushUp(){
  if(!window.CLOUD || !PROFILE || isTest()) return;
  clearTimeout(pushT);
  try{ await CLOUD.save(PROFILE, noNestedArrays(JSON.parse(JSON.stringify(S)))); setCloud("ok"); }
  catch(e){ console.warn("Nube (subir):", e); setCloud(e&&e.code==="permission-denied"?"deny":"off", e); }
}
window.addEventListener("cloud-ready",()=>{ if(PROFILE) syncDown(PROFILE); else setCloud("none"); });

const LEVELS=[
  {xp:0,name:"Rookie"},{xp:250,name:"A2 Explorer"},{xp:600,name:"B1 Runner"},
  {xp:1100,name:"B1+ Sniper"},{xp:1800,name:"B2 Boss"},{xp:2600,name:"Grammar Legend"}
];
function levelIdx(xp){let i=0;for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k].xp) i=k;return i;}
function levelOf(xp){
  const i=levelIdx(xp), cur=LEVELS[i], nxt=LEVELS[i+1];
  return {i,name:cur.name,cur,nxt,pct:nxt?Math.round((xp-cur.xp)/(nxt.xp-cur.xp)*100):100};
}
/* multiplicador de racha: ×1.0 sin racha, ×1.1 a partir de 2 aciertos, tope ×2.0 */
function multOf(streak){ return streak<2 ? 1 : Math.min(2, 1+0.1*(streak-1)); }
function fmtMult(m){ return "×"+m.toFixed(1); }

function addXP(base, mult){
  const g=Math.round(base*mult);
  S.xp+=g;
  const nl=levelIdx(S.xp);
  const up=nl>S.lvl?2*(nl-S.lvl):0;
  if(up){ S.tokens+=up; S.lvl=nl; toast("¡Nivel "+LEVELS[nl].name+"! +"+up+" 🎟️"); setTimeout(()=>SFX.play("levelup"),380); }
  setTimeout(()=>{
    if(g) flyXP("+"+g+" XP");
    bumpChip("[data-fly]");
    if(up) setTimeout(()=>flyXP("+"+up+" 🎟️","tok"),240);
  },0);
  return g;
}

function testAct(k){
  if(!isTest()) return;
  drawer.hidden=true;
  const setStreak=n=>{ S.days={}; S.shields={}; for(let i=1;i<=n;i++) S.days[dayKey(dayShift(-i))]=DAY_GOAL; };
  let msg="";
  if(k==="xp"){ addXP(100,1); msg="+100 XP"; }
  else if(k==="tok"){ S.tokens+=10; msg="+10 🎟️"; }
  else if(k==="boost"){ S.boostDay=dayKey(); msg="⚡ XP doble activado para hoy"; }
  else if(k==="wrong"){ const add=myItems().filter(i=>!S.wrong.includes(i.id)).slice(0,10).map(i=>i.id); S.wrong.push(...add); msg="+"+add.length+" fallos para repasar"; }
  else if(k.startsWith("g-")){ const t=k.slice(2), n=dayStreak()||7; const lines=openGift(t,n); save(); applyAccent(); render(); showGift(t,n,lines); return; }
  else if(k.startsWith("st-")){ const n=+k.slice(3); setStreak(n); S.days[dayKey()]=n?DAY_GOAL-1:0; msg=n?`Racha de ${n} días y hoy ${DAY_GOAL-1}/${DAY_GOAL}: contesta una pregunta para cumplir la meta`:"Racha borrada"; }
  else if(k==="goal19"){ S.days=S.days||{}; S.days[dayKey()]=DAY_GOAL-1; msg=`Hoy ${DAY_GOAL-1}/${DAY_GOAL}: una pregunta más cumple la meta`; }
  else if(k==="shield"){ S.days={}; S.shields={}; for(let i=2;i<=6;i++) S.days[dayKey(dayShift(-i))]=DAY_GOAL; S.tokens=Math.max(S.tokens,SHIELD_COST); save(); go({name:"home"}); return; }
  else if(k==="colors"){ S.themes=ACCENTS.map(a=>a.id).filter(id=>id!=="azul"); msg="Todos los colores desbloqueados (elígelos en Progreso)"; }
  else if(k==="stickers"){ S.stickers={}; S.stickerAt={}; STICKER_ORDER.forEach((id,i)=>{ S.stickers[id]=1+(i%5===0?1:0); S.stickerAt[id]=Date.now()-i*86400000; }); msg="Álbum completo"; }
  else if(k==="ach"){ S.ach={}; ACH.forEach(a=>S.ach[a.id]=Date.now()); msg="Todos los logros"; }
  else if(k==="reset"){ S=blank(); msg="Perfil de prueba a cero"; }
  else if(k==="out"){ leave(); return; }
  save(); applyAccent();
  if(view.name==="play") syncTop(); else render();
  if(msg) toast("🧪 "+msg);
}
