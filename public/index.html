<style>
:root{
  /* ---- base ---- */
  --paper:#E7ECF4;
  --paper-2:#DCE4F0;
  --grid:rgba(21,34,56,.05);
  --ink:#111E33;
  --ink-soft:#46566E;
  --ink-faint:#4B596C;
  --line:rgba(21,34,56,.14);
  --line-soft:rgba(21,34,56,.08);
  --pen:#2547B8;
  --pen-soft:rgba(37,71,184,.13);
  --red:#9E271D;
  --red-soft:rgba(185,50,38,.13);
  --green:#0D6141;
  --green-soft:rgba(18,112,74,.14);
  --mark:#F5C542;
  --mark-deep:#6E4C00;
  --viol:#5A3BB0;
  --viol-soft:rgba(107,75,196,.13);

  /* ---- rediseño móvil (1b Marcador) ---- */
  --soft:#46566E;
  --card:#fff;
  --card2:#EEF2F8;
  --onpen:#fff;
  --pensoft:rgba(37,71,184,.12);
  --marksoft:rgba(245,197,66,.28);
  --markdeep:#6E4C00;
  --greensoft:rgba(18,112,74,.14);
  --redsoft:rgba(158,39,29,.1);
  --band:#2547B8;

  /* ---- cristal ---- */
  --glass:rgba(255,255,255,.34);
  --glass-2:rgba(255,255,255,.20);
  --glass-3:rgba(255,255,255,.12);
  --glass-brd:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.62);
  --glass-shadow:0 16px 44px -18px rgba(17,30,51,.4), 0 2px 8px -4px rgba(17,30,51,.16);
  --pop:rgba(15,25,43,.93);
  --pop-brd:rgba(255,255,255,.20);
  --pop-ink:#F4F8FD;
  --pop-accent:#A9C0FF;
  --pop-accent-2:#FFB4A6;
  --sheet:rgba(255,255,255,.74);
  --blur:blur(26px) saturate(185%);
  --blur-sm:blur(14px) saturate(165%);

  /* ---- luces del fondo ---- */
  --b1:rgba(37,71,184,.32);
  --b2:rgba(107,75,196,.28);
  --b3:rgba(245,197,66,.34);
  --b4:rgba(28,150,150,.26);

  --radius:14px;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1420;
    --paper-2:#101827;
    --grid:rgba(225,235,245,.05);
    --ink:#E8EDF6;
    --ink-soft:#A9B6CC;
    --soft:#A9B6CC;
    --card:#1A2334;
    --card2:#243047;
    --onpen:#0B1220;
    --pensoft:rgba(143,176,255,.16);
    --marksoft:rgba(245,197,66,.18);
    --markdeep:#F5C542;
    --greensoft:rgba(95,211,160,.16);
    --redsoft:rgba(255,154,143,.16);
    --ink-faint:#8C9CB0;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.07);
    --pen:#8FB0FF;
    --pen-soft:rgba(143,169,255,.16);
    --red:#FF9A8F;
    --red-soft:rgba(245,144,127,.16);
    --green:#5FD3A0;
    --green-soft:rgba(99,211,160,.15);
    --mark:#F5C542;
    --mark-deep:#F5C542;
    --viol:#BCA6F8;
    --viol-soft:rgba(188,166,248,.16);
    --glass:rgba(24,33,50,.38);
    --glass-2:rgba(24,33,50,.24);
    --glass-3:rgba(255,255,255,.055);
    --glass-brd:rgba(255,255,255,.16);
    --glass-hi:rgba(255,255,255,.10);
    --pop:rgba(41,55,80,.96);
    --pop-brd:rgba(255,255,255,.28);
    --pop-ink:#F7FAFE;
    --pop-accent:#BFD0FF;
    --pop-accent-2:#FFC7BB;
    --sheet:rgba(22,31,47,.88);
    --glass-shadow:0 18px 50px -20px rgba(0,0,0,.85), 0 2px 10px -6px rgba(0,0,0,.6);
    --b1:rgba(58,91,217,.40);
    --b2:rgba(124,92,224,.36);
    --b3:rgba(201,154,30,.30);
    --b4:rgba(31,127,120,.34);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1420;
  --paper-2:#101827;
  --grid:rgba(225,235,245,.05);
  --ink:#E8EDF6;
  --ink-soft:#A9B6CC;
  --soft:#A9B6CC;
  --card:#1A2334;
  --card2:#243047;
  --onpen:#0B1220;
  --pensoft:rgba(143,176,255,.16);
  --marksoft:rgba(245,197,66,.18);
  --markdeep:#F5C542;
  --greensoft:rgba(95,211,160,.16);
  --redsoft:rgba(255,154,143,.16);
  --ink-faint:#8C9CB0;
  --line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.07);
  --pen:#8FB0FF;
  --pen-soft:rgba(143,169,255,.16);
  --red:#FF9A8F;
  --red-soft:rgba(245,144,127,.16);
  --green:#5FD3A0;
  --green-soft:rgba(99,211,160,.15);
  --mark:#F5C542;
  --mark-deep:#F5C542;
  --viol:#BCA6F8;
  --viol-soft:rgba(188,166,248,.16);
  --glass:rgba(24,33,50,.38);
  --glass-2:rgba(24,33,50,.24);
  --glass-3:rgba(255,255,255,.055);

  --b3:rgba(201,154,30,.30);

}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background-color:var(--paper);
  background-image:
    radial-gradient(46rem 34rem at 8% -6%, var(--b1), transparent 62%),
    radial-gradient(40rem 30rem at 96% 4%, var(--b2), transparent 60%),
    radial-gradient(38rem 28rem at 82% 96%, var(--b3), transparent 62%),
    radial-gradient(42rem 30rem at 4% 88%, var(--b4), transparent 60%),
    linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--f-display);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* la cuadrícula del cuaderno, ahora bajo el cristal */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
  mask-image:radial-gradient(120% 100% at 50% 0%, #000 45%, transparent 100%);
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px;border-radius:5px}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 28px}

/* superficie de cristal reutilizable */
.glass,.topbar,.modes,.unit,.ex,.qcard,.result,.panel,.tile,.drawer-in,.gloss,.toast,.chip,.iconbtn{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--glass-2);
  border-bottom:1px solid var(--glass-brd);
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 8px 30px -22px rgba(17,30,51,.5);
}
.topbar-in{max-width:940px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{
  width:32px;height:32px;flex:none;border-radius:10px;
  background:linear-gradient(145deg, var(--pen), var(--viol));
  color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px -8px rgba(37,71,184,.9);
}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;gap:7px;align-items:center}
.chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:var(--glass);border:1px solid var(--glass-brd);
  box-shadow:0 1px 0 var(--glass-hi) inset;
  font-family:var(--f-mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip[hidden]{display:none!important}
.chip.xp b{color:var(--mark-deep)}
.chip.streak b{color:var(--red)}
.chip.tok b{color:var(--viol)}
.chip.mult b{color:var(--green)}
.chip .lab{color:var(--ink-faint);font-weight:400}
.iconbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--glass-brd);
  background:var(--glass);box-shadow:0 1px 0 var(--glass-hi) inset;
  display:grid;place-items:center;font-size:14px;transition:transform .12s ease, background .12s ease;
}
.iconbtn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.iconbtn[hidden]{display:none!important}

/* ---------- genéricos ---------- */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.lede{font-family:var(--f-read);font-size:16.5px;color:var(--ink-soft);max-width:62ch;line-height:1.55}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:11px;font-weight:600;font-size:15px;letter-spacing:-.01em;
  background:linear-gradient(160deg, var(--pen), color-mix(in srgb, var(--pen) 72%, var(--viol)));
  color:#fff;border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px -14px rgba(37,71,184,.95);
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:translateY(1px)}
.btn.ghost{
  background:var(--glass);color:var(--ink);border-color:var(--glass-brd);
  -webkit-backdrop-filter:var(--blur-sm);backdrop-filter:var(--blur-sm);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.btn.ghost:hover{background:var(--glass-hi);filter:none}
.btn.tok{background:linear-gradient(160deg, var(--viol), color-mix(in srgb, var(--viol) 70%, var(--pen)));color:#fff}
.btn.small{padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-soft);padding:6px 0}
.back:hover{color:var(--pen)}

/* ---------- home ---------- */
.hero{padding:36px 0 22px;display:grid;gap:12px}
.hero h1{font-size:clamp(30px,5.2vw,46px);letter-spacing:-.035em}
.hero h1 .mk{
  background:linear-gradient(transparent 56%, color-mix(in srgb,var(--mark) 78%, transparent) 56%);
  padding:0 3px;border-radius:2px;
}
.levelbar{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.track{
  flex:1;min-width:180px;height:10px;border-radius:99px;overflow:hidden;
  background:var(--glass-3);border:1px solid var(--glass-brd);
  box-shadow:inset 0 1px 3px rgba(17,30,51,.14);
}
.track > i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg, var(--mark), color-mix(in srgb,var(--mark) 60%, var(--pen)));
  box-shadow:0 0 14px -2px color-mix(in srgb,var(--mark) 70%, transparent);
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
.modes{
  margin:22px 0 30px;border:1px solid var(--glass-brd);border-radius:var(--radius);overflow:hidden;
  background:var(--glass);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 17px;border-bottom:1px solid var(--line-soft);transition:background .14s ease}
.mode:last-child{border-bottom:none}
.mode:hover{background:var(--glass-hi)}
.mode-ico{
  width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:var(--glass-2);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi);
}
.mode-t{font-weight:700;font-size:15.5px}
.mode-d{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);line-height:1.4}
.mode-n{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:26px 0 16px}
.tab{padding:9px 14px;font-size:14.5px;font-weight:600;color:var(--ink-faint);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--mark)}
.tab:hover{color:var(--ink)}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:15px}
.unit{
  position:relative;text-align:left;padding:18px 18px 16px;border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-brd);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  display:grid;gap:9px;align-content:start;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.unit:hover{transform:translateY(-3px);background:var(--glass-hi);box-shadow:0 22px 50px -20px rgba(17,30,51,.5), inset 0 1px 0 var(--glass-hi)}
.unit-top{display:flex;align-items:baseline;gap:8px}
.unit-num{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--pen);background:var(--pen-soft);padding:3px 8px;border-radius:6px}
.unit h3{font-size:18.5px}
.unit-d{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag2{font-family:var(--f-mono);font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--glass-3);border:1px solid var(--line-soft);color:var(--ink-soft)}
.tag2.g{border-color:color-mix(in srgb,var(--pen) 32%,transparent);color:var(--pen);background:var(--pen-soft)}
.tag2.v{border-color:color-mix(in srgb,var(--mark) 48%,transparent);color:var(--mark-deep);background:color-mix(in srgb,var(--mark) 16%,transparent)}
.unit-foot{display:flex;align-items:center;gap:10px;margin-top:2px}
.unit-foot .track{height:8px}
.pct{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.medal{position:absolute;top:14px;right:15px;font-size:17px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}

/* ---------- lista de ejercicios ---------- */
.exlist{display:grid;gap:10px;margin-top:18px}
.ex{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;
  background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:12px;
  box-shadow:inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:var(--blur-sm);backdrop-filter:var(--blur-sm);
  transition:background .14s ease, transform .14s ease;
}
.ex:hover{background:var(--glass-hi);transform:translateX(2px)}
.ex-n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-faint);width:34px;flex:none;text-align:center}
.ex-body{min-width:0}
.ex-t{font-weight:650;font-size:15px}
.ex-d{font-family:var(--f-read);font-size:13.5px;color:var(--ink-soft)}
.ex-score{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-faint);display:flex;align-items:center;gap:8px;flex:none}
.dotrow{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dot.on{background:var(--green);box-shadow:0 0 8px -1px var(--green)}
.dot.mid{background:var(--mark)}

/* ---------- partida ---------- */
.playhead{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.playhead .track{height:8px}
.qcount{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:none}
.qcard{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  padding:26px 26px 22px 32px;position:relative;overflow:hidden;
}
.qcard::before{
  content:"";position:absolute;left:15px;top:12px;bottom:12px;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, color-mix(in srgb,var(--red) 55%, transparent) 12%, color-mix(in srgb,var(--red) 55%, transparent) 88%, transparent);
}
.qtag{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.qtag .badge{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:4px 9px;border-radius:7px;background:var(--glass-3);border:1px solid var(--glass-brd);color:var(--ink-soft);
}
.instr{font-family:var(--f-read);font-size:14.5px;color:var(--ink-soft);font-style:italic}
.stem{font-family:var(--f-mono);font-size:17.5px;line-height:1.9;letter-spacing:-.01em;white-space:pre-wrap}
.stem .hint{color:var(--pen);font-weight:600}
.lead{color:var(--ink-faint)}

/* vocabulario */
.voc{font:inherit;color:inherit;padding:1px 3px;border-radius:4px;cursor:help;
  background:color-mix(in srgb,var(--pen) 14%, transparent);
  border-bottom:2px solid color-mix(in srgb,var(--pen) 55%, transparent);
  transition:background .12s ease, border-color .12s ease}
.voc:hover,.voc.open{background:color-mix(in srgb,var(--pen) 30%, transparent);border-bottom-color:var(--pen)}
.vrb{font:inherit;color:inherit;padding:1px 3px;border-radius:4px;cursor:help;
  background:color-mix(in srgb,var(--red) 13%, transparent);
  border-bottom:2px solid color-mix(in srgb,var(--red) 58%, transparent);
  transition:background .12s ease, border-color .12s ease}
.vrb:hover,.vrb.open{background:color-mix(in srgb,var(--red) 28%, transparent);border-bottom-color:var(--red)}
.gloss{
  position:absolute;z-index:60;border-radius:14px;padding:12px 15px;max-width:250px;
  background:var(--pop);border:1px solid var(--pop-brd);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 20px 48px -16px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.16);
  color:var(--pop-ink);font-family:var(--f-display);font-size:14px;line-height:1.4;
  animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;
}
.gloss b{font-family:var(--f-mono);font-size:13px;display:block;color:var(--pop-accent);margin-bottom:3px}
.gloss.verb b{color:var(--pop-accent-2)}
.gloss[hidden]{display:none!important}
.gloss.verb{max-width:320px}
.vrole{font-size:12px;opacity:.85;margin-top:4px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:10px;border-top:1px solid var(--pop-brd);padding-top:9px}
.vh{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.vf{font-family:var(--f-mono);font-size:13.5px;opacity:.95}
.vf.cur{opacity:1;font-weight:700;color:var(--pop-accent-2)}
.vochelp{font-family:var(--f-read);font-size:13.5px;color:var(--ink-faint);margin-top:12px;font-style:italic}
.vochelp .lg-n{color:var(--pen);font-weight:600;font-style:normal}
.vochelp .lg-v{color:var(--red);font-weight:600;font-style:normal}

.blank{
  font-family:var(--f-mono);font-size:16.5px;font-weight:500;
  background:var(--glass-3);border:none;border-bottom:2px solid var(--ink-faint);
  padding:3px 9px;min-width:130px;border-radius:6px 6px 0 0;
  transition:border-color .12s ease, background .12s ease;
}
.blank:focus{outline:none;border-bottom-color:var(--pen);background:var(--pen-soft)}
.blank.ok{border-bottom-color:var(--green);background:var(--green-soft)}
.blank.no{border-bottom-color:var(--red);background:var(--red-soft)}
.answerline{margin-top:18px;display:grid;gap:10px}
.answerline input{
  width:100%;font-family:var(--f-mono);font-size:16.5px;padding:12px 14px;
  background:var(--glass-3);border:1px solid var(--glass-brd);border-radius:11px;
  box-shadow:inset 0 1px 2px rgba(17,30,51,.08);
}
.answerline input:focus{outline:none;border-color:var(--pen);background:var(--pen-soft)}
.answerline input.ok{border-color:var(--green);background:var(--green-soft)}
.answerline input.no{border-color:var(--red);background:var(--red-soft)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{
  display:flex;align-items:center;gap:11px;text-align:left;padding:13px 15px;border-radius:12px;
  border:1px solid var(--glass-brd);background:var(--glass-2);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  font-family:var(--f-mono);font-size:15.5px;
  transition:border-color .12s ease, background .12s ease, transform .1s ease;
}
.opt:hover{background:var(--glass-hi);border-color:color-mix(in srgb,var(--pen) 45%,transparent)}
.opt:active{transform:scale(.995)}
.opt .key{
  width:23px;height:23px;flex:none;border-radius:7px;background:var(--glass-3);
  border:1px solid var(--glass-brd);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-faint);
}
.opt.sel{
  border-color:var(--pen);background:var(--pen-soft);
  box-shadow:inset 0 1px 0 var(--glass-hi), 0 0 0 3px color-mix(in srgb,var(--pen) 22%,transparent);
}
.opt.sel .key{background:var(--pen);color:var(--paper);border-color:transparent}
.opt.ok{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:var(--green-soft)}
.opt.ok .key{background:var(--green);color:var(--paper);border-color:transparent}
.opt.no{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-soft)}
.opt.no .key{background:var(--red);color:var(--paper);border-color:transparent}
.opt[disabled]{pointer-events:none}
.opts.bank{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{
  text-align:left;padding:11px 13px;border-radius:11px;border:1px solid var(--glass-brd);
  background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi);
  font-family:var(--f-mono);font-size:14px;line-height:1.4;transition:all .12s ease;
}
.mitem.sel{border-color:var(--pen);background:var(--pen-soft)}
.mitem.done{border-color:color-mix(in srgb,var(--green) 50%,transparent);background:var(--green-soft);color:var(--ink-soft);pointer-events:none;opacity:.8}
.mitem.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mitem .tag{font-size:11px;color:var(--ink-faint);margin-right:6px}

.fb{
  margin-top:18px;border-radius:14px;padding:15px 17px;display:grid;gap:7px;
  border:1px solid var(--glass-brd);background:var(--glass-2);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.fb.good{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 42%,transparent)}
.fb.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 42%,transparent)}
.fb.near{background:color-mix(in srgb,var(--mark) 20%, transparent);border-color:color-mix(in srgb,var(--mark) 58%,transparent)}
.fb-t{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.good .fb-t{color:var(--green)}
.fb.bad .fb-t{color:var(--red)}
.fb.near .fb-t{color:var(--mark-deep)}
.fb-sol{font-family:var(--f-mono);font-size:15px;line-height:1.6}
.fb-why{font-family:var(--f-read);font-size:15px;line-height:1.55;color:var(--ink-soft)}
.fb-why b{color:var(--ink);font-weight:600}
.fb-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;align-items:center}
.fb-note{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint)}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.qfoot .spacer{margin-left:auto}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--glass-brd);background:var(--glass-3);border-radius:6px;padding:2px 6px}

.result{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  padding:30px;display:grid;gap:16px;text-align:center;justify-items:center;
}
.score{font-family:var(--f-mono);font-size:58px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:24px;color:var(--ink-faint)}
.result .lede{text-align:center}
.xpgain{font-family:var(--f-mono);font-size:14px;color:var(--mark-deep);font-weight:600}
.misslist{width:100%;text-align:left;display:grid;gap:8px;margin-top:6px}
.miss{border:1px solid var(--glass-brd);border-radius:11px;padding:11px 13px;background:var(--glass-2);font-family:var(--f-mono);font-size:13.5px;line-height:1.5}
.miss .yours{color:var(--red);text-decoration:line-through}
.miss .right{color:var(--green)}

/* ---------- estadísticas ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 8px}
.tile{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;padding:15px 16px;display:grid;gap:3px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.tile .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-family:var(--f-read);font-size:13px;color:var(--ink-soft)}
.tile.hi{border-color:color-mix(in srgb,var(--mark) 50%,var(--glass-brd))}
.tile.hi .v{color:var(--mark-deep)}
.panel{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:22px;margin-top:20px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.panel h3{font-size:17px;margin-bottom:3px}
.panel .sub{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(96px,150px) 1fr 46px;gap:11px;align-items:center}
.barrow .nm{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{height:16px;background:var(--glass-3);border-radius:5px;position:relative;border:1px solid var(--glass-brd);box-shadow:inset 0 1px 2px rgba(17,30,51,.1)}
.barfill{height:100%;border-radius:0 4px 4px 0;min-width:2px;background:linear-gradient(90deg, color-mix(in srgb,var(--pen) 70%, var(--viol)), var(--pen));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.barrow .vv{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
.barrow:hover .bartrack{border-color:var(--pen)}
.spark{width:100%;height:110px;overflow-x:auto}
.tablewrap{overflow-x:auto}
.rep{width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px}
.rep th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.rep td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;font-family:var(--f-read)}
.rep td.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.rep td .yours{color:var(--red)}
.rep td .right{color:var(--green)}
.empty{font-family:var(--f-read);font-size:14.5px;color:var(--ink-faint);padding:6px 0}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.step{flex:1;min-width:58px;border:1px solid var(--glass-brd);border-radius:10px;padding:9px 6px;text-align:center;background:var(--glass-3)}
.step .m{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.step .r{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.step.on{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.step.on .m{color:var(--green)}
.step.top{background:color-mix(in srgb,var(--mark) 22%,transparent);border-color:color-mix(in srgb,var(--mark) 62%,transparent)}
.step.top .m{color:var(--mark-deep)}

/* ---------- chuleta ---------- */
.drawer{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(10,16,26,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.drawer[hidden]{display:none!important}
.drawer-in{
  width:min(760px,100%);max-height:86vh;overflow-y:auto;
  background:var(--sheet);border:1px solid var(--glass-brd);border-bottom:none;
  animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both;
  border-radius:22px 22px 0 0;padding:24px 26px 36px;
  box-shadow:0 -20px 60px -26px rgba(0,0,0,.7), inset 0 1px 0 var(--glass-hi);
}
.drawer h3{font-size:21px;margin-bottom:4px}
.theory{display:grid;gap:14px;margin-top:14px}
.tblock{border-left:3px solid var(--mark);padding-left:14px}
.tblock h4{font-size:14px;font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;margin-bottom:5px}
.tblock p{font-family:var(--f-read);font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
.tblock code{font-family:var(--f-mono);font-size:13.5px;background:var(--glass-3);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;color:var(--ink)}
.trow{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 14px;font-size:14px;margin-top:6px}
.trow dt{font-family:var(--f-mono);font-size:13px;color:var(--pen);font-weight:500}
.trow dd{margin:0;font-family:var(--f-read);color:var(--ink-soft);font-size:14.5px}
.footnote{margin-top:clamp(14px,4vh,34px);font-family:var(--f-read);font-size:13.5px;color:var(--ink-faint);line-height:1.5;text-align:center}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;
  background:var(--pop);color:var(--pop-ink);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--pop-brd);
  animation:popIn .28s cubic-bezier(.2,.9,.3,1.2) both;
  padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:0 18px 44px -18px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.2);
}
.toast[hidden]{display:none!important}

@media (max-width:640px){
  /* cabecera en dos filas: marca + acciones arriba, marcadores debajo */
  .topbar-in{flex-wrap:wrap;gap:0 8px;padding:8px 14px}
  .stats{display:contents}
  .brand{order:1;flex:1 1 auto;margin-right:0}
  .chip.who{order:2}
  #statsbtn{order:3}
  #sndbtn{order:4}
  #themebtn{order:5}
  .topbar-in::after{content:"";order:6;flex:0 0 100%;height:0}
  .chip.mult,.chip.streak,.chip.tok,.chip.xp,.cloudchip{order:7;margin-top:8px}
  .topbar.in .brand-name{display:none}
  .chip{padding:4px 9px;font-size:12px}
  .matchgrid{grid-template-columns:1fr}
  .qcard{padding:20px 16px 18px 26px}
  .stem{font-size:16px}
  .brand-sub{display:none}
  .chip .lab{display:none}
  .barrow{grid-template-columns:minmax(74px,110px) 1fr 42px}
}
/* =====================================================================
   ANIMACIONES
   ===================================================================== */
@keyframes enterUp{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(8px)}62%{transform:scale(1.02) translateY(0)}100%{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(38px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes goodPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}
  55%{box-shadow:0 0 0 12px color-mix(in srgb,var(--green) 0%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}
@keyframes badPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}
  60%{box-shadow:0 0 0 11px color-mix(in srgb,var(--red) 0%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}
@keyframes bump{0%{transform:scale(1)}32%{transform:scale(1.22)}62%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes xpFly{
  0%{opacity:0;transform:translate(-50%,10px) scale(.85)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}
}
@keyframes tickIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes flameShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg) scale(1.14)}55%{transform:rotate(9deg) scale(1.14)}}
@keyframes sweep{from{background-position:-140% 0}to{background-position:240% 0}}

/* entrada de vistas y listas */
.qcard,.result,.hero,.panel{animation:enterUp .36s cubic-bezier(.2,.85,.3,1) both}
.unit,.ex,.tile,.mode{animation:enterUp .34s cubic-bezier(.2,.85,.3,1) both}
.opts .opt{animation:enterUp .3s cubic-bezier(.2,.85,.3,1) both}
.opts .opt:nth-child(1){animation-delay:.03s}
.opts .opt:nth-child(2){animation-delay:.07s}
.opts .opt:nth-child(3){animation-delay:.11s}
.opts .opt:nth-child(4){animation-delay:.15s}
.opts .opt:nth-child(n+5){animation-delay:.18s}

/* feedback */
.fb{animation:popIn .32s cubic-bezier(.2,.9,.3,1.15) both}
.fb-t{animation:tickIn .34s .06s cubic-bezier(.2,.9,.3,1.4) both}
.opt.ok,.mitem.done,.blank.ok,.answerline input.ok{animation:goodPulse .75s ease-out}
.opt.no,.blank.no,.answerline input.no{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97), badPulse .75s ease-out}
.mitem.sel{animation:bump .26s ease-out}
.mitem.done{animation:goodPulse .7s ease-out, popIn .3s cubic-bezier(.2,.9,.3,1.3)}

/* la tarjeta reacciona al resultado */
.qcard{transition:border-color .35s ease, box-shadow .35s ease}
.qcard.good{border-color:color-mix(in srgb,var(--green) 50%,var(--glass-brd));
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 34px -12px color-mix(in srgb,var(--green) 75%,transparent)}
.qcard.bad{border-color:color-mix(in srgb,var(--red) 50%,var(--glass-brd));
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 34px -12px color-mix(in srgb,var(--red) 75%,transparent)}
.qcard.bad .stem{animation:shakeX .45s cubic-bezier(.36,.07,.19,.97)}

/* barra superior viva */
.chip.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.3)}
.chip.streak.bump b{animation:flameShake .5s ease-in-out}
.xpfly{
  position:absolute;z-index:80;pointer-events:none;
  font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--mark-deep);
  text-shadow:0 2px 10px color-mix(in srgb,var(--mark) 60%,transparent);
  animation:xpFly 1.05s cubic-bezier(.2,.8,.3,1) forwards;
}
.xpfly.tok{color:var(--viol);text-shadow:0 2px 10px color-mix(in srgb,var(--viol) 55%,transparent)}

/* progreso con brillo al avanzar */
.track > i{position:relative;overflow:hidden}
.track > i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.75) 50%,transparent 80%);
  background-size:200% 100%;animation:sweep 2.4s ease-in-out .3s 1;
}
/* botones y elementos pulsables */
.btn,.opt,.mitem,.unit,.ex,.mode,.iconbtn,.tab{will-change:transform}
.btn:active,.iconbtn:active{transform:translateY(1px) scale(.985)}
.opt:active,.mitem:active{transform:scale(.985)}
.voc:active,.vrb:active{transform:scale(.94)}

/* ---------- selector de alumno ---------- */
.chip.who{padding:4px 10px 4px 5px;gap:7px;transition:background .14s ease,transform .14s ease}
.chip.who:hover{background:var(--glass-hi);transform:translateY(-1px)}
.chip.who[hidden]{display:none!important}
.av{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:12px;font-weight:800;color:var(--paper);background:var(--pen);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chip.who .swap{color:var(--ink-faint);font-size:12px}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:18px;max-width:620px;margin:26px auto 0}
.pick{
  position:relative;display:grid;justify-items:center;gap:5px;padding:30px 22px 24px;
  border-radius:20px;background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  animation:enterUp .4s cubic-bezier(.2,.85,.3,1) both;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.pick:hover{transform:translateY(-4px);background:var(--glass-hi);
  box-shadow:0 26px 56px -22px rgba(17,30,51,.55), inset 0 1px 0 var(--glass-hi)}
.pick:active{transform:translateY(-1px) scale(.99)}
.pick-av{
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;
  font-size:30px;font-weight:800;color:var(--paper);letter-spacing:-.02em;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 12px 26px -12px rgba(17,30,51,.7);
}
.pick-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pick-lv{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.pick-meta{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);text-align:center;margin-top:6px}
.pick-xp{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--mark-deep);
  background:color-mix(in srgb,var(--mark) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 45%,transparent);
  padding:3px 10px;border-radius:99px;margin-top:8px}
.ladder{display:grid;gap:8px}
.rung{
  display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;
  padding:11px 14px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass-3);
}
.rung.done{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.rung.now{
  background:color-mix(in srgb,var(--mark) 16%,transparent);
  border-color:color-mix(in srgb,var(--mark) 55%,transparent);
  box-shadow:0 0 22px -10px color-mix(in srgb,var(--mark) 80%,transparent);
}
.rung.todo{opacity:.82}
.rung-dot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:700;
  background:var(--glass-2);border:1px solid var(--glass-brd);color:var(--ink-faint);
}
.rung.done .rung-dot{background:var(--green);border-color:transparent;color:var(--paper)}
.rung.now .rung-dot{background:var(--mark);border-color:transparent;color:#2a2000}
.rung-body{display:grid;gap:3px;min-width:0}
.rung-name{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rung-tag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mark-deep);background:color-mix(in srgb,var(--mark) 24%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 55%,transparent);padding:2px 7px;border-radius:99px;
}
.rung-need{font-family:var(--f-read);font-size:13px;color:var(--ink-soft)}
.rung-bar{display:block;height:7px;border-radius:99px;background:var(--glass-3);border:1px solid var(--glass-brd);overflow:hidden;margin-top:4px}
.rung-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mark),color-mix(in srgb,var(--mark) 60%,var(--pen)))}
.rung-left{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
.rung-left b{color:var(--mark-deep)}
.rung-xp{display:grid;justify-items:end;line-height:1.1}
.rung-xp b{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.rung-xp small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.pendchip{
  display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.04em;color:var(--mark-deep);vertical-align:middle;
  background:color-mix(in srgb,var(--mark) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 50%,transparent);
  padding:2px 8px;border-radius:99px;
}
.mode-resume{background:color-mix(in srgb,var(--mark) 12%,transparent)}
.mode-resume .mode-ico{background:color-mix(in srgb,var(--mark) 24%,transparent);color:var(--mark-deep);font-size:15px}
.resume-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cloudchip{font-size:15px;padding:0 4px;cursor:default;line-height:34px}
.teacherlink{
  font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);border-bottom:1px dotted var(--ink-faint);padding:2px 0;margin-top:8px;
}
.teacherlink:hover{color:var(--pen);border-bottom-color:var(--pen)}
.cloudchip[hidden]{display:none!important}
.lvlhead{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
.lvlnum{
  font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mark-deep);background:color-mix(in srgb,var(--mark) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 45%,transparent);padding:4px 10px;border-radius:99px;
}
.lvldesc{font-family:var(--f-read);font-size:13.5px;color:var(--ink-soft)}
.lvlpct{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink-faint)}
.lockbox{
  display:grid;justify-items:center;gap:14px;max-width:360px;margin:26px auto 0;
  padding:28px 26px 24px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  animation:enterUp .36s cubic-bezier(.2,.85,.3,1) both;
}
.lockbox.wrong{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97)}
.lockbox input{
  width:100%;text-align:center;letter-spacing:.18em;
  font-family:var(--f-mono);font-size:17px;padding:12px 14px;
  background:var(--glass-3);border:1px solid var(--glass-brd);border-radius:11px;
  box-shadow:inset 0 1px 2px rgba(17,30,51,.08);
}
.lockbox input:focus{outline:none;border-color:var(--pen);background:var(--pen-soft)}
.lockmsg{font-family:var(--f-read);font-size:14px;color:var(--red);font-weight:600}
.lockmsg[hidden]{display:none!important}
.lockacts{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.lastchip{
  position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  background:var(--glass-3);border:1px solid var(--glass-brd);padding:3px 8px;border-radius:99px;
}

.dot.ko{background:var(--red)}
.dot.rec{background:var(--green);box-shadow:0 0 0 1.5px var(--red)}
.rvdot.rec{background:var(--green-soft);border:2px solid var(--red);color:var(--green)}
.rv-first{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px;padding:10px 13px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-soft);
  font-family:var(--f-read);font-size:14.5px;line-height:1.45;color:var(--ink)}
.rv-first span{flex:1 1 240px}
/* revisión del profe */
.rvnav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.rvdot{min-width:32px;height:32px;padding:0 6px;border-radius:9px;border:1px solid var(--glass-brd);background:var(--glass-3);
  font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.rvdot:hover{background:var(--glass-hi)}
.rvdot.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.rvdot.ko{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
.rvdot.mid{background:color-mix(in srgb,var(--mark) 22%,transparent);border-color:color-mix(in srgb,var(--mark) 55%,transparent);color:var(--mark-deep)}
.rvdot.cur{outline:2.5px solid var(--pen);outline-offset:1px}
.rv-banner{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);background:var(--glass-3);
  border:1px solid var(--glass-brd);border-radius:99px;padding:3px 10px}
.rv-tag{margin-left:auto;padding-left:12px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.rv-att{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-family:var(--f-mono);font-size:12px;color:var(--ink-faint)}
.rv-att .chip{padding:2px 9px;font-size:12px;cursor:pointer}
.rv-foot{display:flex;align-items:center;gap:10px;margin-top:16px}
.rv-foot .qcount{margin:0 auto}
#rvcard .blank[disabled],#rvcard .answerline input[disabled]{opacity:1;-webkit-text-fill-color:currentColor}
#rvcard .mitem.done{opacity:1;color:var(--ink);pointer-events:auto}
/* selector de alumno compacto en móvil (va después de sus estilos base) */
@media (max-width:640px){
  .picks{grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .pick{padding:20px 10px 16px;border-radius:18px}
  .pick-av{width:54px;height:54px;font-size:24px}
  .pick-name{font-size:19px}
  .pick-meta{font-size:13px}
  /* pantalla de preguntas más compacta para que quepa sin scroll */
  .back{padding:2px 0}
  .playhead{padding:8px 0 8px}
  .qcard{padding:14px 14px 14px 22px;border-radius:16px}
  .qtag{margin-bottom:8px}
  .stem{line-height:1.65}
  .opts{gap:8px;margin-top:10px}
  .opt{padding:10px 13px}
  .answerline{margin-top:12px}
  .qfoot{margin-top:12px}
  .vochelp{margin-top:8px}
  .fb{margin-top:12px;padding:12px 14px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .track > i::after{display:none}
}
/* si el sistema pide menos transparencia, se opacan las superficies */
@media (prefers-reduced-transparency:reduce){
  :root{--glass:var(--paper);--glass-2:var(--paper);--glass-3:var(--paper-2);--glass-brd:var(--line)}
  .glass,.topbar,.modes,.unit,.ex,.qcard,.result,.panel,.tile,.drawer-in,.chip,.iconbtn{
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
}

/* =====================================================================
   REDISEÑO MÓVIL · propuesta 1b «Marcador»
   Racha, nivel y XP arriba en una banda de color; barra inferior fija;
   texto de 15 px como mínimo y botones de 48 px o más.
   ===================================================================== */
body{background:var(--paper);background-image:none;font-size:17px;line-height:1.35}
body::before{display:none}
body.bandbg{background:var(--band)}
.wrap{max-width:560px;padding:0}
body.has-nav .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.wrap.classic{max-width:940px;padding:14px 18px 28px}
.mono{font-family:var(--f-mono)}
.grow{flex:1;min-width:0;display:grid}
.f15{font-size:15px}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* banda de color de la cabecera */
.band{
  background:var(--band);color:#fff;border-radius:0 0 28px 28px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 18px;display:grid;gap:14px;
}
.row{display:flex;align-items:center;gap:12px}
.av2{width:48px;height:48px;border-radius:50%;background:#fff;color:#111E33;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.hname{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.htitle{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.heb{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.06em}
.gold{color:#F5C542}
.xpbig{font-family:var(--f-mono);font-size:20px;font-weight:600;color:#F5C542;white-space:nowrap}
.hbtn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:21px;flex:none}
.hbtn:active{transform:scale(.95)}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:#F5C542;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px;flex:1}
.bar.paper{height:12px;background:var(--card2)}
.bar.paper > i{background:var(--pen)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;background:rgba(255,255,255,.16);padding:10px 6px;display:grid;justify-items:center;text-align:center;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:600;white-space:nowrap}
.stat span{font-size:15px;white-space:nowrap}
.stat.gold{background:#F5C542;color:#2a2000}
.stat.gold span{font-weight:600}

/* cuerpo */
.sec{padding:16px 20px 0;display:grid;gap:12px;align-content:start}
.card{
  border-radius:20px;background:var(--card);color:var(--ink);padding:16px;display:grid;gap:4px;
  text-align:left;width:100%;animation:enterUp .34s cubic-bezier(.2,.85,.3,1) both;
}
button.card{transition:transform .12s ease}
button.card:active,.resume:active,.xt:active,.pk:active{transform:scale(.98)}
.card[aria-disabled="true"]{opacity:.6}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{min-height:104px;align-content:start}
.mcard .t{font-size:19px;font-weight:800;line-height:1.2}
.mcard .s{font-size:15px;color:var(--soft)}
.mcard .s.red{color:var(--red);font-weight:600}
.resume{
  width:100%;text-align:left;border-radius:22px;background:var(--mark);color:#2a2000;padding:16px 18px;
  display:grid;grid-template-columns:1fr 60px;gap:12px;align-items:center;
  animation:enterUp .34s cubic-bezier(.2,.85,.3,1) both;transition:transform .12s ease;
}
.resume .txt{display:grid;gap:2px}
.resume .eb{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.1em}
.resume .t{font-size:19px;font-weight:800;line-height:1.15}
.resume .play{width:60px;height:60px;border-radius:50%;background:#2a2000;color:#F5C542;display:grid;place-items:center;font-size:24px}
.urow{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative}
.urow .t{font-size:19px;font-weight:800;line-height:1.2}
.urow .arrow{font-size:22px;color:var(--soft)}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring > span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:600}
.eyeb{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--pen)}
.empty2{font-family:var(--f-read);font-size:16px;color:var(--soft);padding:6px 2px}

/* barra inferior fija */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
}
.nav button{height:56px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--soft);font-size:13px;font-weight:600;border-top:4px solid transparent}
.nav button .i{font-size:20px;line-height:1.1}
.nav button.on{color:var(--pen);font-weight:800;border-top-color:var(--pen)}

/* botones */
.bigbtn{width:100%;min-height:58px;border-radius:16px;background:var(--pen);color:var(--onpen);display:grid;place-items:center;font-size:19px;font-weight:800;padding:0 14px;text-align:center;transition:transform .12s ease}
.bigbtn:active,.sqbtn:active,.softbtn:active,.tokbtn:active,.ghostbtn:active{transform:scale(.98)}
.bigbtn[disabled]{opacity:.45}
.bigbtn.white{background:#fff;color:#111E33}
.sqbtn{height:60px;border-radius:18px;background:var(--card);display:grid;place-items:center;font-size:24px}
.softbtn{min-height:52px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:600;padding:0 10px;text-align:center}
.ghostbtn{min-height:52px;padding:0 22px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--soft);text-align:center}
.ghostbtn.wide{width:100%}
.ghostbtn.red{color:var(--red)}
.ghostbtn.on{border-color:var(--pen);color:var(--pen);background:var(--pensoft)}
.textbtn{min-height:44px;font-size:16px;font-weight:600;color:var(--soft)}
.tokbtn{min-height:58px;border-radius:16px;background:var(--marksoft);color:var(--markdeep);display:grid;place-items:center;font-size:16px;font-weight:800;padding:0 8px;text-align:center}
.tokbtn[disabled]{opacity:.7}

/* ---------- selector + contraseña ---------- */
.sel-top{padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 0;display:grid;gap:6px}
.eyebrow2{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.h34{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.picks2{padding:22px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{
  position:relative;border-radius:24px;color:#fff;padding:16px;display:grid;gap:4px;min-height:210px;
  align-content:end;text-align:left;border:4px solid transparent;overflow:hidden;
  animation:enterUp .4s cubic-bezier(.2,.85,.3,1) both;transition:transform .12s ease, border-color .15s ease;
}
.pk.on{border-color:var(--mark)}
.pk .big{position:absolute;top:8px;left:14px;font-size:72px;font-weight:800;line-height:1}
.pk .nm{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pk .lv{font-size:15px}
.pk .xp{font-family:var(--f-mono);font-size:15px;font-weight:600;color:#F5C542}
.pk .lastchip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff;font-size:11px}
.lock2{margin:16px 20px 0;border-radius:24px;background:var(--card);padding:20px;display:grid;gap:14px;animation:popIn .3s cubic-bezier(.2,.9,.3,1.1) both}
.lock2.wrong{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97)}
.lock2 .t{font-size:20px;font-weight:800}
.lock2 input{
  width:100%;height:58px;border-radius:14px;border:2px solid var(--pen);background:var(--pensoft);color:var(--ink);
  padding:0 18px;font-family:var(--f-mono);font-size:22px;letter-spacing:.2em;
}
.lock2 input[type="email"]{font-size:18px;letter-spacing:0}
.lock2 input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 30%,transparent)}
.lock2 .lockmsg{font-size:16px}
.selhint{margin:18px 20px 0;font-family:var(--f-read);font-size:17px;color:var(--soft);text-align:center}
.sel-foot{margin-top:auto;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;justify-items:center}

/* ---------- unidad ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.16);border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:11px;font-size:16px;font-weight:600;color:#fff;white-space:nowrap}
.seg button.on{background:#fff;color:#111E33;font-weight:800}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.xt{
  border-radius:20px;background:var(--card);color:var(--ink);padding:14px;display:grid;gap:6px;min-height:128px;
  align-content:space-between;text-align:left;animation:enterUp .34s cubic-bezier(.2,.85,.3,1) both;transition:transform .12s ease;
}
.xt .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.xt .n{font-family:var(--f-mono);font-size:22px;font-weight:600}
.xt .sc{font-family:var(--f-mono);font-size:15px;color:var(--soft);white-space:nowrap}
.xt .t{font-size:16px;font-weight:700;line-height:1.2}
.xt.done{background:var(--greensoft)}
.xt.done .sc{color:var(--green);font-weight:600}
.xt.part .sc{color:var(--markdeep);font-weight:600}
.xt.now{background:var(--mark);color:#2a2000}
.xt.now .sc{color:#2a2000;font-weight:600}
.xt.now .t{font-weight:800}

/* ---------- pregunta ---------- */
.pband{gap:12px;padding-bottom:16px}
.qcnt{flex:1;font-family:var(--f-mono);font-size:17px;font-weight:600;white-space:nowrap}
.badge2{display:flex;align-items:stretch;border-radius:99px;overflow:hidden;font-family:var(--f-mono);font-weight:600;flex:none}
.badge2 .s{background:rgba(255,255,255,.16);padding:8px 8px 8px 12px;font-size:15px;display:grid;place-items:center}
.badge2 .m{background:#F5C542;color:#2a2000;padding:8px 12px 8px 9px;font-size:17px;display:grid;place-items:center}
.badge2.solo .m{padding:8px 12px}
.badge2.drop{background:rgba(255,255,255,.16);align-items:center;gap:8px;padding:8px 12px}
.badge2.drop s{font-size:15px}
.badge2.drop span{font-size:17px}
.badge2.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.3)}
.multrow{display:flex;align-items:center;gap:10px;font-size:15px}
.multrow b{font-family:var(--f-mono)}
.segs{display:grid;gap:4px}
.segs i{height:10px;border-radius:99px;background:rgba(255,255,255,.25);transition:background .3s ease}
.segs i.ok{background:#F5C542}
.segs i.ko{background:#FF9A8F}
.segs i.cur{background:#fff}
.qwrap{flex:1;display:flex;flex-direction:column}
.qbody{padding:20px 20px 16px;display:grid;gap:16px;align-content:start}
.qbox{border-radius:22px;background:var(--card);padding:20px;display:grid;gap:10px;animation:enterUp .3s cubic-bezier(.2,.85,.3,1) both;transition:box-shadow .35s ease}
.qbox .instr{font-family:var(--f-read);font-size:16px;font-style:italic;color:var(--soft)}
.qbox .stem{font-family:var(--f-mono);font-size:clamp(19px,5.4vw,22px);line-height:1.55;letter-spacing:-.01em}
.qbox .stem.lead{font-size:17px}
.qbox .vochelp{font-size:15px;margin-top:0}
.qbox .hintline{font-family:var(--f-read);font-size:16px;color:var(--soft)}
.qbox .hintline span{font-family:var(--f-mono);color:var(--pen);font-weight:600;font-style:normal}
.qbox .hintline.bank span{color:var(--ink)}
.qwrap.good .qbox{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 70%,transparent)}
.qwrap.bad .qbox{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 55%,transparent)}
.qwrap.bad .qbox .stem{animation:shakeX .45s cubic-bezier(.36,.07,.19,.97)}

  background:color-mix(in srgb,var(--gc) 18%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gc) 70%,transparent)}

.tprize{display:flex;align-items:center;gap:10px;justify-content:space-between;background:linear-gradient(135deg,#FFE27A,#E9A800);color:#2a1a00;border-radius:14px;padding:8px 8px 8px 12px;font-size:15px;font-weight:700}

.foil{position:absolute;inset:4px;pointer-events:none;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;opacity:0}

@keyframes foilMove{from{background-position:0 0,150% 50%}to{background-position:14px 14px,-50% 50%}}

<script>
/* =====================================================================
   CUADERNO ARCADE — motor
   Plataforma de inglés — una unidad por alumno, con corrección automática.
   ===================================================================== */

/* ---------- corrección ---------- */
function expand(t){
  let m = t.match(/\{([^{}]*)\}/);
  if(m){
    const pre=t.slice(0,m.index), post=t.slice(m.index+m[0].length);
    return m[1].split("|").flatMap(o=>expand(pre+o+post));
  }
  m = t.match(/\[([^\[\]]*)\]/);
  if(m){
    const pre=t.slice(0,m.index), post=t.slice(m.index+m[0].length);
    return expand(pre+m[1]+post).concat(expand(pre+post));
  }
  return [t];
}
function norm(s){
  return (s||"")
    .replace(/[‘’ʼ´`]/g,"'")
    .toLowerCase()
    .replace(/['’]/g,"")
    .replace(/[.,!?;:"“”()¡¿]/g,"")
    .replace(/[–—-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function accepts(tpls, lead){
  const out=new Set();
  tpls.forEach(t=>expand(t).forEach(v=>{
    out.add(norm(v));
    if(lead) out.add(norm(lead+" "+v));
  }));
  return out;
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>3) return 9;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function judge(input, tpls, lead){
  const set=accepts(tpls,lead), v=norm(input);
  if(!v) return "empty";
  if(set.has(v)) return "ok";
  for(const s of set){ if(lev(v,s)<=2) return "near"; }
  return "no";
}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fecha(ts){const d=new Date(ts);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}


/* =====================================================================
   PERFILES
   ===================================================================== */
/* =====================================================================
   SONIDOS — sintetizados con Web Audio, sin archivos de audio.
   Se pueden silenciar con el altavoz de la barra; se recuerda por dispositivo.
   ===================================================================== */
const SFX=(()=>{
  const KEY="cuaderno-arcade-sound";
  let ctx=null, master=null, filt=null, on=true;
  try{ on=localStorage.getItem(KEY)!=="off"; }catch(e){}

  /* El navegador solo deja sonar tras un gesto del usuario: el contexto se
     crea y se despierta en el primer toque, y desde entonces ya vale siempre. */
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      try{
        ctx=new AC();
        master=ctx.createGain(); master.gain.value=.55;
        filt=ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=7000;
        const comp=ctx.createDynamicsCompressor();
        master.connect(filt); filt.connect(comp); comp.connect(ctx.destination);
      }catch(e){ ctx=null; return false; }
    }
    if(ctx.state==="suspended") ctx.resume();
    return true;
  }
  /* una nota: frecuencia, momento, duración, forma de onda, volumen, y un
     deslizamiento opcional hacia otra frecuencia */
  function tone(o){
    const f=o.f, t0=ctx.currentTime+(o.t||0), d=o.d||.15, v=o.v==null?.2:o.v;
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(f,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+d);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+(o.a||.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0+d+.03);
  }
  const seq=(notes,gap,o)=>notes.forEach((f,i)=>tone(Object.assign({f,t:i*gap},o)));
  const C5=523.25,D5=587.33,E5=659.25,G5=783.99,A5=880,C6=1046.5,E6=1318.5,G6=1568,C7=2093;

  const SOUNDS={
    tick:   ()=>tone({f:1100,d:.035,type:"triangle",v:.07}),
    pop:    ()=>tone({f:520,to:760,d:.08,type:"sine",v:.13}),
    pick:   ()=>tone({f:700,d:.06,type:"sine",v:.12}),
    good:   ()=>seq([C5,E5],.075,{d:.2,type:"triangle",v:.2}),
    good2:  ()=>seq([C5,E5,G5],.07,{d:.22,type:"triangle",v:.2}),
    good3:  ()=>{ seq([C5,E5,G5,C6],.065,{d:.26,type:"triangle",v:.2}); tone({f:C7,t:.3,d:.3,type:"sine",v:.06}); },
    near:   ()=>seq([440,415],.09,{d:.2,type:"sine",v:.17}),
    bad:    ()=>{ tone({f:220,to:150,d:.26,type:"sawtooth",v:.12}); tone({f:165,to:110,t:.12,d:.3,type:"sawtooth",v:.1}); },
    reveal: ()=>tone({f:330,to:300,d:.2,type:"sine",v:.15}),
    matchOk:()=>seq([G5,C6],.06,{d:.14,type:"triangle",v:.17}),
    matchBad:()=>tone({f:200,to:140,d:.16,type:"square",v:.08}),
    token:  ()=>seq([C6,E6,G6,C7],.055,{d:.16,type:"sine",v:.13}),
    levelup:()=>{ seq([C5,E5,G5,C6,E6],.09,{d:.34,type:"triangle",v:.2});
                  [C5,E5,G5].forEach(f=>tone({f,t:.5,d:.7,type:"sine",v:.09})); },
    win:    ()=>{ seq([C5,E5,G5,C6],.11,{d:.3,type:"triangle",v:.2});
                  [E5,G5,C6].forEach(f=>tone({f,t:.5,d:.6,type:"sine",v:.09})); },
    ok:     ()=>seq([C5,G5],.13,{d:.28,type:"triangle",v:.18}),
    meh:    ()=>seq([G5,E5],.14,{d:.3,type:"sine",v:.15}),
    login:  ()=>seq([E5,A5],.08,{d:.22,type:"triangle",v:.17}),
    bye:    ()=>seq([G5,D5],.08,{d:.2,type:"sine",v:.13}),
    swoosh: ()=>tone({f:300,to:900,d:.12,type:"sine",v:.07})
  };

  return {
    play(name){
      if(!on) return;
      try{ if(!ensure()) return; const f=SOUNDS[name]; if(f) f(); }catch(e){}
    },
    unlock(){ try{ ensure(); }catch(e){} },
    isOn(){ return on; },
    toggle(){
      on=!on;
      try{ localStorage.setItem(KEY,on?"on":"off"); }catch(e){}
      if(on){ try{ ensure(); SOUNDS.pop(); }catch(e){} }
      return on;
    }
  };
})();
/* se despierta el audio en el primer toque, y así los sonidos que llegan
   después de una espera (iniciar sesión, la nube…) también suenan */
["pointerdown","keydown","touchstart"].forEach(ev=>
  document.addEventListener(ev,()=>SFX.unlock(),{capture:true,passive:true}));
/* un tic suave al pulsar cualquier botón; las respuestas y los emparejados
   tienen sus propios sonidos, así que no se duplican */
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button");
  if(!b||b.disabled) return;
  if(b.matches(".opt,.mitem,#check,#st-snd,.voc,.vrb")) return;
  SFX.play("tick");
},true);

const PROFILES=[
  {id:"alvaro", name:"Álvaro", level:"6.º de Primaria", initial:"Á", hue:"var(--pen)",  bg:"#2547B8"},
  {id:"marcos", name:"Marco", level:"3.º de ESO",      initial:"M", hue:"var(--viol)", bg:"#5A3BB0"}
];
/* Acceso con Firebase Authentication. La contraseña la comprueba el servidor
   de Firebase; aquí no hay ninguna guardada.
   Cada alumno es una cuenta con correo interno <id>@cuaderno.local (no es un

function studentFromEmail(email){
  const m=String(email||"").toLowerCase().match(/^([a-z0-9]+)@cuaderno\.local$/);
  return m && PROFILES.some(p=>p.id===m[1]) ? m[1] : null;
}
function authMsg(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Esa no es. Vuelve a intentarlo.";
  if(/too-many-requests/.test(c)) return "Demasiados intentos. Espera unos minutos.";
  if(/network/.test(c)) return "No hay conexión a internet.";
  if(/operation-not-allowed|configuration-not-found/.test(c)) return "El acceso con contraseña no está activado en Firebase todavía.";
  return "No se ha podido entrar ("+(c||"error")+").";
}

  {n:26, lvl:2, no:12, nogloss:1, title:"Verbos irregulares: corrige el error", instr:"Cada frase tiene un error en un verbo irregular. Escribe la frase corregida.", items:[

{
 id:"a2", short:"U2", owner:"alvaro", num:"Unidad 2", title:"Grammar test 2 · Golden Minute", icon:"🎤",
 desc:"Examen de gramática (3 de diciembre): verbos con gerundio o infinitivo, oraciones de huecos con los seis tiempos verbales, afirmativa/negativa/interrogativa y reading tipo PET. Y la exposición oral Golden Minute (9 de diciembre) sobre un pueblo de España.",
 gram:["Verbos + gerundio / infinitivo","6 tiempos verbales","Afirmativa · negativa · interrogativa"],
 lex:["Reading tipo PET","Golden Minute: un pueblo de España"],
 theory:[
  {h:"Verbos + gerundio (-ing)", p:"Después de estos verbos, el segundo verbo va en <b>-ing</b>: <i>I <b>enjoy playing</b> football.</i> · <i>She <b>finished doing</b> her homework.</i>", dl:[
    ["enjoy","disfrutar"],["finish","terminar"],["mind","importar (<i>I don't mind…</i>)"],["avoid","evitar"],
    ["practise","practicar"],["keep","seguir, no parar de"],["give up","dejar de, rendirse"],["can't stand","no soportar"],
    ["spend time","pasar tiempo"],["go + deporte","<i>go swimming, go skiing, go shopping</i>"]
  ]},
  {h:"Verbos + infinitivo (to + verbo)", p:"Después de estos verbos va <b>to + verbo</b>: <i>I <b>want to be</b> a footballer.</i> · <i>We <b>decided to go</b> to the beach.</i>", dl:[
    ["want","querer"],["would like","me gustaría"],["decide","decidir"],["hope","esperar (desear)"],
    ["need","necesitar"],["learn","aprender"],["plan","planear"],["promise","prometer"],
    ["agree","estar de acuerdo, acordar"],["forget","olvidarse de"],["try","intentar"],["offer","ofrecerse a"]
  ]},
  {h:"Los dos valen · y otras reglas", p:"<b>like, love, hate, start, begin</b> aceptan las dos formas casi sin cambio: <i>I like <b>swimming</b> / I like <b>to swim</b></i>.<br><b>Ojo con stop:</b> <i>stop <b>eating</b></i> = dejar de comer · <i>stop <b>to eat</b></i> = pararse para comer.<br><b>Después de preposición, siempre -ing:</b> <i>good <b>at</b> drawing, interested <b>in</b> reading, <b>before</b> going, <b>without</b> saying</i>.<br><b>Como sujeto de la frase, -ing:</b> <i><b>Swimming</b> is good for you.</i><br><b>Para expresar finalidad, to:</b> <i>I went to the shop <b>to buy</b> bread.</i>"},
  {h:"Los seis tiempos: ¿cuál toca?", dl:[
    ["Present simple","rutinas: <i>every day, usually, always, never</i> · <code>play / plays</code>"],
    ["Present continuous","ahora: <i>now, at the moment, Look!, Listen!</i> · <code>am/is/are + -ing</code>"],
    ["Past simple","pasado terminado con fecha: <i>yesterday, last…, ago, in 2020</i> · <code>played / went</code>"],
    ["Past continuous","en curso en el pasado: <i>while, when…, at 9 pm yesterday</i> · <code>was/were + -ing</code>"],
    ["Present perfect","sin fecha: <i>ever, never, just, already, yet, for, since</i> · <code>have/has + participio</code>"],
    ["Future simple","predicción o decisión: <i>tomorrow, next…, I think, probably</i> · <code>will + verbo</code>"]
  ]},
  {h:"Afirmativa, negativa e interrogativa", p:"Busca el <b>auxiliar</b> de cada tiempo: <code>do/does</code> · <code>am/is/are</code> · <code>did</code> · <code>was/were</code> · <code>have/has</code> · <code>will</code>.<br><b>Negativa:</b> auxiliar + <b>not</b> → <i>She <b>doesn't</b> like fish.</i><br><b>Interrogativa:</b> el auxiliar <b>va delante</b> del sujeto → <i><b>Did</b> you see it?</i><br>Con <b>do/does/did</b> el verbo vuelve al <b>infinitivo</b>: <i>He didn't <b>go</b></i>, nunca <i>didn't went</i>."},
  {h:"Reading tipo PET: trucos", p:"<b>1)</b> Lee primero las <b>preguntas</b> y luego el texto. <b>2)</b> La respuesta correcta casi nunca usa las mismas palabras que el texto: busca la <b>misma idea</b> dicha de otra forma. <b>3)</b> Desconfía de las opciones que repiten palabras exactas del texto. <b>4)</b> En los carteles y mensajes cortos, pregúntate: <i>¿quién lo escribe y para qué?</i> <b>5)</b> En los huecos, mira la palabra de <b>después</b> (preposiciones, <i>to</i>, <i>-ing</i>)."},
  {h:"Golden Minute: tu exposición sobre un pueblo", p:"Un minuto hablando, sencillo y ordenado. Sigue estos pasos:<br><b>1. Saludo:</b> <i>Hello everyone! Today I'm going to talk about…</i><br><b>2. Dónde está:</b> <i>It is a small town in the north/south/east/west of Spain. It is in the province of…</i><br><b>3. Cómo es:</b> <i>About 2,000 people live there. It has got narrow streets, old houses and a beautiful church.</i><br><b>4. Por qué es famoso:</b> <i>It is famous for its castle / its cheese / its festival.</i><br><b>5. Qué se puede hacer:</b> <i>You can visit…, go hiking…, try the local food…</i><br><b>6. Tu experiencia:</b> <i>I went there last summer with my family. I loved it because…</i><br><b>7. Cierre:</b> <i>I think you should visit it. Thank you for listening!</i>"},
  {h:"Golden Minute: palabras útiles", vocab:1, dl:[
    ["town / village","pueblo (grande / pequeño)"],["is located in","está situado en"],["province","provincia"],
    ["the mountains / the coast","la montaña / la costa"],["river","río"],["castle","castillo"],
    ["church","iglesia"],["square","plaza"],["narrow streets","calles estrechas"],["bridge","puente"],
    ["walls","murallas"],["festival","fiestas"],["local food","comida típica"],["people","gente, habitantes"],
    ["is famous for","es famoso por"],["you can","se puede"],["it's worth visiting","merece la pena visitarlo"]
  ]}
 ],
 exercises:[
  /* ------------------------------ NIVEL 1 ------------------------------ */
  {n:1, lvl:1, no:1, title:"¿Gerundio o infinitivo?", instr:"Elige la forma correcta del verbo.", items:[
   {t:"choice", q:"I enjoy ___ video games with my friends.", opts:["playing","to play"], a:[0], why:"<i>enjoy</i> + <b>-ing</b>."},
   {t:"choice", q:"We want ___ a new bike for my birthday.", opts:["to get","getting"], a:[0], why:"<i>want</i> + <b>to</b> + verbo."},
   {t:"choice", q:"She finished ___ her homework at seven.", opts:["doing","to do"], a:[0], why:"<i>finish</i> + <b>-ing</b>."},
   {t:"choice", q:"My dad decided ___ a dog.", opts:["to buy","buying"], a:[0], why:"<i>decide</i> + <b>to</b> + verbo."},
   {t:"choice", q:"I don't mind ___ the dishes.", opts:["washing","to wash"], a:[0], why:"<i>mind</i> + <b>-ing</b>."},
   {t:"choice", q:"They hope ___ the match on Saturday.", opts:["to win","winning"], a:[0], why:"<i>hope</i> + <b>to</b> + verbo."},
   {t:"choice", q:"He practises ___ the ball every day.", opts:["kicking","to kick"], a:[0], why:"<i>practise</i> + <b>-ing</b>."},
   {t:"choice", q:"I need ___ more water.", opts:["to drink","drinking"], a:[0], why:"<i>need</i> + <b>to</b> + verbo."},
   {t:"choice", q:"My mum can't stand ___ in the rain.", opts:["walking","to walk"], a:[0], why:"<i>can't stand</i> + <b>-ing</b>."},
   {t:"choice", q:"We are learning ___ the guitar.", opts:["to play","playing"], a:[0], why:"<i>learn</i> + <b>to</b> + verbo."}
  ]},
  {n:2, lvl:1, no:2, title:"Gerundio o infinitivo: completa", instr:"Escribe el verbo entre paréntesis en -ing o con to.", items:[
   {t:"fill", q:"I'd like ___ to Disneyland.", hint:"go", a:[["to go"]], why:"<i>would like</i> + <b>to</b>."},
   {t:"fill", q:"Let's go ___ on Sunday!", hint:"swim", a:[["swimming"]], why:"<i>go</i> + deporte en <b>-ing</b>: <i>go swimming</i>."},
   {t:"fill", q:"She promised ___ me with my project.", hint:"help", a:[["to help"]], why:"<i>promise</i> + <b>to</b>."},
   {t:"fill", q:"Please stop ___! I'm trying to sleep.", hint:"shout", a:[["shouting"]], why:"<i>stop</i> + <b>-ing</b> = dejar de hacer algo."},
   {t:"fill", q:"He is very good at ___.", hint:"draw", a:[["drawing"]], why:"Después de preposición (<i>at</i>) → <b>-ing</b>."},
   {t:"fill", q:"Don't forget ___ your grandma.", hint:"call", a:[["to call"]], why:"<i>forget</i> + <b>to</b> = olvidarse de hacer algo."},
   {t:"fill", q:"___ is my favourite sport.", hint:"ski", a:[["Skiing","skiing"]], why:"Verbo como sujeto de la frase → <b>-ing</b>."},
   {t:"fill", q:"They avoid ___ sweets before dinner.", hint:"eat", a:[["eating"]], why:"<i>avoid</i> + <b>-ing</b>."},
   {t:"fill", q:"I went to the library ___ a book.", hint:"borrow", a:[["to borrow"]], why:"Finalidad (para qué) → <b>to</b> + verbo."},
   {t:"fill", q:"My brother keeps ___ my phone!", hint:"take", a:[["taking"]], why:"<i>keep</i> + <b>-ing</b> = no parar de."}
  ]},
  {n:3, lvl:1, no:3, title:"Los seis tiempos: elige", instr:"Elige el tiempo verbal que pide la frase. Fíjate en las pistas (yesterday, now, ever…).", items:[
   {t:"choice", q:"We usually ___ pasta on Mondays.", opts:["eat","are eating","ate"], a:[0], why:"<i>usually</i> → <b>present simple</b>."},
   {t:"choice", q:"Be quiet! The baby ___.", opts:["is sleeping","sleeps","slept"], a:[0], why:"Algo que pasa ahora mismo → <b>present continuous</b>."},
   {t:"choice", q:"I ___ my cousins two weeks ago.", opts:["visited","have visited","visit"], a:[0], why:"<i>ago</i> → <b>past simple</b>."},
   {t:"choice", q:"At 9 o'clock last night I ___ a film.", opts:["was watching","watched","am watching"], a:[0], why:"Hora concreta del pasado, acción en curso → <b>past continuous</b>."},
   {t:"choice", q:"___ you ever ___ to Paris?", opts:["Have / been","Did / go","Are / going"], a:[0], why:"<i>ever</i> → <b>present perfect</b>: <i>Have you ever been…?</i>"},
   {t:"choice", q:"I think Spain ___ the next World Cup.", opts:["will win","wins","won"], a:[0], why:"Predicción con <i>I think</i> → <b>will</b>."},
   {t:"choice", q:"She ___ her homework yet.", opts:["hasn't finished","didn't finish","doesn't finish"], a:[0], why:"<i>yet</i> → <b>present perfect</b> negativo."},
   {t:"choice", q:"While we ___ football, it started to rain.", opts:["were playing","played","have played"], a:[0], why:"<i>while</i> + acción larga → <b>past continuous</b>."},
   {t:"choice", q:"My grandad ___ a newspaper every morning.", opts:["reads","is reading","has read"], a:[0], why:"<i>every morning</i> → <b>present simple</b> con -s."},
   {t:"choice", q:"Tomorrow it ___ sunny and warm.", opts:["will be","is","was"], a:[0], why:"<i>Tomorrow</i> + predicción → <b>will be</b>."}
  ]},
  {n:4, lvl:1, no:4, title:"Oraciones de huecos: tiempos verbales", instr:"Escribe el verbo entre paréntesis en el tiempo correcto.", items:[
   {t:"fill", q:"My sister ___ the piano every Tuesday.", hint:"play", a:[["plays"]], why:"Rutina + tercera persona → <b>plays</b>."},
   {t:"fill", q:"Shh! I ___ to the radio.", hint:"listen", a:[["am listening","'m listening"]], why:"Ahora mismo → <b>am listening</b>."},
   {t:"fill", q:"We ___ a castle last weekend.", hint:"visit", a:[["visited"]], why:"<i>last weekend</i> → <b>visited</b>."},
   {t:"fill", q:"I ___ never ___ snow.", hint:"see", a:[["have","'ve"],["seen"]], why:"<i>never</i> + experiencia → <b>have never seen</b>."},
   {t:"fill", q:"They ___ dinner when the phone rang.", hint:"have", a:[["were having"]], why:"Acción en curso interrumpida → <b>were having</b>."},
   {t:"fill", q:"Don't worry. I ___ you with your bag.", hint:"help", a:[["will help","'ll help"]], why:"Decisión del momento / ofrecimiento → <b>will help</b>."},
   {t:"fill", q:"He ___ his leg yesterday.", hint:"break", a:[["broke"]], why:"Pasado irregular de <i>break</i>: <b>broke</b>."},
   {t:"fill", q:"We ___ here since 2019.", hint:"live", a:[["have lived","'ve lived"]], why:"<i>since</i> → <b>present perfect</b>."},
   {t:"fill", q:"Next year my brother ___ twelve.", hint:"be", a:[["will be","'ll be"]], why:"Futuro → <b>will be</b>."},
   {t:"fill", q:"She ___ TV right now, she's reading.", hint:"not watch", a:[["{isn't|is not} watching","'s not watching"]], why:"Present continuous negativo → <b>isn't watching</b>."}
  ]},
  {n:5, lvl:1, no:5, title:"Afirmativa, negativa e interrogativa", instr:"Transforma la frase como se pide entre paréntesis.", items:[
   {t:"write", q:"My dog likes carrots. (negativa)", a:["my dog {doesn't|does not} like carrots"], why:"<b>doesn't</b> + infinitivo sin -s."},
   {t:"write", q:"You are coming to the party. (interrogativa)", a:["are you coming to the party"], why:"Se adelanta <b>are</b>."},
   {t:"write", q:"They won the match. (negativa)", a:["they {didn't|did not} win the match"], why:"<b>didn't</b> + <i>win</i> (infinitivo)."},
   {t:"write", q:"She has finished her book. (interrogativa)", a:["has she finished her book"], why:"Se adelanta <b>has</b>."},
   {t:"write", q:"We will go to the cinema. (negativa)", a:["we {won't|will not} go to the cinema"], why:"<b>won't</b> = will not."},
   {t:"write", q:"He was sleeping. (interrogativa)", a:["was he sleeping"], why:"Se adelanta <b>was</b>."},
   {t:"write", q:"Your brother plays basketball. (interrogativa)", a:["does your brother play basketball"], why:"<b>Does</b> se lleva la -s: <i>play</i> sin -s."},
   {t:"write", q:"I am wearing a jacket. (negativa)", a:["i{ am not|'m not} wearing a jacket"], why:"<b>am not</b> (no existe <i>amn't</i>)."}
  ]},
  {n:6, lvl:1, no:6, title:"Reading PET: carteles y mensajes", instr:"Lee el cartel o mensaje y elige qué quiere decir.", items:[
