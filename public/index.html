<style>
:root{
  /* ---- base ---- */
  --paper:#E7ECF4;
  --paper-2:#DCE4F0;
  --grid:rgba(21,34,56,.05);
  --ink:#111E33;
  --ink-soft:#46566E;
  --ink-faint:#4B596C;
  --line:rgba(21,34,56,.14);
  --line-soft:rgba(21,34,56,.08);
  --pen:#2547B8;
  --pen-soft:rgba(37,71,184,.13);
  --red:#9E271D;
  --red-soft:rgba(185,50,38,.13);
  --green:#0D6141;
  --green-soft:rgba(18,112,74,.14);
  --mark:#F5C542;
  --mark-deep:#6E4C00;
  --viol:#5A3BB0;
  --viol-soft:rgba(107,75,196,.13);

  /* ---- cristal ---- */
  --glass:rgba(255,255,255,.34);
  --glass-2:rgba(255,255,255,.20);
  --glass-3:rgba(255,255,255,.12);
  --glass-brd:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.62);
  --glass-shadow:0 16px 44px -18px rgba(17,30,51,.4), 0 2px 8px -4px rgba(17,30,51,.16);
  --pop:rgba(15,25,43,.93);
  --pop-brd:rgba(255,255,255,.20);
  --pop-ink:#F4F8FD;
  --pop-accent:#A9C0FF;
  --pop-accent-2:#FFB4A6;
  --sheet:rgba(255,255,255,.74);
  --blur:blur(26px) saturate(185%);
  --blur-sm:blur(14px) saturate(165%);

  /* ---- luces del fondo ---- */
  --b1:rgba(37,71,184,.32);
  --b2:rgba(107,75,196,.28);
  --b3:rgba(245,197,66,.34);
  --b4:rgba(28,150,150,.26);

  --radius:14px;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A0F18;
    --paper-2:#101827;
    --grid:rgba(225,235,245,.05);
    --ink:#E9EFF7;
    --ink-soft:#AEBCCE;
    --ink-faint:#8C9CB0;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.07);
    --pen:#8FA9FF;
    --pen-soft:rgba(143,169,255,.16);
    --red:#F5907F;
    --red-soft:rgba(245,144,127,.16);
    --green:#63D3A0;
    --green-soft:rgba(99,211,160,.15);
    --mark:#F5C542;
    --mark-deep:#F5C542;
    --viol:#BCA6F8;
    --viol-soft:rgba(188,166,248,.16);
    --glass:rgba(24,33,50,.38);
    --glass-2:rgba(24,33,50,.24);
    --glass-3:rgba(255,255,255,.055);
    --glass-brd:rgba(255,255,255,.16);
    --glass-hi:rgba(255,255,255,.10);
    --pop:rgba(41,55,80,.96);
    --pop-brd:rgba(255,255,255,.28);
    --pop-ink:#F7FAFE;
    --pop-accent:#BFD0FF;
    --pop-accent-2:#FFC7BB;
    --sheet:rgba(22,31,47,.88);
    --glass-shadow:0 18px 50px -20px rgba(0,0,0,.85), 0 2px 10px -6px rgba(0,0,0,.6);
    --b1:rgba(58,91,217,.40);
    --b2:rgba(124,92,224,.36);
    --b3:rgba(201,154,30,.30);
    --b4:rgba(31,127,120,.34);
  }
}
:root[data-theme="dark"]{
  --paper:#0A0F18;
  --paper-2:#101827;
  --grid:rgba(225,235,245,.05);
  --ink:#E9EFF7;
  --ink-soft:#AEBCCE;
  --ink-faint:#8C9CB0;
  --line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.07);
  --pen:#8FA9FF;
  --pen-soft:rgba(143,169,255,.16);
  --red:#F5907F;
  --red-soft:rgba(245,144,127,.16);
  --green:#63D3A0;
  --green-soft:rgba(99,211,160,.15);
  --mark:#F5C542;
  --mark-deep:#F5C542;
  --viol:#BCA6F8;
  --viol-soft:rgba(188,166,248,.16);
  --glass:rgba(24,33,50,.38);
  --glass-2:rgba(24,33,50,.24);
  --glass-3:rgba(255,255,255,.055);
  --glass-brd:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.10);
  --pop:rgba(41,55,80,.96);
  --pop-brd:rgba(255,255,255,.28);
  --pop-ink:#F7FAFE;
  --pop-accent:#BFD0FF;
  --pop-accent-2:#FFC7BB;
  --sheet:rgba(22,31,47,.88);
  --glass-shadow:0 18px 50px -20px rgba(0,0,0,.85), 0 2px 10px -6px rgba(0,0,0,.6);
  --b1:rgba(58,91,217,.40);
  --b2:rgba(124,92,224,.36);
  --b3:rgba(201,154,30,.30);
  --b4:rgba(31,127,120,.34);
}

*{box-sizing:border-box}
body{
  min-height:100vh;
  background-color:var(--paper);
  background-image:
    radial-gradient(46rem 34rem at 8% -6%, var(--b1), transparent 62%),
    radial-gradient(40rem 30rem at 96% 4%, var(--b2), transparent 60%),
    radial-gradient(38rem 28rem at 82% 96%, var(--b3), transparent 62%),
    radial-gradient(42rem 30rem at 4% 88%, var(--b4), transparent 60%),
    linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--f-display);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* la cuadrícula del cuaderno, ahora bajo el cristal */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
  mask-image:radial-gradient(120% 100% at 50% 0%, #000 45%, transparent 100%);
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px;border-radius:5px}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 90px}

/* superficie de cristal reutilizable */
.glass,.topbar,.modes,.unit,.ex,.qcard,.result,.panel,.tile,.drawer-in,.gloss,.toast,.chip,.iconbtn{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--glass-2);
  border-bottom:1px solid var(--glass-brd);
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 8px 30px -22px rgba(17,30,51,.5);
}
.topbar-in{max-width:940px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{
  width:32px;height:32px;flex:none;border-radius:10px;
  background:linear-gradient(145deg, var(--pen), var(--viol));
  color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px -8px rgba(37,71,184,.9);
}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;gap:7px;align-items:center}
.chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:var(--glass);border:1px solid var(--glass-brd);
  box-shadow:0 1px 0 var(--glass-hi) inset;
  font-family:var(--f-mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip[hidden]{display:none!important}
.chip.xp b{color:var(--mark-deep)}
.chip.streak b{color:var(--red)}
.chip.tok b{color:var(--viol)}
.chip.mult b{color:var(--green)}
.chip .lab{color:var(--ink-faint);font-weight:400}
.iconbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--glass-brd);
  background:var(--glass);box-shadow:0 1px 0 var(--glass-hi) inset;
  display:grid;place-items:center;font-size:14px;transition:transform .12s ease, background .12s ease;
}
.iconbtn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.iconbtn[hidden]{display:none!important}

/* ---------- genéricos ---------- */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.lede{font-family:var(--f-read);font-size:16.5px;color:var(--ink-soft);max-width:62ch;line-height:1.55}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:11px;font-weight:600;font-size:15px;letter-spacing:-.01em;
  background:linear-gradient(160deg, var(--pen), color-mix(in srgb, var(--pen) 72%, var(--viol)));
  color:#fff;border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px -14px rgba(37,71,184,.95);
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:translateY(1px)}
.btn.ghost{
  background:var(--glass);color:var(--ink);border-color:var(--glass-brd);
  -webkit-backdrop-filter:var(--blur-sm);backdrop-filter:var(--blur-sm);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.btn.ghost:hover{background:var(--glass-hi);filter:none}
.btn.tok{background:linear-gradient(160deg, var(--viol), color-mix(in srgb, var(--viol) 70%, var(--pen)));color:#fff}
.btn.small{padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-soft);padding:6px 0}
.back:hover{color:var(--pen)}

/* ---------- home ---------- */
.hero{padding:36px 0 22px;display:grid;gap:12px}
.hero h1{font-size:clamp(30px,5.2vw,46px);letter-spacing:-.035em}
.hero h1 .mk{
  background:linear-gradient(transparent 56%, color-mix(in srgb,var(--mark) 78%, transparent) 56%);
  padding:0 3px;border-radius:2px;
}
.levelbar{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.track{
  flex:1;min-width:180px;height:10px;border-radius:99px;overflow:hidden;
  background:var(--glass-3);border:1px solid var(--glass-brd);
  box-shadow:inset 0 1px 3px rgba(17,30,51,.14);
}
.track > i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg, var(--mark), color-mix(in srgb,var(--mark) 60%, var(--pen)));
  box-shadow:0 0 14px -2px color-mix(in srgb,var(--mark) 70%, transparent);
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
.modes{
  margin:22px 0 30px;border:1px solid var(--glass-brd);border-radius:var(--radius);overflow:hidden;
  background:var(--glass);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 17px;border-bottom:1px solid var(--line-soft);transition:background .14s ease}
.mode:last-child{border-bottom:none}
.mode:hover{background:var(--glass-hi)}
.mode-ico{
  width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:var(--glass-2);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi);
}
.mode-t{font-weight:700;font-size:15.5px}
.mode-d{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);line-height:1.4}
.mode-n{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:26px 0 16px}
.tab{padding:9px 14px;font-size:14.5px;font-weight:600;color:var(--ink-faint);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--mark)}
.tab:hover{color:var(--ink)}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:15px}
.unit{
  position:relative;text-align:left;padding:18px 18px 16px;border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-brd);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  display:grid;gap:9px;align-content:start;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.unit:hover{transform:translateY(-3px);background:var(--glass-hi);box-shadow:0 22px 50px -20px rgba(17,30,51,.5), inset 0 1px 0 var(--glass-hi)}
.unit-top{display:flex;align-items:baseline;gap:8px}
.unit-num{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--pen);background:var(--pen-soft);padding:3px 8px;border-radius:6px}
.unit h3{font-size:18.5px}
.unit-d{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag2{font-family:var(--f-mono);font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--glass-3);border:1px solid var(--line-soft);color:var(--ink-soft)}
.tag2.g{border-color:color-mix(in srgb,var(--pen) 32%,transparent);color:var(--pen);background:var(--pen-soft)}
.tag2.v{border-color:color-mix(in srgb,var(--mark) 48%,transparent);color:var(--mark-deep);background:color-mix(in srgb,var(--mark) 16%,transparent)}
.unit-foot{display:flex;align-items:center;gap:10px;margin-top:2px}
.unit-foot .track{height:8px}
.pct{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.medal{position:absolute;top:14px;right:15px;font-size:17px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}

/* ---------- lista de ejercicios ---------- */
.exlist{display:grid;gap:10px;margin-top:18px}
.ex{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;
  background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:12px;
  box-shadow:inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:var(--blur-sm);backdrop-filter:var(--blur-sm);
  transition:background .14s ease, transform .14s ease;
}
.ex:hover{background:var(--glass-hi);transform:translateX(2px)}
.ex-n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-faint);width:34px;flex:none;text-align:center}
.ex-body{min-width:0}
.ex-t{font-weight:650;font-size:15px}
.ex-d{font-family:var(--f-read);font-size:13.5px;color:var(--ink-soft)}
.ex-score{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-faint);display:flex;align-items:center;gap:8px;flex:none}
.dotrow{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dot.on{background:var(--green);box-shadow:0 0 8px -1px var(--green)}
.dot.mid{background:var(--mark)}

/* ---------- partida ---------- */
.playhead{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.playhead .track{height:8px}
.qcount{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:none}
.qcard{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  padding:26px 26px 22px 32px;position:relative;overflow:hidden;
}
.qcard::before{
  content:"";position:absolute;left:15px;top:12px;bottom:12px;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, color-mix(in srgb,var(--red) 55%, transparent) 12%, color-mix(in srgb,var(--red) 55%, transparent) 88%, transparent);
}
.qtag{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.qtag .badge{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:4px 9px;border-radius:7px;background:var(--glass-3);border:1px solid var(--glass-brd);color:var(--ink-soft);
}
.instr{font-family:var(--f-read);font-size:14.5px;color:var(--ink-soft);font-style:italic}
.stem{font-family:var(--f-mono);font-size:17.5px;line-height:1.9;letter-spacing:-.01em;white-space:pre-wrap}
.stem .hint{color:var(--pen);font-weight:600}
.lead{color:var(--ink-faint)}

/* vocabulario */
.voc{font:inherit;color:inherit;padding:1px 3px;border-radius:4px;cursor:help;
  background:color-mix(in srgb,var(--pen) 14%, transparent);
  border-bottom:2px solid color-mix(in srgb,var(--pen) 55%, transparent);
  transition:background .12s ease, border-color .12s ease}
.voc:hover,.voc.open{background:color-mix(in srgb,var(--pen) 30%, transparent);border-bottom-color:var(--pen)}
.vrb{font:inherit;color:inherit;padding:1px 3px;border-radius:4px;cursor:help;
  background:color-mix(in srgb,var(--red) 13%, transparent);
  border-bottom:2px solid color-mix(in srgb,var(--red) 58%, transparent);
  transition:background .12s ease, border-color .12s ease}
.vrb:hover,.vrb.open{background:color-mix(in srgb,var(--red) 28%, transparent);border-bottom-color:var(--red)}
.gloss{
  position:absolute;z-index:60;border-radius:14px;padding:12px 15px;max-width:250px;
  background:var(--pop);border:1px solid var(--pop-brd);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 20px 48px -16px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.16);
  color:var(--pop-ink);font-family:var(--f-display);font-size:14px;line-height:1.4;
  animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;
}
.gloss b{font-family:var(--f-mono);font-size:13px;display:block;color:var(--pop-accent);margin-bottom:3px}
.gloss.verb b{color:var(--pop-accent-2)}
.gloss[hidden]{display:none!important}
.gloss.verb{max-width:320px}
.vrole{font-size:12px;opacity:.85;margin-top:4px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:10px;border-top:1px solid var(--pop-brd);padding-top:9px}
.vh{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.vf{font-family:var(--f-mono);font-size:13.5px;opacity:.95}
.vf.cur{opacity:1;font-weight:700;color:var(--pop-accent-2)}
.vochelp{font-family:var(--f-read);font-size:13.5px;color:var(--ink-faint);margin-top:12px;font-style:italic}
.vochelp .lg-n{color:var(--pen);font-weight:600;font-style:normal}
.vochelp .lg-v{color:var(--red);font-weight:600;font-style:normal}

.blank{
  font-family:var(--f-mono);font-size:16.5px;font-weight:500;
  background:var(--glass-3);border:none;border-bottom:2px solid var(--ink-faint);
  padding:3px 9px;min-width:130px;border-radius:6px 6px 0 0;
  transition:border-color .12s ease, background .12s ease;
}
.blank:focus{outline:none;border-bottom-color:var(--pen);background:var(--pen-soft)}
.blank.ok{border-bottom-color:var(--green);background:var(--green-soft)}
.blank.no{border-bottom-color:var(--red);background:var(--red-soft)}
.answerline{margin-top:18px;display:grid;gap:10px}
.answerline input{
  width:100%;font-family:var(--f-mono);font-size:16.5px;padding:12px 14px;
  background:var(--glass-3);border:1px solid var(--glass-brd);border-radius:11px;
  box-shadow:inset 0 1px 2px rgba(17,30,51,.08);
}
.answerline input:focus{outline:none;border-color:var(--pen);background:var(--pen-soft)}
.answerline input.ok{border-color:var(--green);background:var(--green-soft)}
.answerline input.no{border-color:var(--red);background:var(--red-soft)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{
  display:flex;align-items:center;gap:11px;text-align:left;padding:13px 15px;border-radius:12px;
  border:1px solid var(--glass-brd);background:var(--glass-2);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  font-family:var(--f-mono);font-size:15.5px;
  transition:border-color .12s ease, background .12s ease, transform .1s ease;
}
.opt:hover{background:var(--glass-hi);border-color:color-mix(in srgb,var(--pen) 45%,transparent)}
.opt:active{transform:scale(.995)}
.opt .key{
  width:23px;height:23px;flex:none;border-radius:7px;background:var(--glass-3);
  border:1px solid var(--glass-brd);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-faint);
}
.opt.ok{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:var(--green-soft)}
.opt.ok .key{background:var(--green);color:var(--paper);border-color:transparent}
.opt.no{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-soft)}
.opt.no .key{background:var(--red);color:var(--paper);border-color:transparent}
.opt[disabled]{pointer-events:none}
.opts.bank{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{
  text-align:left;padding:11px 13px;border-radius:11px;border:1px solid var(--glass-brd);
  background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi);
  font-family:var(--f-mono);font-size:14px;line-height:1.4;transition:all .12s ease;
}
.mitem.sel{border-color:var(--pen);background:var(--pen-soft)}
.mitem.done{border-color:color-mix(in srgb,var(--green) 50%,transparent);background:var(--green-soft);color:var(--ink-soft);pointer-events:none;opacity:.8}
.mitem.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mitem .tag{font-size:11px;color:var(--ink-faint);margin-right:6px}

.fb{
  margin-top:18px;border-radius:14px;padding:15px 17px;display:grid;gap:7px;
  border:1px solid var(--glass-brd);background:var(--glass-2);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.fb.good{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 42%,transparent)}
.fb.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 42%,transparent)}
.fb.near{background:color-mix(in srgb,var(--mark) 20%, transparent);border-color:color-mix(in srgb,var(--mark) 58%,transparent)}
.fb-t{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.good .fb-t{color:var(--green)}
.fb.bad .fb-t{color:var(--red)}
.fb.near .fb-t{color:var(--mark-deep)}
.fb-sol{font-family:var(--f-mono);font-size:15px;line-height:1.6}
.fb-why{font-family:var(--f-read);font-size:15px;line-height:1.55;color:var(--ink-soft)}
.fb-why b{color:var(--ink);font-weight:600}
.fb-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;align-items:center}
.fb-note{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint)}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.qfoot .spacer{margin-left:auto}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--glass-brd);background:var(--glass-3);border-radius:6px;padding:2px 6px}

.result{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  padding:30px;display:grid;gap:16px;text-align:center;justify-items:center;
}
.score{font-family:var(--f-mono);font-size:58px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:24px;color:var(--ink-faint)}
.result .lede{text-align:center}
.xpgain{font-family:var(--f-mono);font-size:14px;color:var(--mark-deep);font-weight:600}
.misslist{width:100%;text-align:left;display:grid;gap:8px;margin-top:6px}
.miss{border:1px solid var(--glass-brd);border-radius:11px;padding:11px 13px;background:var(--glass-2);font-family:var(--f-mono);font-size:13.5px;line-height:1.5}
.miss .yours{color:var(--red);text-decoration:line-through}
.miss .right{color:var(--green)}

/* ---------- estadísticas ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 8px}
.tile{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;padding:15px 16px;display:grid;gap:3px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.tile .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-family:var(--f-read);font-size:13px;color:var(--ink-soft)}
.tile.hi{border-color:color-mix(in srgb,var(--mark) 50%,var(--glass-brd))}
.tile.hi .v{color:var(--mark-deep)}
.panel{
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:22px;margin-top:20px;
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.panel h3{font-size:17px;margin-bottom:3px}
.panel .sub{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(96px,150px) 1fr 46px;gap:11px;align-items:center}
.barrow .nm{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{height:16px;background:var(--glass-3);border-radius:5px;position:relative;border:1px solid var(--glass-brd);box-shadow:inset 0 1px 2px rgba(17,30,51,.1)}
.barfill{height:100%;border-radius:0 4px 4px 0;min-width:2px;background:linear-gradient(90deg, color-mix(in srgb,var(--pen) 70%, var(--viol)), var(--pen));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.barrow .vv{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
.barrow:hover .bartrack{border-color:var(--pen)}
.spark{width:100%;height:110px;overflow-x:auto}
.tablewrap{overflow-x:auto}
.rep{width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px}
.rep th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.rep td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;font-family:var(--f-read)}
.rep td.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.rep td .yours{color:var(--red)}
.rep td .right{color:var(--green)}
.empty{font-family:var(--f-read);font-size:14.5px;color:var(--ink-faint);padding:6px 0}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.step{flex:1;min-width:58px;border:1px solid var(--glass-brd);border-radius:10px;padding:9px 6px;text-align:center;background:var(--glass-3)}
.step .m{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.step .r{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.step.on{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.step.on .m{color:var(--green)}
.step.top{background:color-mix(in srgb,var(--mark) 22%,transparent);border-color:color-mix(in srgb,var(--mark) 62%,transparent)}
.step.top .m{color:var(--mark-deep)}

/* ---------- chuleta ---------- */
.drawer{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(10,16,26,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.drawer[hidden]{display:none!important}
.drawer-in{
  width:min(760px,100%);max-height:86vh;overflow-y:auto;
  background:var(--sheet);border:1px solid var(--glass-brd);border-bottom:none;
  animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both;
  border-radius:22px 22px 0 0;padding:24px 26px 36px;
  box-shadow:0 -20px 60px -26px rgba(0,0,0,.7), inset 0 1px 0 var(--glass-hi);
}
.drawer h3{font-size:21px;margin-bottom:4px}
.theory{display:grid;gap:14px;margin-top:14px}
.tblock{border-left:3px solid var(--mark);padding-left:14px}
.tblock h4{font-size:14px;font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;margin-bottom:5px}
.tblock p{font-family:var(--f-read);font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
.tblock code{font-family:var(--f-mono);font-size:13.5px;background:var(--glass-3);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;color:var(--ink)}
.trow{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 14px;font-size:14px;margin-top:6px}
.trow dt{font-family:var(--f-mono);font-size:13px;color:var(--pen);font-weight:500}
.trow dd{margin:0;font-family:var(--f-read);color:var(--ink-soft);font-size:14.5px}
.footnote{margin-top:34px;font-family:var(--f-read);font-size:13.5px;color:var(--ink-faint);line-height:1.5;text-align:center}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;
  background:var(--pop);color:var(--pop-ink);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--pop-brd);
  animation:popIn .28s cubic-bezier(.2,.9,.3,1.2) both;
  padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:0 18px 44px -18px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.2);
}
.toast[hidden]{display:none!important}

@media (max-width:640px){
  .matchgrid{grid-template-columns:1fr}
  .qcard{padding:20px 16px 18px 26px}
  .stem{font-size:16px}
  .brand-sub{display:none}
  .chip .lab{display:none}
  .barrow{grid-template-columns:minmax(74px,110px) 1fr 42px}
}
/* =====================================================================
   ANIMACIONES
   ===================================================================== */
@keyframes enterUp{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(8px)}62%{transform:scale(1.02) translateY(0)}100%{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(38px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes goodPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}
  55%{box-shadow:0 0 0 12px color-mix(in srgb,var(--green) 0%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}
@keyframes badPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}
  60%{box-shadow:0 0 0 11px color-mix(in srgb,var(--red) 0%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}
@keyframes bump{0%{transform:scale(1)}32%{transform:scale(1.22)}62%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes xpFly{
  0%{opacity:0;transform:translate(-50%,10px) scale(.85)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}
}
@keyframes tickIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes flameShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg) scale(1.14)}55%{transform:rotate(9deg) scale(1.14)}}
@keyframes sweep{from{background-position:-140% 0}to{background-position:240% 0}}

/* entrada de vistas y listas */
.qcard,.result,.hero,.panel{animation:enterUp .36s cubic-bezier(.2,.85,.3,1) both}
.unit,.ex,.tile,.mode{animation:enterUp .34s cubic-bezier(.2,.85,.3,1) both}
.opts .opt{animation:enterUp .3s cubic-bezier(.2,.85,.3,1) both}
.opts .opt:nth-child(1){animation-delay:.03s}
.opts .opt:nth-child(2){animation-delay:.07s}
.opts .opt:nth-child(3){animation-delay:.11s}
.opts .opt:nth-child(4){animation-delay:.15s}
.opts .opt:nth-child(n+5){animation-delay:.18s}

/* feedback */
.fb{animation:popIn .32s cubic-bezier(.2,.9,.3,1.15) both}
.fb-t{animation:tickIn .34s .06s cubic-bezier(.2,.9,.3,1.4) both}
.opt.ok,.mitem.done,.blank.ok,.answerline input.ok{animation:goodPulse .75s ease-out}
.opt.no,.blank.no,.answerline input.no{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97), badPulse .75s ease-out}
.mitem.sel{animation:bump .26s ease-out}
.mitem.done{animation:goodPulse .7s ease-out, popIn .3s cubic-bezier(.2,.9,.3,1.3)}

/* la tarjeta reacciona al resultado */
.qcard{transition:border-color .35s ease, box-shadow .35s ease}
.qcard.good{border-color:color-mix(in srgb,var(--green) 50%,var(--glass-brd));
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 34px -12px color-mix(in srgb,var(--green) 75%,transparent)}
.qcard.bad{border-color:color-mix(in srgb,var(--red) 50%,var(--glass-brd));
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 34px -12px color-mix(in srgb,var(--red) 75%,transparent)}
.qcard.bad .stem{animation:shakeX .45s cubic-bezier(.36,.07,.19,.97)}

/* barra superior viva */
.chip.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.3)}
.chip.streak.bump b{animation:flameShake .5s ease-in-out}
.xpfly{
  position:absolute;z-index:80;pointer-events:none;
  font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--mark-deep);
  text-shadow:0 2px 10px color-mix(in srgb,var(--mark) 60%,transparent);
  animation:xpFly 1.05s cubic-bezier(.2,.8,.3,1) forwards;
}
.xpfly.tok{color:var(--viol);text-shadow:0 2px 10px color-mix(in srgb,var(--viol) 55%,transparent)}

/* progreso con brillo al avanzar */
.track > i{position:relative;overflow:hidden}
.track > i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.75) 50%,transparent 80%);
  background-size:200% 100%;animation:sweep 2.4s ease-in-out .3s 1;
}
/* botones y elementos pulsables */
.btn,.opt,.mitem,.unit,.ex,.mode,.iconbtn,.tab{will-change:transform}
.btn:active,.iconbtn:active{transform:translateY(1px) scale(.985)}
.opt:active,.mitem:active{transform:scale(.985)}
.voc:active,.vrb:active{transform:scale(.94)}

/* ---------- selector de alumno ---------- */
.chip.who{padding:4px 10px 4px 5px;gap:7px;transition:background .14s ease,transform .14s ease}
.chip.who:hover{background:var(--glass-hi);transform:translateY(-1px)}
.chip.who[hidden]{display:none!important}
.av{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:12px;font-weight:800;color:var(--paper);background:var(--pen);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chip.who .swap{color:var(--ink-faint);font-size:12px}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:18px;max-width:620px;margin:26px auto 0}
.pick{
  position:relative;display:grid;justify-items:center;gap:5px;padding:30px 22px 24px;
  border-radius:20px;background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  animation:enterUp .4s cubic-bezier(.2,.85,.3,1) both;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.pick:hover{transform:translateY(-4px);background:var(--glass-hi);
  box-shadow:0 26px 56px -22px rgba(17,30,51,.55), inset 0 1px 0 var(--glass-hi)}
.pick:active{transform:translateY(-1px) scale(.99)}
.pick-av{
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;
  font-size:30px;font-weight:800;color:var(--paper);letter-spacing:-.02em;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 12px 26px -12px rgba(17,30,51,.7);
}
.pick-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pick-lv{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.pick-meta{font-family:var(--f-read);font-size:14px;color:var(--ink-soft);text-align:center;margin-top:6px}
.pick-xp{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--mark-deep);
  background:color-mix(in srgb,var(--mark) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 45%,transparent);
  padding:3px 10px;border-radius:99px;margin-top:8px}
.ladder{display:grid;gap:8px}
.rung{
  display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;
  padding:11px 14px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass-3);
}
.rung.done{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.rung.now{
  background:color-mix(in srgb,var(--mark) 16%,transparent);
  border-color:color-mix(in srgb,var(--mark) 55%,transparent);
  box-shadow:0 0 22px -10px color-mix(in srgb,var(--mark) 80%,transparent);
}
.rung.todo{opacity:.82}
.rung-dot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:700;
  background:var(--glass-2);border:1px solid var(--glass-brd);color:var(--ink-faint);
}
.rung.done .rung-dot{background:var(--green);border-color:transparent;color:var(--paper)}
.rung.now .rung-dot{background:var(--mark);border-color:transparent;color:#2a2000}
.rung-body{display:grid;gap:3px;min-width:0}
.rung-name{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rung-tag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mark-deep);background:color-mix(in srgb,var(--mark) 24%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 55%,transparent);padding:2px 7px;border-radius:99px;
}
.rung-need{font-family:var(--f-read);font-size:13px;color:var(--ink-soft)}
.rung-bar{display:block;height:7px;border-radius:99px;background:var(--glass-3);border:1px solid var(--glass-brd);overflow:hidden;margin-top:4px}
.rung-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mark),color-mix(in srgb,var(--mark) 60%,var(--pen)))}
.rung-left{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
.rung-left b{color:var(--mark-deep)}
.rung-xp{display:grid;justify-items:end;line-height:1.1}
.rung-xp b{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.rung-xp small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.pendchip{
  display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.04em;color:var(--mark-deep);vertical-align:middle;
  background:color-mix(in srgb,var(--mark) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--mark) 50%,transparent);
  padding:2px 8px;border-radius:99px;
}
.mode-resume{background:color-mix(in srgb,var(--mark) 12%,transparent)}
.mode-resume .mode-ico{background:color-mix(in srgb,var(--mark) 24%,transparent);color:var(--mark-deep);font-size:15px}
.resume-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cloudchip{font-size:15px;padding:0 4px;cursor:default;line-height:34px}
.teacherlink{

<script>
/* =====================================================================
   CUADERNO ARCADE — motor
   Plataforma de inglés — una unidad por alumno, con corrección automática.
   ===================================================================== */

/* ---------- corrección ---------- */
function expand(t){
  let m = t.match(/\{([^{}]*)\}/);
  if(m){
    const pre=t.slice(0,m.index), post=t.slice(m.index+m[0].length);
    return m[1].split("|").flatMap(o=>expand(pre+o+post));
  }
  m = t.match(/\[([^\[\]]*)\]/);
  if(m){
    const pre=t.slice(0,m.index), post=t.slice(m.index+m[0].length);
    return expand(pre+m[1]+post).concat(expand(pre+post));
  }
  return [t];
}
function norm(s){
  return (s||"")
    .replace(/[‘’ʼ´`]/g,"'")
    .toLowerCase()
    .replace(/['’]/g,"")
    .replace(/[.,!?;:"“”()¡¿]/g,"")
    .replace(/[–—-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function accepts(tpls, lead){
  const out=new Set();
  tpls.forEach(t=>expand(t).forEach(v=>{
    out.add(norm(v));
    if(lead) out.add(norm(lead+" "+v));
  }));
  return out;
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>3) return 9;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function judge(input, tpls, lead){
  const set=accepts(tpls,lead), v=norm(input);
  if(!v) return "empty";
  if(set.has(v)) return "ok";
  for(const s of set){ if(lev(v,s)<=2) return "near"; }
  return "no";
}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fecha(ts){const d=new Date(ts);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}


/* =====================================================================
   PERFILES
   ===================================================================== */
const PROFILES=[
  {id:"alvaro", name:"Álvaro", level:"6.º de Primaria", initial:"Á", hue:"var(--pen)"},
  {id:"marcos", name:"Marcos", level:"3.º de ESO",      initial:"M", hue:"var(--viol)"}
];
/* Acceso con Firebase Authentication. La contraseña la comprueba el servidor
   de Firebase; aquí no hay ninguna guardada.
   Cada alumno es una cuenta con correo interno <id>@cuaderno.local (no es un
   buzón real, solo un identificador). El profesor entra con su correo real. */
const AUTH_DOMAIN="@cuaderno.local";
const TEACHER={id:"profe", name:"Profesor", level:"Panel del profe", initial:"P", hue:"var(--green)"};
function studentFromEmail(email){
  const m=String(email||"").toLowerCase().match(/^([a-z0-9]+)@cuaderno\.local$/);
  return m && PROFILES.some(p=>p.id===m[1]) ? m[1] : null;
}
function authMsg(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Esa no es. Vuelve a intentarlo.";
  if(/too-many-requests/.test(c)) return "Demasiados intentos. Espera unos minutos.";
  if(/network/.test(c)) return "No hay conexión a internet.";
  if(/operation-not-allowed|configuration-not-found/.test(c)) return "El acceso con contraseña no está activado en Firebase todavía.";
  return "No se ha podido entrar ("+(c||"error")+").";
}

const UNITS = ALL_UNITS;

const INDEX={};
UNITS.forEach(u=>u.exercises.forEach(ex=>{
  ex.unit=u; ex.id=u.id+"e"+ex.n;
  ex.items.forEach((it,i)=>{ it.id=ex.id+"i"+i; it.ex=ex; INDEX[it.id]=it; });
}));
const ALL_ITEMS=Object.values(INDEX);
const SELFMARK_MAX=2;

let PROFILE=null;
function profileOf(id){ return (id==="profe"?TEACHER:null)||PROFILES.find(p=>p.id===id)||null; }
function me(){ return profileOf(PROFILE); }
function myUnits(){ return UNITS.filter(u=>u.owner===PROFILE); }

const TKEY="cuaderno-arcade-theme";
const LASTKEY="cuaderno-arcade-last";
function skey(){ return "cuaderno-arcade-v3-"+PROFILE; }
function blank(){
  return {xp:0, tokens:3, lvl:0, ex:{}, wrong:[], resume:{},
    stats:{answers:0, correct:0, bestStreak:0, bestMult:1, saves:0, tokensSpent:0,
           byUnit:{}, sessions:[], selfmarks:[]}};
}
let S=blank();
function hydrate(o){
  const b=blank();
  return Object.assign(b, o, {stats:Object.assign(b.stats, (o&&o.stats)||{})});
}
function useProfile(id){
  PROFILE=id;
  S=blank();
  try{
    const raw=localStorage.getItem(skey());
    if(raw) S=hydrate(JSON.parse(raw));
  }catch(e){}
  try{ localStorage.setItem(LASTKEY, id); }catch(e){}
  paintWho();
  syncDown(id);
}
function saveLocal(){ if(!PROFILE) return; try{ localStorage.setItem(skey(), JSON.stringify(S)); }catch(e){} }
function save(){
  if(!PROFILE) return;
  S.updatedAt=Date.now();
  saveLocal();
  schedulePush();
}

/* ---------- nube ---------- */
let cloudState="…", pushT=null;
function setCloud(st){
  cloudState=st;
  const c=document.getElementById("cloudchip"); if(!c) return;
  c.hidden=!PROFILE || view.name==="profiles";
  const map={ok:["☁︎","Guardado en la nube","var(--green)"],
              wait:["⟳","Guardando…","var(--ink-faint)"],
              off:["⚠","Sin conexión: se guardará al volver","var(--mark-deep)"],
              deny:["🔒","Sin permiso para guardar: cierra sesión y vuelve a entrar","var(--red)"],
              none:["☁︎","Solo en este dispositivo","var(--ink-faint)"]};
  const [ico,title,col]=map[st]||map.none;
  c.textContent=ico; c.title=title; c.style.color=col;
}
async function syncDown(id){
  if(!window.CLOUD) return setCloud("none");
  setCloud("wait");
  try{
    const remote=await CLOUD.load(id);
    if(PROFILE!==id) return;
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
      S=hydrate(remote); saveLocal(); setCloud("ok");
      if(view.name!=="play") render();
      toast("Progreso recuperado de la nube");
    } else if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)){
      await pushUp();
    } else setCloud("ok");
  }catch(e){ setCloud(e&&e.code==="permission-denied"?"deny":"off"); }
}
function schedulePush(){
  if(!window.CLOUD) return setCloud("none");
  setCloud("wait");
  clearTimeout(pushT);
  pushT=setTimeout(pushUp, 1500);
}
async function pushUp(){
  if(!window.CLOUD || !PROFILE) return;
  clearTimeout(pushT);
  try{ await CLOUD.save(PROFILE, JSON.parse(JSON.stringify(S))); setCloud("ok"); }
  catch(e){ setCloud(e&&e.code==="permission-denied"?"deny":"off"); }
}
window.addEventListener("cloud-ready",()=>{ if(PROFILE) syncDown(PROFILE); else setCloud("none"); });

function paintWho(){
  const btn=document.getElementById("whobtn"), p=me();
  const sub=document.querySelector(".brand-sub");
  if(!p){ btn.hidden=true; if(sub) sub.textContent="Elige alumno"; return; }
  btn.hidden=false;
  document.getElementById("who-av").textContent=p.initial;
  document.getElementById("who-av").style.background=p.hue;
  document.getElementById("who-name").textContent=p.name;
  if(sub) sub.textContent=p.level;
}

const LEVELS=[
  {xp:0,name:"Rookie"},{xp:250,name:"A2 Explorer"},{xp:600,name:"B1 Runner"},
  {xp:1100,name:"B1+ Sniper"},{xp:1800,name:"B2 Boss"},{xp:2600,name:"Grammar Legend"}
];
function levelIdx(xp){let i=0;for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k].xp) i=k;return i;}
function levelOf(xp){
  const i=levelIdx(xp), cur=LEVELS[i], nxt=LEVELS[i+1];
  return {i,name:cur.name,cur,nxt,pct:nxt?Math.round((xp-cur.xp)/(nxt.xp-cur.xp)*100):100};
}
/* multiplicador de racha: ×1.0 sin racha, ×1.1 a partir de 2 aciertos, tope ×2.0 */
function multOf(streak){ return streak<2 ? 1 : Math.min(2, 1+0.1*(streak-1)); }
function fmtMult(m){ return "×"+m.toFixed(1); }

function addXP(base, mult){
  const g=Math.round(base*mult);
  S.xp+=g;
  const nl=levelIdx(S.xp);
  const up=nl>S.lvl?2*(nl-S.lvl):0;
  if(up){ S.tokens+=up; S.lvl=nl; toast("¡Nivel "+LEVELS[nl].name+"! +"+up+" 🎟️"); }
  setTimeout(()=>{
    if(g) flyXP("+"+g+" XP");
    bumpChip(".chip.xp");
    if(up){ bumpChip(".chip.tok"); setTimeout(()=>flyXP("+"+up+" 🎟️","tok"),240); }
  },0);
  return g;
}

function toast(msg){
  toastEl.textContent=msg; toastEl.hidden=false;
  toastEl.style.animation="none"; void toastEl.offsetWidth; toastEl.style.animation="";
  clearTimeout(tHandle); tHandle=setTimeout(()=>toastEl.hidden=true,2800);

/* ---------- microanimaciones ---------- */
function bumpChip(sel){
  const el=document.querySelector(sel); if(!el) return;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  setTimeout(()=>el.classList.remove("bump"),600);
}
function flyXP(text,cls){
  const chip=document.querySelector(cls==="tok"?".chip.tok":".chip.xp"); if(!chip) return;
  const r=chip.getBoundingClientRect();
  const d=document.createElement("div");
  d.className="xpfly"+(cls?" "+cls:"");
  d.textContent=text;
  d.style.left=(r.left+window.scrollX+r.width/2)+"px";
  d.style.top=(r.bottom+window.scrollY+2)+"px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1150);
}
function reactCard(ok){
  const qc=document.getElementById("qcard"); if(!qc) return;
  qc.classList.remove("good","bad"); void qc.offsetWidth;
  qc.classList.add(ok?"good":"bad");
}
function syncTop(){
  const xpc=document.querySelector(".chip.xp"), tkc=document.querySelector(".chip.tok");
  const on=!!PROFILE && view.name!=="profiles";
  xpc.hidden=!on; tkc.hidden=!on;
  document.getElementById("statsbtn").hidden=!on;
  document.getElementById("whobtn").hidden=!on;
  const cc=document.getElementById("cloudchip"); if(cc){ cc.hidden=!on; if(on) setCloud(cloudState); }
  const sub=document.querySelector(".brand-sub");
  if(sub && !on) sub.textContent="Elige alumno";
  document.getElementById("s-xp").textContent=S.xp;
  document.getElementById("s-tok").textContent=S.tokens;
  const sc=document.getElementById("s-streak-chip"), mc=document.getElementById("s-mult-chip");
  if(run && run.streak>=1){ sc.hidden=false; document.getElementById("s-streak").textContent=run.streak; }
  else sc.hidden=true;
  if(run){ mc.hidden=false; document.getElementById("s-mult").textContent=fmtMult(multOf(run.streak+1)); }
  else mc.hidden=true;
}
function go(v){ view=v; glossEl.hidden=true; render(); window.scrollTo({top:0,behavior:"instant"}); }
function render(){
  syncTop();
  if(view.name==="teacher") return renderTeacher();
  if(view.name==="resume" && PROFILE) return renderResume();
  if(view.name==="profiles" || !PROFILE) return renderProfiles();
  if(view.name==="home") return renderHome();
  if(view.name==="unit") return renderUnit(view.unit);
  if(view.name==="play") return renderPlay();
  if(view.name==="done") return renderDone();
  if(view.name==="stats") return renderStats();
}

  if(!d){ try{ const raw=localStorage.getItem("cuaderno-arcade-v3-"+id); if(raw) d=JSON.parse(raw); }catch(e){} }

function statsFor(p, d){
  const units=UNITS.filter(u=>u.owner===p.id);
  const items=units.flatMap(u=>u.exercises.flatMap(e=>e.items));
  const ok=d?items.filter(i=>d.ex[i.id]==="ok").length:0;
  const levels={};
  units.forEach(u=>u.exercises.forEach(e=>{
    const L=e.lvl||1;
    levels[L]=levels[L]||{ok:0,tot:0};
    e.items.forEach(i=>{ levels[L].tot++; if(d&&d.ex[i.id]==="ok") levels[L].ok++; });
  }));
  const acc=d&&d.stats.answers?Math.round(d.stats.correct/d.stats.answers*100):0;
  const wrong=(d?d.wrong:[]).map(id=>INDEX[id]).filter(Boolean);
  return {units, items, ok, levels, acc, wrong, d};
}

/* =====================================================================
   PARTIDA
   ===================================================================== */
/* ---------- rondas a medias ----------
   Cada ronda tiene una clave (un ejercicio, una unidad entera, el examen o el
   repaso de fallos) y, tras cada pregunta contestada, se guarda por dónde va.
   Se guarda junto al resto del progreso, así que también viaja a la nube. */
function roundKey(m){
  if(m.key!==undefined) return m.key;
  return m.exam?"exam":m.review?"wrong":m.ex?"ex:"+m.ex.id:m.unit?"unit:"+m.unit.id:null;
}
function metaToStore(m){
  return {title:m.title||"", unit:m.unit?m.unit.id:null, ex:m.ex?m.ex.id:null, exam:!!m.exam, review:!!m.review};
}
function metaFromStore(s){
  const unit=s.unit?UNITS.find(u=>u.id===s.unit):null;
  let ex=null;
  if(s.ex) UNITS.forEach(u=>u.exercises.forEach(e=>{ if(e.id===s.ex) ex=e; }));
  return {title:s.title, unit, ex, exam:s.exam||undefined, review:s.review||undefined};
}
function saveResume(){
  if(!run) return;
  const key=roundKey(run.meta); if(!key) return;
  S.resume=S.resume||{};
  S.resume[key]={at:Date.now(), ids:run.items.map(x=>x.id), i:run.i+1,
    correct:run.correct, xp:run.xp||0, streak:run.streak, best:run.best, bestMult:run.bestMult,
    selfUsed:run.selfUsed, saves:run.saves,
    misses:run.misses.map(m=>({id:m.it.id,given:m.given,model:m.model})),
    meta:metaToStore(run.meta)};
  /* como mucho 8 rondas guardadas: se descartan las más antiguas */
  const keys=Object.keys(S.resume).sort((a,b)=>S.resume[b].at-S.resume[a].at);
  keys.slice(8).forEach(k=>delete S.resume[k]);
}
function clearResume(key){ if(key && S.resume && S.resume[key]){ delete S.resume[key]; } }
/* una ronda guardada solo vale si todas sus preguntas siguen existiendo */
function resumeValid(r){ return !!r && Array.isArray(r.ids) && r.ids.length && r.ids.every(id=>INDEX[id]); }
function pendingList(){
  return Object.keys(S.resume||{}).filter(k=>resumeValid(S.resume[k]))
    .map(k=>Object.assign({key:k},S.resume[k]))
    .sort((a,b)=>b.at-a.at);
}
function resumeRun(key){
  const r=S.resume&&S.resume[key];
  if(!resumeValid(r)){ clearResume(key); save(); return false; }
  const items=r.ids.map(id=>INDEX[id]);
  run={items, i:Math.min(r.i,items.length), correct:r.correct||0, xp:r.xp||0, streak:r.streak||0,
       best:r.best||0, bestMult:r.bestMult||1, selfUsed:r.selfUsed||0, saves:r.saves||0,
       misses:(r.misses||[]).map(m=>({it:INDEX[m.id],given:m.given,model:m.model})).filter(m=>m.it),
       answered:false, meta:metaFromStore(r.meta||{}), t0:Date.now()};
  go({name:run.i>=items.length?"done":"play"});
  return true;
}

function startRun(items,meta){
  meta=meta||{};
  const key=roundKey(meta);
  /* si esa ronda estaba a medias, se pregunta antes de empezar de cero */
  if(key && !meta.fresh && resumeValid(S.resume&&S.resume[key])){
    go({name:"resume", key, items, meta});
    return;
  }
  if(key) clearResume(key);
  run={items:items.slice(),i:0,correct:0,xp:0,streak:0,best:0,bestMult:1,misses:[],
       answered:false,selfUsed:0,saves:0,meta:meta,t0:Date.now()};
  go({name:"play"});
}
function renderResume(){
  const {key,items,meta}=view, r=S.resume[key];
  const total=r.ids.length, doneN=Math.min(r.i,total), finished=r.i>=total;
  app.innerHTML=`
  <section class="hero" style="padding:44px 0 6px;text-align:center;justify-items:center">
    <div class="eyebrow">Ronda a medias</div>
    <h1 style="font-size:clamp(24px,4.2vw,34px)">${esc(r.meta.title||"Tu ronda")}</h1>
    <p class="lede" style="margin:0 auto">${finished
      ?"Ya contestaste todas las preguntas. Puedes ver cómo te salió."
      :"La dejaste en la pregunta "+(doneN+1)+" de "+total+"."}</p>
  </section>
  <div class="lockbox" style="max-width:420px">
    <div class="track" style="width:100%"><i style="width:${Math.round(doneN/total*100)}%"></i></div>
    <div class="resume-meta">
      <span class="chip">${doneN} / ${total}</span>
      <span class="chip">Aciertos <b>${r.correct}</b></span>
      <span class="chip streak">🔥 <b>${r.streak}</b></span>
    </div>
    <div class="lockacts">
      <button class="btn" id="res-go">${finished?"Ver resultados":"Continuar"}</button>
      <button class="btn ghost" id="res-new">Empezar de nuevo</button>
    </div>
    <button class="back" id="res-back" style="margin-top:2px">← Volver</button>
  </div>`;
  document.getElementById("res-go").onclick=()=>resumeRun(key);
  document.getElementById("res-new").onclick=()=>{
    clearResume(key); save();
    startRun(items, Object.assign({}, meta, {fresh:true}));
  };
  document.getElementById("res-back").onclick=()=>{ meta.unit?go({name:"unit",unit:meta.unit}):go({name:"home"}); };
}
function startExam(){
  const pool=myItems();
  if(!pool.length){ toast("Aún no hay preguntas para "+me().name+"."); return; }
  startRun(shuffle(pool).slice(0,Math.min(20,pool.length)),{title:"Examen mixto",exam:true});
}
function startWrong(){
  const items=S.wrong.map(id=>INDEX[id]).filter(Boolean);
  startRun(shuffle(items).slice(0,20),{title:"Repaso de fallos",review:true});
}
function typeBadge(it){
  if(it.t==="choice") return "Elige";
  if(it.t==="match") return "Relaciona";
  if(it.t==="fill") return "Completa";
  if(it.tr) return "Traduce";
  return "Escribe";
}
function renderPlay(){
  const m=run.meta;
  app.innerHTML=`
  <button class="back" id="back">← Salir</button>
  <div class="playhead">
    <div class="track"><i style="width:${run.i/run.items.length*100}%"></i></div>
    <span class="qcount">${run.i+1} / ${run.items.length}</span>

  <div class="qcard" id="qcard"></div>`;
  document.getElementById("back").onclick=()=>{ m.unit?go({name:"unit",unit:m.unit}):go({name:"home"}); };

}

  const ingOf=b=>/[^e]e$/.test(b)?b.slice(0,-1)+"ing":b+"ing";
  const edOf=b=>/e$/.test(b)?b+"d":(/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ied":b+"ed");
  VERB_SRC.forEach(src=>{
    const [base,es,v2,v3,extra]=src.split("|");
    const past=v2||edOf(base), pp=v3||edOf(base);
    const v={base,es,past,pp};
    VERBS[base]=v;
    const set=new Set([base,thirdOf(base),ingOf(base),edOf(base)]);
    past.split(" / ").forEach(x=>set.add(x.trim()));
    pp.split(" / ").forEach(x=>set.add(x.trim()));
    (extra||"").split(",").forEach(x=>{ x=x.trim(); if(x) set.add(x); });
    set.forEach(f=>{ if(f&&!VERB_FORMS[f]) VERB_FORMS[f]=v; });
  });

function verbLookup(w){
  const k=w.toLowerCase().replace(/[’']/g,"'");
  if(NO_GLOSS.has(k)||GLOSSARY[k]) return null;
  return VERB_FORMS[k]||null;
}
function verbRole(v,form){
  const f=form.toLowerCase();
  if(f===v.base) return "infinitivo / presente";
  if(v.past.split(" / ").some(x=>x.trim()===f)) return "pasado simple";
  if(v.pp.split(" / ").some(x=>x.trim()===f)) return "participio";
  if(/ing$/.test(f)) return "gerundio (-ing)";
  if(/n't$/.test(f)) return "negativa";
  if(/s$/.test(f)) return "3.ª persona del singular";
  return "forma del verbo";
}
function glossLookup(w){
  const k=w.toLowerCase().replace(/[’']s$/,"");
  if(NO_GLOSS.has(k)) return null;
  if(GLOSSARY[k]) return GLOSSARY[k];
  if(/ies$/.test(k)&&GLOSSARY[k.slice(0,-3)+"y"]) return GLOSSARY[k.slice(0,-3)+"y"];
  if(/(ches|shes|sses|xes)$/.test(k)&&GLOSSARY[k.slice(0,-2)]) return GLOSSARY[k.slice(0,-2)];
  if(/s$/.test(k)&&GLOSSARY[k.slice(0,-1)]) return GLOSSARY[k.slice(0,-1)];
  return null;
}

   tienen traducción. Devuelve HTML listo para insertar. */

  const own={}; if(itemGloss) Object.keys(itemGloss).forEach(k=>own[k.toLowerCase()]=itemGloss[k]);
  const re=/[A-Za-z][A-Za-z'’-]*/g;
  let out="", last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const w=m[0], k=w.toLowerCase();
    const tr=own[k]||(useGlobal?glossLookup(k):null);
    const vb=(!tr&&useGlobal)?verbLookup(k):null;
    if(tr){
      out+=`<button type="button" class="voc" data-t="${esc(tr).replace(/"/g,"&quot;")}">${esc(w)}</button>`;
    } else if(vb){
      out+=`<button type="button" class="vrb" data-v="${esc(vb.base)}" data-f="${esc(k)}">${esc(w)}</button>`;
    } else {
      out+=esc(w);
    }
    last=m.index+w.length;
  }
  return out+esc(text.slice(last));
}
function bindGloss(card){
  card.querySelectorAll(".voc, .vrb").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    card.querySelectorAll(".open").forEach(x=>x.classList.remove("open"));
    b.classList.add("open");
    const isVerb=b.classList.contains("vrb");
    if(isVerb){
      const v=VERBS[b.dataset.v], f=b.dataset.f;
      glossEl.className="gloss verb";
      glossEl.innerHTML=`<b>to ${esc(v.base)}</b>${esc(v.es)}
        <div class="vrole">${esc(b.textContent)} · ${esc(verbRole(v,f))}</div>
        <div class="vgrid">
          <span class="vh">Infinitivo</span><span class="vh">Pasado</span><span class="vh">Participio</span>
          <span class="vf ${f===v.base?"cur":""}">${esc(v.base)}</span>
          <span class="vf ${v.past.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.past)}</span>
          <span class="vf ${v.pp.split(" / ").some(x=>x.trim()===f)?"cur":""}">${esc(v.pp)}</span>
        </div>`;
    } else {
      glossEl.className="gloss";
      glossEl.innerHTML=`<b>${esc(b.textContent)}</b>${esc(b.dataset.t||"")}`;
    }
    glossEl.hidden=false;
    const r=b.getBoundingClientRect();
    const w=Math.min(isVerb?300:250, glossEl.offsetWidth||(isVerb?300:250));
    let left=r.left+window.scrollX+r.width/2-w/2;
    left=Math.max(10, Math.min(left, window.innerWidth-w-14));
    glossEl.style.left=left+"px";
    glossEl.style.top=(r.bottom+window.scrollY+8)+"px";
  });
}
document.addEventListener("click",()=>{ glossEl.hidden=true; document.querySelectorAll(".voc.open, .vrb.open").forEach(x=>x.classList.remove("open")); });

function paintQuestion(it){
  const card=document.getElementById("qcard"), ex=it.ex;
  let body="";
  const stemHTML=t=>wrapGloss(t, it.gloss, !it.tr);

  if(it.t==="choice"){
    body=`<div class="stem">${stemHTML(it.q).replace(/___/g,'<span style="color:var(--ink-faint)">______</span>')}</div>
    <div class="opts ${it.opts.length>4?"bank":""}" id="opts">
      ${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}
    </div>`;
  } else if(it.t==="fill"){
    let n=0;
    const stem=stemHTML(it.q).replace(/___/g,()=>`<input class="blank" data-b="${n++}" autocomplete="off" autocapitalize="off" spellcheck="false">`);
    body=`<div class="stem">${stem}</div>
      ${it.hint?`<div style="margin-top:12px" class="instr">Pista: <span class="hint" style="font-family:var(--f-mono)">${esc(it.hint)}</span></div>`:""}
      ${ex.bank?`<div class="instr" style="margin-top:6px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:""}`;
  } else if(it.t==="write"){
    body=`<div class="stem">${stemHTML(it.q)}</div>
      ${ex.bank?`<div class="instr" style="margin-top:10px">Banco: <span style="font-family:var(--f-mono);color:var(--ink)">${ex.bank.join(" · ")}</span></div>`:""}
      <div class="answerline">
        ${it.lead?`<div class="stem lead" style="font-size:15px">${esc(it.lead)} …</div>`:""}
        <input id="wr" placeholder="${it.tr?"Escribe la frase en inglés":"Escribe la frase completa"}" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>`;
  } else if(it.t==="match"){
    const left=it.pairs.map((p,i)=>({txt:p[0],i}));
    const right=shuffle(it.pairs.map((p,i)=>({txt:p[1],i})));
    body=`<div class="stem" style="font-size:16px">${esc(it.q)}</div>
    <div class="matchgrid">
      <div class="mcol">${left.map(o=>`<button class="mitem" data-side="L" data-i="${o.i}"><span class="tag">${o.i+1}</span>${esc(o.txt)}</button>`).join("")}</div>
      <div class="mcol">${right.map(o=>`<button class="mitem" data-side="R" data-i="${o.i}">${esc(o.txt)}</button>`).join("")}</div>
    </div>`;
  }

  card.innerHTML=`
    <div class="qtag">
      <span class="badge">${typeBadge(it)}</span>
      <span class="badge">${ex.unit.short} · N${ex.lvl||1} · Ej. ${ex.no||ex.n}</span>
      <span class="instr">${esc(ex.instr)}</span>
    </div>
    ${body}
    ${(body.indexOf('class="voc"')>=0||body.indexOf('class="vrb"')>=0)?`<div class="vochelp">Toca las palabras subrayadas: <span class="lg-n">azul</span> = sustantivos y adjetivos, <span class="lg-v">rojo</span> = verbos con sus tres columnas.</div>`:""}
    <div id="fbslot"></div>
    <div class="qfoot">
      <button class="btn" id="check">Comprobar</button>
      <button class="btn ghost" id="skip">Ver la respuesta</button>
      <span class="spacer"></span>
      <button class="btn ghost small" id="cheat">📖 Chuleta</button>
      <span class="kbd">Enter</span>
    </div>`;

  bindGloss(card);
  document.getElementById("cheat").onclick=e=>{e.stopPropagation();openTheory(ex.unit);};
  const checkBtn=document.getElementById("check");
  run.answered=false;

  if(it.t==="choice"){
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>resolveChoice(it,+b.dataset.i));
    checkBtn.disabled=true; checkBtn.style.opacity=".45";
  }
  if(it.t==="fill"){
    const first=card.querySelector(".blank"); if(first) first.focus();
    card.querySelectorAll(".blank").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}}));
    checkBtn.onclick=()=>resolveFill(it);
  }
  if(it.t==="write"){
    const inp=document.getElementById("wr"); inp.focus();
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onEnter();}});
    checkBtn.onclick=()=>resolveWrite(it);
  }
  if(it.t==="match"){ setupMatch(it,card); checkBtn.disabled=true; checkBtn.style.opacity=".45"; }
  document.getElementById("skip").onclick=()=>reveal(it);
}
function onEnter(){
  if(run.answered){ const n=document.getElementById("next"); if(n) n.click(); return; }
  const b=document.getElementById("check");
  if(b&&!b.disabled) b.click();
}
document.addEventListener("keydown",e=>{
  if(view.name!=="play"||!drawer.hidden) return;
  if(e.key==="Enter"&&run&&run.answered){ e.preventDefault(); const n=document.getElementById("next"); if(n) n.click(); }
});

/* ---------- resolución ---------- */
function resolveChoice(it,pick){
  const opts=[...document.querySelectorAll(".opt")];
  const ok=it.a.includes(pick);
  opts.forEach(b=>b.disabled=true);
  opts[pick].classList.add(ok?"ok":"no");
  if(!ok) opts[it.a[0]].classList.add("ok");
  finish(it,ok,it.opts[it.a[0]],it.opts[pick],false,false);
}
function resolveFill(it){
  const inputs=[...document.querySelectorAll(".blank")];
  let allOk=true, near=false;
  inputs.forEach((inp,k)=>{
    const r=judge(inp.value,it.a[k]);
    if(r==="ok") inp.classList.add("ok");
    else { inp.classList.add("no"); allOk=false; if(r==="near") near=true; }
    inp.disabled=true;
  });
  const model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  finish(it,allOk,model,inputs.map(i=>i.value).join(" / "),near&&!allOk,false);
}
function resolveWrite(it){
  const inp=document.getElementById("wr");
  const r=judge(inp.value,it.a,it.lead);
  const ok=r==="ok";
  inp.classList.add(ok?"ok":"no"); inp.disabled=true;
  const model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
  finish(it,ok,model,inp.value,r==="near",!ok);
}
function setupMatch(it,card){
  let sel=null,errs=0,left=it.pairs.length;
  card.querySelectorAll(".mitem").forEach(b=>b.onclick=()=>{
    if(!sel){ sel=b; b.classList.add("sel"); return; }
    if(sel===b){ b.classList.remove("sel"); sel=null; return; }
    if(sel.dataset.side===b.dataset.side){ sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
    if(sel.dataset.i===b.dataset.i){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done");
      sel=null; left--;
      if(left===0) finish(it,errs===0,"Todas emparejadas",errs+" fallo(s) por el camino",false,false);
    } else {
      errs++; b.classList.add("shake"); sel.classList.add("shake");
      const a=sel; setTimeout(()=>{a.classList.remove("shake","sel");b.classList.remove("shake");},320);
      sel=null;
    }
  });
}
function reveal(it){
  if(run.answered) return;
  let model="";
  if(it.t==="choice"){
    const opts=[...document.querySelectorAll(".opt")];
    opts.forEach(b=>b.disabled=true); opts[it.a[0]].classList.add("ok");
    model=it.opts[it.a[0]];
  } else if(it.t==="fill"){
    [...document.querySelectorAll(".blank")].forEach((inp,k)=>{ inp.value=expand(it.a[k][0])[0]; inp.classList.add("ok"); inp.disabled=true; });
    model=it.a.map(t=>expand(t[0])[0]).join(" / ");
  } else if(it.t==="write"){
    const inp=document.getElementById("wr");
    model=(it.lead?it.lead+" ":"")+expand(it.a[0])[0];
    inp.value=model; inp.classList.add("ok"); inp.disabled=true;
  } else if(it.t==="match"){
    document.querySelectorAll(".mitem").forEach(b=>b.classList.add("done"));
    model=it.pairs.map((p,i)=>(i+1)+" → "+p[1]).join(" · ");
  }
  finish(it,false,model,"",false,false,true);
}

/* ---------- ¿puede autocorregirse? ---------- */
function canSelfMark(given,model){
  const g=norm(given).split(" ").filter(Boolean);
  const m=norm(model).split(" ").filter(Boolean);
  if(g.length<2) return false;
  return g.length>=Math.max(3,Math.ceil(m.length*0.6));
}

/* ---------- feedback ---------- */
function finish(it,ok,model,given,near,selfmarkable,revealed){
  run.answered=true;
  const slot=document.getElementById("fbslot"), foot=document.querySelector(".qfoot");
  const prevStreak=run.streak;
  let gained=0, mult=1;

  S.stats.answers++;
  const uid=it.ex.unit.id;
  S.stats.byUnit[uid]=S.stats.byUnit[uid]||{ok:0,ko:0};

  if(ok){
    run.correct++; run.streak++; run.best=Math.max(run.best,run.streak);
    mult=multOf(run.streak);
    run.bestMult=Math.max(run.bestMult,mult);
    S.stats.bestStreak=Math.max(S.stats.bestStreak,run.streak);
    S.stats.bestMult=Math.max(S.stats.bestMult,mult);
    S.stats.correct++; S.stats.byUnit[uid].ok++;
    gained=addXP(10,mult); run.xp=(run.xp||0)+gained;
    S.ex[it.id]="ok";
    S.wrong=S.wrong.filter(x=>x!==it.id);
  } else {
    run.streak=0;
    S.stats.byUnit[uid].ko++;
    run.misses.push({it,given:revealed?"(sin responder)":given,model});
    if(S.ex[it.id]!=="ok") S.ex[it.id]="ko";
    if(!S.wrong.includes(it.id)) S.wrong.push(it.id);
  }
  saveResume();
  save(); syncTop();
  reactCard(ok);
  if(ok&&run.streak>=2) bumpChip(".chip.streak");

  const cls=ok?"good":(near?"near":"bad");
  const title=ok?(run.streak>=2?"¡Correcto! Racha de "+run.streak:"¡Correcto!")
    :near?"¡Casi! Revisa la ortografía"
    :revealed?"Respuesta modelo":"No es esa";

  const canSave = !ok && !revealed && prevStreak>=2 && S.tokens>0;
  const selfOK  = selfmarkable && !revealed && canSelfMark(given,model) && run.selfUsed<SELFMARK_MAX;
  let selfNote="";
  if(selfmarkable && !revealed && !selfOK){
    if(run.selfUsed>=SELFMARK_MAX) selfNote="Ya has usado las "+SELFMARK_MAX+" autocorrecciones de esta ronda.";
    else selfNote="La autocorrección necesita una respuesta completa, no una palabra suelta.";
  }

  slot.innerHTML=`<div class="fb ${cls}">
    <div class="fb-t">${ok?"✓":(near?"≈":"✕")} ${title}
      ${gained?`<span class="xpgain">+${gained} XP ${mult>1?"("+fmtMult(mult)+")":""}</span>`:""}</div>
    ${ok?"":`<div class="fb-sol"><b>Solución:</b> ${esc(model)}</div>`}
    ${it.why?`<div class="fb-why">${it.why}</div>`:""}
    ${(canSave||selfOK||selfNote)?`<div class="fb-acts">
      ${canSave?`<button class="btn tok small" id="usetok">🎟️ Salvar la racha de ${prevStreak} (1 token)</button>`:""}
      ${selfOK?`<button class="btn ghost small" id="selfok">Mi frase también vale ✓ (${SELFMARK_MAX-run.selfUsed} restante${SELFMARK_MAX-run.selfUsed===1?"":"s"})</button>`:""}
      ${selfNote?`<span class="fb-note">${selfNote}</span>`:""}
    </div>`:""}
  </div>`;

  foot.innerHTML=`<button class="btn" id="next">${run.i+1<run.items.length?"Siguiente →":"Ver resultados →"}</button>
    <span class="spacer"></span>
    <button class="btn ghost small" id="cheat2">📖 Chuleta</button>
    <span class="kbd">Enter</span>`;
  document.getElementById("cheat2").onclick=e=>{e.stopPropagation();openTheory(it.ex.unit);};
  document.getElementById("next").onclick=()=>{
    run.i++;
    if(run.i>=run.items.length) go({name:"done"}); else renderPlay();
  };
  document.getElementById("next").focus();

  const tk=document.getElementById("usetok");
  if(tk) tk.onclick=()=>{
    if(S.tokens<=0) return;
    S.tokens--; S.stats.tokensSpent++; S.stats.saves++;
    run.streak=prevStreak; run.saves++;
    tk.disabled=true; tk.textContent="Racha salvada 🎟️ ("+prevStreak+")";
    save(); syncTop();
    bumpChip(".chip.tok"); bumpChip(".chip.streak"); flyXP("−1 🎟️","tok");
    reactCard(true);
    toast("Racha restaurada: "+prevStreak+" · multiplicador "+fmtMult(multOf(prevStreak+1)));
  };

  const sb=document.getElementById("selfok");
  if(sb) sb.onclick=()=>{
    sb.disabled=true; sb.textContent="Anotada en el informe ✓";
    run.selfUsed++; run.correct++;
    S.ex[it.id]="self";
    S.stats.selfmarks.push({ts:Date.now(),unit:it.ex.unit.short,unitTitle:it.ex.unit.title,
      exN:it.ex.n,exTitle:it.ex.title,q:it.q.replace(/\n/g," "),given:given,model:model});
    run.misses=run.misses.filter(m=>m.it!==it);
    run.xp=(run.xp||0)+addXP(5,1); saveResume(); save(); syncTop();
    toast("Cuenta como acierto, pero queda anotada para que la revise tu profe.");
  };
}

function renderDone(){

function sparkline(sessions){
  if(sessions.length<2) return `<p class="empty">Cuando termines un par de rondas verás aquí tu evolución.</p>`;
  const d=sessions.slice(-12), W=Math.max(320,d.length*46), H=96, P=18;
  const x=i=>P+i*((W-P*2)/(d.length-1)), y=v=>H-P-(v/100)*(H-P*2);
  const pts=d.map((s,i)=>[x(i),y(s.pct)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1], lastV=d[d.length-1].pct;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precisión de las últimas rondas">
    <line x1="${P}" y1="${y(50)}" x2="${W-P}" y2="${y(50)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${P}" y="${y(50)-5}" fill="var(--ink-faint)" font-size="10" font-family="IBM Plex Mono, monospace">50%</text>
    <path d="${path}" fill="none" stroke="var(--pen)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}"
        fill="${i===pts.length-1?"var(--pen)":"var(--card)"}" stroke="var(--pen)" stroke-width="2"><title>${esc(d[i].title)} · ${d[i].pct}% · ${fecha(d[i].ts)}</title></circle>`).join("")}
    <text x="${Math.min(last[0]+8,W-30)}" y="${(last[1]-9).toFixed(1)}" fill="var(--ink)" font-size="11" font-weight="600" font-family="IBM Plex Mono, monospace">${lastV}%</text>
  </svg>`;
}

        const into=Math.max(0,Math.min(span,S.xp-L.xp));
        const need=i===0?"nivel de partida":"+"+(L.xp-prev.xp)+" XP desde "+prev.name;
        return `<div class="rung ${state}">
          <span class="rung-dot">${state==="done"?"✓":(state==="now"?"●":i+1)}</span>
          <span class="rung-body">
            <span class="rung-name">${esc(L.name)}${state==="now"?'<span class="rung-tag">tu nivel</span>':""}</span>
            <span class="rung-need">${need}</span>
            ${state==="now"&&nxt?`<span class="rung-bar"><i style="width:${Math.round(into/span*100)}%"></i></span>

    <div class="scale">
      ${Array.from({length:11},(_,k)=>{
        const r=k+1, m=multOf(r===1?1:r), on=st.bestStreak>=r;
        return `<div class="step ${on?(r===11?"top":"on"):""}"><div class="m">${fmtMult(m)}</div><div class="r">racha ${r}${r===11?"+":""}</div></div>`;
      }).join("")}
    </div>
  </div>

  <div class="panel">
    <h3>Preguntas dominadas por unidad</h3>
    <p class="sub">Porcentaje de preguntas acertadas al menos una vez. Pasa el ratón por encima para ver el detalle.</p>
    <div class="bars">
      ${unitRows.map(r=>`<div class="barrow" title="${esc(r.u.title)}: ${r.ok} de ${r.items.length}">
        <span class="nm">${r.u.short} · ${esc(r.u.title)}</span>
        <span class="bartrack"><span class="barfill" style="width:${Math.max(1,r.pct/maxPct*100)}%"></span></span>
        <span class="vv">${r.pct}%</span>
      </div>`).join("")}
    </div>
  </div>

  <div class="panel">
    <h3>Evolución de las últimas rondas</h3>
    <p class="sub">Porcentaje de aciertos de cada ronda terminada, de la más antigua a la más reciente.</p>
    ${sparkline(st.sessions)}
    ${st.sessions.length?`<div class="tablewrap" style="margin-top:14px"><table class="rep">
      <thead><tr><th>Fecha</th><th>Ronda</th><th>Resultado</th><th>XP</th></tr></thead>
      <tbody>${st.sessions.slice(-8).reverse().map(s=>`<tr>
        <td class="mono">${fecha(s.ts)}</td><td>${esc(s.title)}</td>
        <td class="mono">${s.correct}/${s.total} · ${s.pct}%</td><td class="mono">+${s.xp}</td></tr>`).join("")}</tbody></table></div>`:""}
  </div>

  <div class="panel">
    <h3>Informe de autocorrecciones</h3>
    <p class="sub">Frases que el alumno dio por válidas con el botón «Mi frase también vale». Máximo ${SELFMARK_MAX} por ronda. Conviene revisarlas una a una.</p>
    ${selfN?`
      <div class="tablewrap"><table class="rep">
        <thead><tr><th>Fecha</th><th>Unidad</th><th>Enunciado</th><th>Respuesta del alumno / modelo</th></tr></thead>
        <tbody>${st.selfmarks.slice().reverse().map(r=>`<tr>
          <td class="mono">${fecha(r.ts)}</td>
          <td class="mono">${r.unit} · Ej. ${r.exN}</td>
          <td>${esc(r.q).slice(0,120)}</td>
          <td><span class="yours">${esc(r.given)}</span><br><span class="right">${esc(r.model)}</span></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
        <button class="btn" id="dlbtn">⬇ Descargar informe (CSV)</button>
        <button class="btn ghost" id="copybtn">Copiar al portapapeles</button>
        <button class="btn ghost" id="clearself">Vaciar informe</button>
      </div>
      <p class="fb-note" id="dlnote" hidden style="margin-top:10px;display:block;line-height:1.5">Con el enlace compartido en público, el navegador no deja que la página guarde archivos. Pulsa <b>Copiar al portapapeles</b> y pega el contenido en Excel o Google Sheets: se abre en columnas.</p>`
    :`<p class="empty">Todavía no se ha usado ninguna autocorrección. Aquí aparecerán con fecha, enunciado, la respuesta del alumno y la respuesta modelo.</p>`}
  </div>

  <div class="panel">
    <h3>Empezar de cero</h3>
    <p class="sub">Borra progreso, XP, tokens y estadísticas de este navegador. No se puede deshacer.</p>
    <button class="btn ghost" id="reset">Reiniciar todo el progreso</button>
  </div>`;

  document.getElementById("back").onclick=()=>go({name:"home"});

<script type="module">
/* =====================================================================
   SINCRONIZACIÓN — Firestore
   El progreso sigue guardándose en el navegador (funciona sin conexión);
   esta capa lo sube a la nube y lo baja al entrar desde otro dispositivo.
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPZ54PzHWwb78e4u0lA_dgxTsPt3-aaxU",
  authDomain: "ingles-web-alumnos.firebaseapp.com",
  projectId: "ingles-web-alumnos",
  storageBucket: "ingles-web-alumnos.firebasestorage.app",
  messagingSenderId: "852909277881",
  appId: "1:852909277881:web:26e9a85c23b1526ab89168"
};
const CLASE = "5c96aa91a9d5";

try{
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const auth = getAuth(app);
  const ref = id => doc(db, "clases", CLASE, "progreso", id);
  window.CLOUD = {
    async load(id){ const s = await getDoc(ref(id)); return s.exists() ? s.data() : null; },
    async save(id, data){ await setDoc(ref(id), data); },
    async login(email, pass){ const c = await signInWithEmailAndPassword(auth, email, pass); return c.user.email; },
    async logout(){ await signOut(auth); },
    email(){ return auth.currentUser ? auth.currentUser.email : null; }
  };
  window.dispatchEvent(new Event("cloud-ready"));
  /* La sesión se recuerda en el dispositivo (persistencia local por defecto).
     Al arrancar, Firebase avisa una vez de si ya había alguien dentro. */
  let first = true;
  onAuthStateChanged(auth, user => {
    window.dispatchEvent(new CustomEvent("auth-state", { detail: { email: user ? user.email : null, first } }));
    first = false;
  });
}catch(e){
  console.warn("Sin sincronización:", e && e.message);
}
</script>
